  - id: DR-085
    patron: "the project lifecycle (phases) and what 'release' means — where the audit/security/quality/metrics hardening happens, and how an internal vs external deploy is tracked"
    default: "SIX phases, matching Mission Control's six Campaña rooms: research (pre-project) → product → design → architecture → implementation → release. TWO changes vs the old model: (1) CONSTRUCTION OWNS THE HARDENING — the security audit (OWASP + ASI Top 10), the quality close-out and the telemetry/metrics verification are the LAST STEP of construction (/pandacorp:implement), once every FRD is VERIFIED, NOT a separate release activity; the build leaves the project audited, quality-gated and instrumented before it sets phase: release. (2) RELEASE = LAUNCHED, and it ABSORBS the old 'operation' phase — there is NO separate operation/live phase. 'release' no longer means 'the act of auditing+deploying'; it means the product is DEPLOYED/LAUNCHED (internal or external) and from there it is iterated (/pandacorp:implement) and its results read (/pandacorp:review-launch, whose precondition is now phase: release). /pandacorp:release performs the deploy/launch + launch plan and sets phase: release + the idea card → status: shipped (the only card enum — 'lanzada' was the retired pre-2026-06-15 Spanish enum). INTERNAL vs EXTERNAL is tracked by a status.yaml field deploy_target: internal | external (NOT a phase): internal = an in-house tool used as-is with no external host (e.g. Mission Control on 127.0.0.1 — no external deploy, no production gate, no landing/GTM); external = deployed to an external server (Vercel/AWS/…) behind the human production gate (DR-004), with the launch plan (DR-042). Both are a real release of a software product — same 'release' concept, distinguished only by deploy_target (derived from return_type: personal/in-house ⇒ internal, monetary/mixed/opportunity ⇒ external). Iterating from release may loop back to construction in a future second build pass (conceptually allowed; the day-to-day is /pandacorp:implement). Canonical: factory/standards/build-orchestration.md §5b/§6, plugin/skills/{implement,release,review-launch,adopt,new-version}/SKILL.md."
    requiere_humano: false
    nota: "Day 1 routes post-release changes through implement; iterate is internal. Release remains the launched terminal phase, hardening closes construction and production authorization follows DR-138."

  - id: DR-086
    patron: "WHEN the build engine commits during a build — and therefore how much work an interruption (kill / cancel / internet drop / crash) discards"
    default: "Commit allowed unit work promptly through CLI report; workers do not perform git writes or stamp their own checks. The CLI serializes tracked WO transitions, rollups and landing metadata on lane/<run_id>/integration. Only merge-queue and G3 update main; interruptions preserve committed refs and reports. Canonical: BUILD-7/8/15 and DR-150."
    requiere_humano: false
    nota: "Day 1 replaces wave-end/main-writer commit machinery and its periodic supervisor decisions."

  - id: DR-087
    patron: "WHERE work-order dependencies are recorded (machine-readable) — and therefore whether Mission Control's dependency DAG shows the REAL graph or a fabricated one"
    default: "WORK-ORDER DEPENDENCIES LIVE IN A `dependsOn: [WO-NN-MMM]` FRONTMATTER FIELD — the canonical, machine-readable source of truth, mirroring the blueprint Build Plan DAG + the work-orders README 'Depends on' column (keep the three in sync). It lists the REAL upstream WOs a work order depends on (a WO can depend on several, across FRDs); `[]` when it is a root. It is HONEST data, never a fabricated sequential chain: a WO with no real predecessor declares `[]`, not 'the previous WO by number'. Mission Control's dependency graph (FRD-12 WoDag) reads `dependsOn` verbatim — independent node for `[]`, real cross-FRD edges otherwise; the old fallback that invented a per-FRD linear chain when a WO had no explicit deps is removed (it drew dependencies that did not exist — the DAG looked like every WO blocked exactly one other, never the real fan-in/fan-out). The work-orders skill writes `dependsOn`; lib/work-orders reads it. Wave serialization stays artifact-driven (DR-060); `dependsOn` is the dependency truth for traceability + visualization (and may inform ordering). Canonical: factory/standards/build-orchestration.md (Declared dependencies) + plugin/templates/docs/work-order-template.md + plugin/skills/work-orders/SKILL.md; consumed by mission-control FRD-12."
    requiere_humano: false
    nota: "owner-spotted (2026-06-24): the MC DAG showed every WO depending on exactly one other (a pretty linear chain) — 'en la vida real un WO bloquea varios y necesita de varios'. Investigation: the real cross-deps EXISTED in each FRD's work-orders/README.md 'Depends on' column (15/19 FRDs, with genuine fan-in/fan-out + cross-FRD), but lived only in human prose; lib/work-orders read no deps, and the DAG's deriveDeps FABRICATED a sequential 'depends on the previous WO in its FRD' chain as a fallback. Owner chose the durable fix: deps as machine-readable frontmatter. MC's existing WOs were backfilled into `dependsOn` from the README column (33 WOs; e.g. WO-01-000 fans out to 7, WO-18-001 fans in from 6 across 4 FRDs, WO-06-001←WO-06-012 non-sequential). Same class as the timeline's fake-bars (DR: don't fabricate — read real data or show honest emptiness). Plugin MINOR bump (new frontmatter field, backward-compatible: absent → []); OVERLAY_VERSION bump (template + skill changed → projects get it on /upgrade). See factory/decision-log.md + plugin/docs/decision-log.md + mission-control/docs/decision-log.md (2026-06-24)."

  - id: DR-088
    patron: "HOW a `fullPage` visual-fidelity baseline (DR-056) treats a region whose CONTENT is live, variable-length data (an idea-card grid, a proposals/feed list, an activity log) — whose row count changes the page height and breaks the screenshot diff even though the page renders correctly"
    default: "A VISUAL BASELINE ASSERTS THE PAGE CHROME, NOT THE DATA-DRIVEN LIST. Any region whose length is live data that changes the page height is MASKED from the `fullPage` baseline: mark its container `data-volatile` in the component (ideally `style={{display:'contents'}}` so the live layout is byte-identical — the marker only takes effect in the test, which hides `[data-volatile]` via the injected stylesheet alongside the existing data-testid exclusions). The baseline then gates layout, nav, headers and empty-state structure deterministically; the masked region's correctness is covered by its own unit/component/integration tests. This is the generalization of the per-region exclusions (dashboard-banners, activity-log, summary-text — DR-076/b50fa7a): a height-drifting list is not a fidelity regression, so it must not turn the gate RED on every data change or cold/warm reflow. Canonical: plugin/templates/stack-a-nextjs/e2e/visual.spec.ts (the `[data-volatile]` exclusion + its comment). Conformance-checked by /pandacorp:upgrade (DR-059)."
    requiere_humano: false
    nota: "owner-reported (2026-06-25): Mission Control's visual gate kept failing falsely on /board (tablero) and /proposals (propuestas) — both `toHaveScreenshot(..., {fullPage:true})` baselines coupled to LIVE factory data (idea cards on the board; the four self-learning streams + promotions queue on proposals) plus a cold/warm render reflow, so the page height drifted (/proposals 9769→9986→10203px across one session; /board on every add/discard/edit of a card) and the snapshot mismatched though the route rendered fine. Forced a manual --update-snapshots re-bless on almost every idea-base change (whack-a-mole). Fix: applied the exact b50fa7a/DR-076 pattern generically — `data-volatile` on the board's per-column cards list (IdeaBoardView) and on a display:contents wrapper around the proposals feed (page.tsx); added `[data-volatile]` to visual.spec.ts's hide list in BOTH mission-control and the stack template; re-blessed tablero+propuestas × desktop/mobile once. Shell + smoke gates still assert these routes render without console errors / error boundaries. PLUGIN PATCH (template-only fix, no skill/agent behavior change). See factory/decision-log.md + plugin/docs/decision-log.md + mission-control/docs/decision-log.md (2026-06-25)."

  - id: DR-089
    patron: "WHERE a project's always-on LOCAL deployment lives on disk and how it is named — the built, served snapshot of an internal tool (`deploy_target: internal` / `return_type: personal`, e.g. Mission Control on 127.0.0.1)"
    default: "LOCAL DEPLOYMENTS LIVE UNDER ONE CANONICAL ROOT, OUTSIDE THE SOURCE-PROJECTS AREA: `/Users/Shared/local-deployments/<project>/` (a sibling of `Proyectos/`, at the `Shared` level), each in a subfolder named EXACTLY after the project/repo — never a `-live`/`-deploy` suffix, never co-located inside `Proyectos/` next to source checkouts. The deployment is a PRODUCTION BUILD (`next build` + `next start`, not dev), kept in an ISOLATED git worktree so its `.next`/`node_modules` never collide with the dev checkout's builds/tests/verify.sh; LIVE gitignored factory data is read from the main checkout via `PANDACORP_FACTORY_ROOT`. It is served always-on via launchd (KeepAlive) on the project's reserved port. Redeploy = sync the worktree to the green HEAD + rebuild + restart the service. The dev checkout in `Proyectos/<project>` is where work happens; the deployment in `local-deployments/<project>` is the stable running copy — they are never the same folder."
    requiere_humano: false
    nota: "owner-stated (2026-06-25): the local deploy of Mission Control had been a worktree confusingly named `panda-corp-live` sitting inside `Proyectos/` (mixed in with the real source projects), which made it look like a separate project and made the owner unsure what it was / whether to delete it. It also poisoned the visual gate (reuseExistingServer reused the stale snapshot server). Rule: a clean, predictable home for all local deployments. Migrated MC: `git worktree move Proyectos/panda-corp-live → /Users/Shared/local-deployments/panda-corp`; updated `mission-control/.pandacorp/run/serve.sh` (cd) + `deploy-local.sh` (LIVE path); reloaded the launchd job (verified :1987 serves from the new path). Canonical standard: factory/standards/infra.md (Local deployments). Applies to every future internal/local deploy."

  - id: DR-090
    patron: "WHERE the manually-created REVIEW / TEST worktrees live on disk — the 'test the latest green build without stopping the agent' copies that `/implement` keeps pinned at `last_green_sha` and that Mission Control's snapshot panel (FRD-14) emits a `git worktree add` command for"
    default: "REVIEW WORKTREES LIVE UNDER ONE CANONICAL ROOT, OUTSIDE THE SOURCE-PROJECTS AREA: `/Users/Shared/review-worktrees/<project>/` (a sibling of `Proyectos/`, at the `Shared` level), each named EXACTLY after the project — NO `-review` suffix (the root already says it's for reviews), NEVER co-located inside `Proyectos/` next to source checkouts, and NEVER inside `.claude/` (tool-internal — risks Claude Code's worktree sweep deleting it). This mirrors the local-deployments root (DR-089): `Proyectos/` holds only source checkouts; every derived worktree lives in its own `Shared`-level root (`local-deployments/` for the always-on prod deploy, `review-worktrees/` for ephemeral green-snapshot testing). `/implement` creates/refreshes it (`git worktree add /Users/Shared/review-worktrees/<project> <last_green_sha>`, updated each time an FRD verifies); keep ONE per project and refresh it, don't accumulate."
    requiere_humano: false
    nota: "owner-stated (2026-06-25, same conversation as DR-089): the review worktree had been `Proyectos/<project>-review` — a sibling of the source projects, which (like the deployment) cluttered `Proyectos/` and confused the owner ('first time I hear of this project'). The owner asked whether they should go in `.claude/worktree` (Claude's default) or a dedicated root like the deployments — recommendation taken: a dedicated `Shared`-level root, NOT `.claude/` (the factory's review worktrees are deliberately persistent/manual, so they must stay out of what Claude Code's automatic sweep manages). Updated: factory/standards/infra.md (Worktrees → review-worktree root), plugin/skills/implement/SKILL.md (the `git worktree add` path), mission-control/src/lib/snapshot/snapshot.ts + its tests + FRD-14 AC-14-001.1/.2 (the command MC shows). The stale `panda-corp-review` (FRD-17 era, 2026-06-18) was removed; the next `/implement` recreates it under the new root."

  - id: DR-091
    patron: "the per-route VISUAL-FIDELITY oracle the reviewer judges a UI build against — and what happens when a project's design lives in ONE global prototype instead of per-FRD mocks"
    default: "RESILIENT FIDELITY ORACLE WITH A FALLBACK CHAIN + ENFORCE THAT EVERY UI FRD HAS AN ORACLE. The reviewer's per-route fidelity check (DR-072 advisory lens) previously fired ONLY 'when the FRD has approved mocks/' — so when the DR-056 sharding was skipped (no per-FRD mocks, the design is a single global prototype), it SILENTLY NO-OPPED, leaving only the DR-075 shell check. That is exactly how Mission Control shipped 17 un-sharded surfaces that diverged from the prototype while every gate stayed green. TWO reinforcements: (1) FALLBACK CHAIN (reviewer.md): the per-route oracle = per-FRD `mocks/<route>` -> ELSE the FRD frontmatter's `visual_source` (the global prototype's corresponding view/shard, rendered LIVE in a browser and A/B'd against the route screenshot) -> ELSE a `ui: true` FRD with neither is a FINDING (a UI build judged for fidelity blind is not acceptable), surfaced, never passed silently. Stays ADVISORY (DR-072 preserved — visual judges are reward-hackable; do NOT make it a hard block). (2) ENFORCEMENT (doc-lint.sh, DR-077): a `ui: true` FRD with no `fdd.md`, or with empty `mocks/` AND no `visual_source`, is flagged — the un-sharded surface that lets the fidelity check no-op is caught at the gate. Canonical: plugin/agents/reviewer.md (the fallback chain) + plugin/templates/shared/.pandacorp/doc-lint.sh (the completeness check). Extends DR-056/072/075/080."
    requiere_humano: false
    nota: "owner-driven (2026-06-26): forensic review of a long MC session where the owner hand-corrected dozens of fidelity gaps on Logros. Root cause verified against the repo: MC's overlay was 6 versions behind AND was never sharded — 17/19 FRD mocks/ are empty READMEs with visual_source pointing at the single global index.html, so the reviewer's mocks/-gated per-route check no-opped on them. The owner's own insight shaped the fix ('look in the FRD's mocks first, and if not there use the global html in design as the reference'). The heavier calibrated VLM fidelity judge stays DEFERRED (DR-080 note — needs a gold set, must stay advisory). Part of proposal 17 (enforcement & learning loop). See docs/proposals/17-enforcement-and-learning-loop.md + factory/decision-log.md + plugin/docs/decision-log.md (2026-06-26)."

  - id: DR-092
    patron: "shared DERIVED STATE (a level, a count, a status computed from the same sources) re-derived independently by several surfaces, drifting out of sync"
    default: "ONE SOURCE PER DERIVED VALUE — compute shared derived state ONCE and consume it everywhere. DR-057 prevents duplicate COMPONENTS; this prevents duplicate DERIVATIONS. A value computed from the data layer that more than one surface shows (e.g. the guild level, an aggregate count, a roll-up status) lives in a SINGLE cached function (a `React.cache()`/request-scoped resolver or one query module), and every surface reads THAT — never its own copy of the derivation. Re-deriving the same concept in two places is a defect: it drifts (the Mission Control header showed NV3 while the Logros hero showed NV1 because two call sites derived the guild level independently and one passed an unresolved path). The reviewer quality lens REJECTS a second independent derivation of a value an existing resolver already provides; the fix is to call the resolver, not re-implement it. Canonical: plugin/templates/rules/clean-code.md (the injectable rule — there is no factory/standards/clean-code.md) + plugin/agents/reviewer.md (quality lens). Pairs with DR-057 (components) + DR-078 (fail-loud reads)."
    requiere_humano: false
    nota: "owner-driven (2026-06-26, proposal 17 P2.6): the NV3-vs-NV1 bug — `getGuildState()` (a React.cache single source) was introduced as the fix, but nothing in the standards/reviewer forbade the re-derivation that caused it. Net-new: 'single source for derived STATE', the data-layer analogue of DR-057's 'reuse before create' for components. See docs/proposals/17. 2026-07-05: generalized by DR-115 (single source of truth as a factory-wide data-architecture law, factory/standards/single-source-of-truth.md); DR-092 remains the UI-resolver instance."

  - id: DR-093
    patron: "two or more agent/owner sessions working the SAME repo at once colliding on the shared gate and shared files (decision-logs, plugin.json, the registry)"
    default: "ISOLATE OR SERIALIZE CONCURRENT SESSIONS; APPEND-ONLY THE SHARED LOGS. Running two sessions on one working tree makes the shared gate flap (one session's half-built, unformatted, or knip-dirty WIP REDs the other's verify-before-stop) and collides on the few append-heavy shared files. RECOMMENDED DEFAULT: a second concurrent session works in its OWN git worktree (reuse the review-worktrees root pattern, DR-090) or on its own branch, and merges — so neither session's uncommitted WIP can break the other's gate. When sharing one tree is unavoidable, treat the gate as owned by one session at a time (don't end-turn-gate against the other's in-flight WIP), and keep the high-collision shared files — `decision-log.md` (every area), `factory/decisions/registry.yaml`, `plugin/.claude-plugin/plugin.json` — STRICTLY append-only/top-insert with a fresh dated block (never rewrite an existing entry), so two sessions add adjacent blocks instead of clobbering. A session must NEVER `git commit -a`/`git add -A` another session's incomplete WIP into its own commit, nor edit another session's uncommitted files to force the gate green. Canonical: factory/standards/build-orchestration.md (concurrency note)."
    requiere_humano: true
    nota: "owner-observed live (2026-06-26, proposal 17 P2.7): during one session a parallel session's IdeaPitch/discover feature broke the shared verify-before-stop gate 4× (unused param, test/impl mismatch, knip unused exports, stale visual baseline) and both sessions needed plugin.json + decision-logs. requiere_humano because choosing isolation (worktree/branch) vs serialized single-tree is an owner workflow decision; the append-only + no-sweep-others-WIP rules apply either way. See docs/proposals/17."

  - id: DR-094
    patron: "a canonical gate-config file (verify.sh / biome.json / knip.json / the VERBATIM e2e files) fixed IN-PLACE in a project, then silently reverted by the next /upgrade conformance overwrite"
    default: "DETECT IN-PLACE GATE-CONFIG DIVERGENCE AT UPGRADE, DON'T JUST OVERWRITE IT. The conformance overwrite (DR-059) is unconditional by design, but if a project's canonical gate-config legitimately diverged because a fix landed in-place (and was never back-ported), the overwrite silently reverts it (DR-076 — exactly how MC's knip@6 fix and biome `!**/*.py` were lost). So `/pandacorp:upgrade` MUST, BEFORE overwriting each canonical gate-config file, DIFF it against the template and — on any divergence — LOUDLY REPORT it (file + the diff) with the DR-076 instruction (back-port to plugin/templates/, don't fix in place), and only THEN overwrite. The overwrite stays unconditional (DR-059's binary guarantee preserved); the detector just makes the silent revert IMPOSSIBLE to miss, so a real in-place fix gets back-ported instead of lost. Pairs with the existing remind-backport-gate-config.sh edit-time nudge (DR-076). Canonical: plugin/skills/upgrade/SKILL.md (the gate-config conformance step)."
    requiere_humano: false
    nota: "owner-driven (2026-06-26, proposal 17 P2.8): in this session the dry-run diff before upgrade caught MC's biome.json ahead of the template (it would have reverted `!**/*.py` + trailingCommas); that catch was MANUAL. This codifies it as a required loud report inside /upgrade so the catch isn't luck. See docs/proposals/17 + DR-076."

  - id: DR-095
    patron: "how /spec produces the PRD/FRDs — the level of detail, and whether it ASKS the owner to resolve intent before generating vs invents requirements"
    default: "ASK BEFORE GENERATING (origin-calibrated) + FRDs COMPLETE-NOT-VERBOSE. (1) CLARIFICATION GATE: before writing the PRD/FRDs, the product-manager INFERS everything it can from the card/research/profile/standards and writes each as a visible `[ASSUMPTION: … — source]`, then asks only the MATERIAL, decision-changing gaps — in Spanish, grouped by lens (problema/scope · usuarios/flujos · datos&reglas · edge cases/errores · métricas · non-goals), concise, no filler. A MODE flag controls it (`--ask`/`--auto`/`--infer`), DEFAULTING by the idea's `origin`: a `new-idea` (`origin: owner`, owner-proposed) → `ask` (always present understanding+assumptions+questions and WAIT before generating); a `discover` idea (`origin: discovery`, intent INFERRED by the AI) → `auto` (ask only the key gaps the research didn't resolve, else proceed on the stated assumptions); `infer` never asks. Rationale: ambiguity is the #1 cause of an agent building the wrong thing, and a discovered idea's intent is inferred so it needs more elicitation than a user-proposed one. Resolved answers + standing assumptions are recorded in the PRD's 'Assumptions & open decisions'. (2) FRD DEPTH: the FRD is the build agent's contract, so it MUST carry data model, edge cases & error states, explicit non-goals, a worked example for the trickiest criteria, and an interface/contract sketch where it exposes/consumes one — BUT complete-not-verbose: over-specification overloads the agent's attention budget (lost-in-the-middle), and the build engine already passes one slice per agent (DR-056), so each FRD is complete on what matters, scoped, example-backed, contradiction-free; the PRD stays thin (depth lives in FRDs). Canonical: plugin/skills/spec/SKILL.md (step 4 gate + steps 5/6), plugin/agents/product-manager.md (rules 11/12 + SOP), plugin/templates/docs/{frd,prd}-template.md."
    requiere_humano: false
    nota: "owner-driven (2026-06-26): owner asked to make the spec docs the IDEAL input for build agents and to add a question-gate like PandaTrack's `create-frd-package` (3 discovery roles + 'do not create the FRD until critical ambiguity is resolved' + approval before writing). Deep-research (27 sources, 24/25 claims confirmed) validated: spec-driven dev (Kiro requirements→design→tasks, GitHub Spec Kit, EARS) is the right shape; ambiguity → wrong code; the over-specification/context-overload (lost-in-the-middle) failure mode is real, so 'as detailed as possible' is wrong — complete-not-verbose. The specific '66% / Cohen's d>1.2' clarification-questions stat was REFUTED, so the benefit is framed as an alignment lever, not a number. Owner set the calibration: new-idea always asks; discover infers then asks only key gaps; plus an explicit mode flag (ask/auto/infer)."

  - id: DR-096
    patron: "the owner fans out SEVERAL conversations/agents in parallel by hand (outside /implement) and the shared whole-program gate flaps — session A's verify.sh REDs on session B's in-flight WIP, A has no context on B and tries to fix or mask code it never wrote"
    default: "ISOLATE PARALLEL SESSIONS IN WORKTREES + REUNITE THROUGH A SERIALIZED MERGE QUEUE; ATTRIBUTE EVERY RED. /implement is collision-safe by construction (disjoint artifacts + single-writer, DR-060/086); this is the UNCOORDINATED case (DR-093), operationalized. (1) ISOLATE — a PER-SESSION reflex, NOT an orchestrator: the workflow is N independent natural conversations, so a session about to make a non-trivial code change (the SAME frontier as the write-gate; micro-edits stay in-tree) enters its OWN git worktree + branch ITSELF — the agent calls EnterWorktree, sanctioned by a standing rule in the project overlay — the moment it goes from planning to executing (isolate first, then edit). Reconstituting bootstrap on entry (.pandacorp/worktree-bootstrap.sh: pnpm install over the shared store — never symlink node_modules; .next per worktree; worktree-local launch.json on autoPort; secrets via the same out-of-repo sops exec-env; per-worktree DB for stateful projects via `CREATE DATABASE … TEMPLATE`, or PANDACORP_FACTORY_ROOT reference for stateless MC). Default-on, not detect-then-isolate (start-time detection is racy): a whole-program gate (tsc/knip/visual) cannot be scoped and only goes GREEN for a session whose foreign WIP isn't on disk — only isolation makes 'my gate sees only my work' true AND lets each parallel session actually reach done. (2) MERGE QUEUE (.pandacorp/merge-queue.sh): DR-141 amends the landing unit: several waiting independently verified branches form ONE integration branch and receive ONE full combined gate, never one queue call per source; a single change still lands alone. Reunite landing units through ONE serialized writer behind an atomic freshness-stamped merge.lock (clone build.lock, in the shared git dir): rebase onto current main tip → integration gate (verify.sh) on the combined result → ff-merge if green; the WORKTREE IS KEPT (deleting the invoking session's cwd dangles it — the agent restores the actual session cwd without removal, then invokes DR-145 validated session teardown); a non-auto-resolvable textual conflict (git exits non-zero) is HANDED BACK, never auto-forced. The integration gate is the arbiter of textual/type/test correctness but CANNOT close the semantic-conflict gap — mitigate with typing + seam tests + small frequent merges + human review on same-region overlap. (3) ATTRIBUTE: a RED outside the session's own changed files is a FOREIGN red — reported, never fixed or --update-snapshots-masked (DR-093's no-sweep rule, executable in verify-before-stop.sh). (4) VISIBILITY — never silently strand a forgotten worktree: the invariant is that a surviving worktree with an UNMERGED branch or dirty tree = pending work; a fully-merged clean survivor is cleanup debt (DR-145): restore the session cwd without removal, then validated session teardown; pending-work.sh lists this apart from unmerged product work. Surface it three ways: the .pandacorp/run/worktrees/ manifest; `.pandacorp/pending-work.sh` (unions surviving worktrees with `git branch --no-merged` — the branch outlives a swept worktree — with age/status, plus --json + --notify); and Mission Control showing a GLOBAL ambient 'N pendientes' indicator in the persistent shell (primary, cross-project) + a per-project breakdown in the summary tab (secondary). Committed work is never lost (a branch persists past the conversation); this stops it being forgotten. PROPAGABLE: every project declares (a) fixed vs autoPort ports, (b) a reproducible bootstrap, (c) its per-worktree state-isolation strategy. Canonical: factory/standards/build-orchestration.md ('Parallel manual sessions' section) + a standing self-isolation rule in the project overlay (guide.md.tpl) — NO orchestrator skill; an optional thin /pandacorp:merge escape hatch for an escalated conflict. Builds on DR-060/086/090/093."
    requiere_humano: true
    nota: "owner-driven (2026-06-26, proposal 18), verified live: while designing this, the session's own Stop hook RED'd on a `documentacion`-mobile visual diff caused entirely by a parallel session's uncommitted globals.css/Banner WIP — zero edits from this session — the exact whole-program-gate cross-contamination this fixes. requiere_humano because choosing parallel scope, the DB-isolation strategy, and whether a given merge auto-resolves are owner/workflow calls. See docs/proposals/18."

  - id: DR-097
    patron: "a work order/feature implemented DIRECTLY (built by hand, in or out of /implement) left at a stale implementation_status — the board shows finished, gate-green work in the wrong Kanban column (stranded at IN_REVIEW or earlier instead of Done)"
    default: "Work-order state must match independently verified reality. CLI-owned report/review/integration/landing transitions record code, state and rollups on the integration branch; only the CLI certifies VERIFIED after the required gates. Direct authorized edits must reconcile canonical docs and status through the owning lifecycle flow, never a manual status stamp. No agent checks off its own verification."
    requiere_humano: false
    nota: "Day 1 replaces manual settle-state/main-tree writers; canonical BUILD-7/8/13 and documentation.md."

  - id: DR-098
    patron: "a new project's visual design defaults to the factory's or a prior project's look (e.g. Mission Control's gamified pixel-art/RPG skin) instead of a design fit to THAT project's audience and use case"
    default: "EACH PROJECT EARNS ITS OWN VISUAL IDENTITY — there is NO factory-wide default aesthetic. The look is chosen FOR THE PROJECT, fit to its audience, use case and purpose; the EXPLORE path (design.md §1) researches the domain/audience and proposes directions FOR THAT PROJECT, and the audience constraint drives them (recruiter audience → professional/clean/confidence-inspiring; never gamified). Mission Control's gamified pixel-art/RPG skin is MC's OWN identity, NOT a template — never carry it (or any prior project's look) into a new project by default; reusing one project's aesthetic for another is a defect, the same class as ignoring an approved visual. Does NOT override the ADOPT-VISUAL path: when an approved visual exists for the project, fidelity to IT wins. Canonical: factory/standards/design.md §1b."
    requiere_humano: false
    nota: "owner-driven (2026-06-27): while re-speccing the personal-portfolio project (personal-page-v2), the owner asked that the gamified/RPG/pixel-art aesthetic stay scoped to Mission Control and that every project get its own design per audience — that one needs a professional, trust-inspiring look for recruiters. Reinforces the §1 EXPLORE 'bespoke per domain, never a house style'."

  - id: DR-099
    patron: "the worktree-isolation rule (DR-096) is a SOFT instruction — an agent rationalizes 'the tree is quiet' and edits the shared main checkout directly, leaving uncommitted WIP that REDs other sessions' gates; and a blocked merge or a cross-session red can leak into a conversation that should stay isolated"
    default: "ENFORCE ISOLATION AT THE EDIT MOMENT + KEEP CONVERSATIONS ISOLATED + LOUD HAND-BACK. (1) ENFORCEMENT, producer side: the PreToolUse write hook (plugin/scripts/warn-adhoc-write.sh) NUDGES to isolate whenever product CODE is edited directly in the SHARED main checkout (git-dir without /worktrees/) outside an active build — proactive + attributable (it is THIS session's edit), so 'the tree looks quiet' can no longer silently strand WIP (the racy detect-then-isolate mistake DR-096 warns against). Non-blocking (the agent judges significant-vs-micro), but in-the-loop at every shared-tree code edit; suppressed in a worktree and during an active build (the engine edits main in-place by design, DR-060). (2) LOUD HAND-BACK — TO THE OWNER, IN THE CONVERSATION: a merge that can't LAND is the session's OWN finished work stuck outside main; if the owner never hears, it is silently lost when the conversation ends. So it is loud on TWO channels: (a) merge-queue.sh fires a desktop notification on any non-precondition hand-back (rebase conflict 10 / red gate 11 / busy main 12) so it survives a scrolled-past message; AND (b) THE AGENT MUST SURFACE IT IN THE CONVERSATION IMMEDIATELY — a desktop notification is easily missed. On any hand-back the agent STOPS and tells the owner in plain language: what is blocked, WHY (the real reason), that THE WORK IS PRESERVED on its branch/worktree (nothing lost), and what is needed (the owner's decision, or the retry condition — e.g. 'main goes green'). The agent does NOT go off doing silent workarounds (deploying elsewhere, sitting on it, retrying forever) without first telling the owner. This is NOT the cross-session noise rule (3) suppresses — that silences OTHER sessions' reds; a blocked merge is THIS session's own deliverable and the owner MUST know. (3) CONVERSATION ISOLATION: an agent handles a FOREIGN red SILENTLY (recognise it via git-status ownership, never touch/mask it — DR-096 not-mine) and does NOT narrate to the owner what OTHER sessions are doing (cross-session status is PULL, in Mission Control, never noise pushed into a conversation); and never reports work as 'done' until it is actually in main. AT COMMIT TIME this is concrete: when `git status` shows files this session did NOT touch (another session's WIP), `git add` ONLY this session's own files (never `git add -A`) and commit — do NOT ask the owner whether to commit, and do NOT mention the other session's files. Committing only your own files is correct and needs no permission (it leaves the foreign WIP untouched, DR-093 no-sweep); pausing to narrate it or ask is exactly the cross-session noise this rule removes. (4) GATE-LEVEL SILENCE ON FOREIGN REDS: the Stop gate (plugin/scripts/verify-before-stop.sh) ATTRIBUTES a red before surfacing it. warn-adhoc-write.sh records every edit of the session to .pandacorp/run/sessions/<session_id>.touched (gitignored runtime); on a red the gate compares the dirty + blamed files (by NORMALIZED repo-relative path — hardened from the original basename match, BL-0005 closed 2026-07-01) against that record, and when NONE of this session's edits are implicated it ALLOWS THE STOP SILENTLY (logs to run/foreign-red.log for PULL visibility, emits NO stderr) instead of dumping another session's failure into the conversation. FAIL-CLOSED: a red touching any file this session edited (dirty or blamed), OR one that cannot be attributed (no per-session record), still BLOCKS — never silence a red that might be yours. Net effect: the owner is interrupted ONLY by their OWN session's reds; a foreign red is handled by the gate without a word. Canonical: plugin/scripts/warn-adhoc-write.sh, plugin/scripts/verify-before-stop.sh, plugin/templates/shared/.pandacorp/merge-queue.sh, project overlay guide.md. Builds on DR-096/097."
    requiere_humano: false
    nota: "owner-driven (2026-06-27): the agent built FRD-21 directly in the shared main checkout ('the tree is quiet') instead of a worktree, leaving uncommitted WIP that RED'd a parallel session's gate — exactly what DR-096 prevents, but DR-096 was a SOFT rule the agent rationalized past (and it wasn't even live in that already-running session). The owner asked to make it enforced. The PreToolUse isolation nudge + the loud merge hand-back + the conversation-isolation rule are the enforcement layer DR-096 lacked. A hard PreToolUse BLOCK was rejected: a hook can't reliably tell a significant change from a micro-edit, so it would trap legit work or mis-fire — hence a persistent in-the-loop nudge, not a lock. Refinement (owner-driven 2026-06-27): the Stop gate was STILL dumping a FOREIGN red (another session's in-flight WIP) into the conversation — the owner found that cross-session noise stressful and useless ('don't tell me about other sessions unless it needs my decision'). Mechanism (4) makes the gate itself attribute and stay SILENT on a foreign-only red, escalating only the session's own reds. The needs-a-decision case (an unresolvable merge conflict) is still surfaced — by the loud hand-back (2), not by the gate. SECOND REFINEMENT (owner-driven 2026-06-30): a Party-liveness change was built green in a worktree but its merge-queue HANDED BACK repeatedly (the parallel FRD-10 build left main's gate red on its OWN dead exports, then a worktree-e2e env gap) — and the owner NEVER HEARD: the agent stayed silent (over-applying conversation-isolation (3)) and went off doing :1987/:3100 workarounds; the owner only found out by asking, and warned the work could be LOST. TWO holes: (i) the project's merge-queue.sh copy was STALE — it lacked the loud-hand-back desktop notification the template (2) added, so even channel (a) was dead (fix: sync the script; /upgrade re-syncs drifted copies); (ii) mechanism (2) only mandated a DESKTOP notification, not that the AGENT tell the owner IN CHAT — easily missed. (2) now requires BOTH channels and makes the agent's in-conversation surfacing of its OWN blocked merge mandatory and explicitly EXEMPT from rule (3)'s cross-session silence (a blocked merge is the session's own deliverable, not another session's noise). See factory/decision-log.md (2026-06-30). THIRD REFINEMENT (BL-0033, 2026-07-04): the isolation nudge (1) is SCOPED — in the FACTORY repo it no longer fires on factory-only prose/config edits (factory/, docs/, plugin/**/*.md, .claude/), which run no whole-program gate a parallel session could red; it still fires on gated/shipped surfaces (plugin/{scripts,hooks,templates}, mission-control/) and in every product project. The landing hint is repo-aware: projects land via their merge queue; the factory has NO merge queue — worktree branches merge directly back to main (constitution §11). Self-tested by plugin/scripts/test-warn-adhoc-write.sh."

  - id: DR-100
    patron: "how /architecture and /work-orders produce the technical blueprint + work orders — the precision/altitude of the docs and whether the plan's cohesion is CHECKED before the build, so the autonomous build is ideal (the build-side counterpart of DR-095, which fixed the spec/FRD side)"
    default: "RIGHT-SIZE + ANTI-OMIT + A CHECKED READINESS GATE. The factory's pipeline (FRD→blueprint/ADR→work-orders) is validated by the state of practice (Kiro requirements→design→tasks, BMad architecture-before-stories + context-embedded stories, GitHub Spec Kit WHAT/HOW split + ambiguity markers, EARS); the gap was ENFORCEMENT + a few precision levers, not the design. (1) READINESS GATE (BMad-style cohesion check, build-side counterpart of DR-095): before a blueprint goes ACTIVE, a FRESH reviewer agent (never the authoring architect — constitution rule 4; same independence as DR-102's grounding gate; audit-20) asserts fail-closed: every REQ→component, every AC covered by EXACTLY ONE work order (no gaps/dupes), data model has no TBD, dependsOn acyclic + complete, wave artifacts disjoint by design, foundation complete (DR-057 asserted at plan time), each backend WO's docs/api/<wo>.md contract ASSIGNED in the plan (listed in that WO's artifacts, its consumer depending on it — the file itself is authored at build time, DR-060), and NO [NEEDS CLARIFICATION] survives. On pass, architecture step 9b2 stamps `readiness_gate: passed <date>` (+ `grounding_gate` from DR-102) into the blueprint frontmatter and owns the DRAFT→ACTIVE flip; /implement's preflight RE-CHECKS by asserting those stamps on every ACTIVE blueprint + a residual-marker grep (the re-check is a real mechanism, not prose — audit-20 P1-1). 'A blueprint with holes produces ambiguous work orders' becomes a CHECKED gate, not a hope. (2) [NEEDS CLARIFICATION] BLOCKING MARKER (Spec Kit): an unresolved, build-CHANGING question is marked inline `[NEEDS CLARIFICATION: q]` (distinct from a resolved `[ASSUMPTION: … — source]`, DR-095) — it BLOCKS, a doc may not reach status: ACTIVE while one survives; cabled fail-closed in verify.sh (a marker in an ACTIVE doc is RED; DRAFT may still carry it). (3) RIGHT-SIZE WITH CALIBRATED BOUNDS (empirically calibrated 2026-07-01 from the personal-page-v2 + Mission Control builds; canonical numbers in build-orchestration.md §2): TARGET ~25-50 min of build / ~1.5-4k LOC of artifacts per WO. CEILING — split above ~4k LOC / ~45 min (MC WOs >6k LOC averaged 3.0 gate rejects vs 0.8 below 3k; the 7k-LOC 'whole Configuración in one WO' took 5 gate attempts / 20h) and on the qualitative triggers (unreviewable in one sitting, context rot, >1 concern). FLOOR — the FRD gate has a FIXED ~9-min cost, so do NOT emit an FRD whose only WO builds in under ~20 min (ppv2's FRD-08 paid 127% gate overhead): the PM merges it into the feature it extends at spec time, or the architect folds it into a sibling WO; a 1-AC cosmetic change is a change-queue item, never its own feature. (3b) ARTIFACTS DECLARED COMPLETE: the readiness gate also asserts each WO's `artifacts` globs cover EVERY file/dir that WO will write (not merely disjoint from siblings) — an undeclared output is invisible to DR-060, and with global waves (BL-0021) it can collide ACROSS FRDs. (4) ANTI-OVER-SPECIFICATION: if a blueprint/WO 'reads like code' it is over-specified (loses the abstraction benefit, overloads attention) — specify at the altitude (contracts/shapes), not line-by-line; a canonical worked example beats enumerating every edge case. (5) COMPLETENESS 20% (anti-omission): AI builders ship the ~80% happy path and drop the production 20% (error path per failure mode, validation beyond types, empty/partial states, observability, security) — so the FRD names the applicable items, the WO's Status-Note enumerates met/unmet AC (surfacing, NOT self-certifying — rule 4 preserved), and the reviewer's correctness lens verifies the build against the list (a missing item BLOCKS, it is not a visual nit). (6) STRUCTURED CONTRACTS: the FRD interface sketch + blueprint Contracts use a fixed shape (input+validation / success+status / errors / invariants). (7) EARS CALIBRATION: not every requirement fits EARS — >~3 preconditions → a table/decision-table; clarity over template. Canonical: plugin/skills/{architecture,work-orders,spec}/SKILL.md, plugin/agents/{architect,product-manager,reviewer}.md, plugin/templates/docs/{frd,work-order,blueprint}-template.md, factory/standards/{build-orchestration.md §2/§3b,quality.md}, plugin/templates/stack-a-nextjs/verify.sh (residual-ambiguity gate)."
    requiere_humano: false
    nota: "owner-driven (2026-06-28): owner asked to make /blueprint + /work-orders generate consistently precise docs (ni más ni menos) so the 100%-AI build is ideal, with freedom to also touch /spec. Deep-research (28 sources, 125 claims, 24 confirmed 2/3-adversarial, 1 refuted) cross-walked against the factory's own skills: the FRD→blueprint→work-orders shape is validated by Kiro/BMad/Spec Kit/EARS — bones correct, the gap is that precision lived as prose not as a cabled gate. One claimed statistic was REFUTED in verification and is not used; the single-concern-per-task principle it touched stands on its own (curse-of-instructions + mixing-work-types-is-anti-pattern) and is what the work-order ceiling encodes. Extends DR-095 to the build side; the readiness gate is the BMad bmad-check-implementation-readiness analogue."

  - id: DR-101
    patron: "the per-surface QUALITY of what Claude Design generates in the EXPLORE design path — generation cadence, visual hierarchy, cross-page closing, real content, prompt discipline, and the per-screen review (batch-2, on top of DR-058's connection/brief + DR-062's cohesion)"
    default: "GENERATE THE FULL SCREEN SET IN A TWO-STAGE CADENCE + WEIGHT=IMPORTANCE + REAL CONTENT + EXPLICIT PROMPTS + A PER-SCREEN RUBRIC. Batch-2 design-phase rules learned driving the Claude Design canvas on personal-page-v2 (2026-06-28), on top of DR-058 (real connection + exhaustive anti-omission brief + pull-and-review) and DR-062 (cross-surface cohesion). (1) TWO-STAGE CADENCE, NEVER STOP AT THE LANDING: Stage 1 generates the design SYSTEM (tokens/brand/full component gallery+states+motion per the §1c checklist) → owner approves; Stage 2 generates ALL the UI-FRD screens — ENUMERATED BY THE SKILL from the FRDs (every ui:true FRD → its screen(s)) — one screen at a time with pull-and-review; the owner must never have to ask 'where are the other pages?' (only the landing generated until the owner asked page-by-page = the bug). (2) WEIGHT = IMPORTANCE (hierarchy/proportion): the surface's primary action/conversion gets prominent treatment (the shared cta-band), never an undersized one-line link (the contact CTA — THE conversion — shipped as a tiny text link); primary>secondary>tertiary, no key element rendered tiny, no secondary/decorative element out-shouting the primary; and DO NOT open a page with a context-free hero image (lead with title+context+at-a-glance, image contained/secondary — recruiters skim <60s). (3) ONE SHARED CLOSING cta-band reused on every page (reinforces DR-062): a first-class component in components.md, not a per-page ad-hoc 'let's talk' link (that is both a hierarchy and a cohesion defect). (4) REAL CONTENT, NEVER INVENTED: lists/cards/stack/archive/metrics derived from the owner's REAL sources (GitHub, sibling projects, projects.json, the brief), balanced lengths so cards align; placeholders only where data is genuinely pending and VISIBLY marked, never plausible-looking invented data. (5) EXPLICIT PROMPTS: name the element + the action + what stays ('Delete the ENTIRE element including its text and link; replace with nothing', not a vague 'remove the note'). (6) PER-SURFACE PLAYBOOKS (case study / Now / blog index / blog post / contact / projects-archive / stack) captured once so future projects don't re-research them live: plugin/skills/design/references/surface-playbooks.md. (7) PER-SCREEN REVIEW RUBRIC: before the owner gate the agent PULLS each generated screen (DesignSync get_file — from the real file, not memory/old screenshots) and checks hierarchy · cohesion · real content · all states · responsive · a11y · motion · no dead/placeholder where a real value/route exists · @dsCard present · surface-playbook followed. Canonical: factory/standards/design.md §7 (shared cta-band) + §9 (hierarchy) + §10 (real content) + §11 (two-stage cadence + explicit prompts) + §12 (rubric); plugin/skills/design/SKILL.md (EXPLORE path); plugin/skills/design/references/surface-playbooks.md. Factory-internal design-phase guidance (consumed by the design skill + designer/reviewer agents) — like DR-058/DR-062 it does NOT inject a project rule, so no rule-library/OVERLAY change."
    requiere_humano: false
    nota: "owner-driven (2026-06-28): batch-2 of the Claude Design learnings from personal-page-v2, codified via /pandacorp:learn IN THE FACTORY ON TOP of plugin v9.24.0/DR-058 §1c (do not redo: real connection, exhaustive brief + anti-omission checklist, image placeholders, mandatory motion, breakpoints by target_platforms, pull-and-review, token authorship). The skill's canvas guidance was still too loose: only the landing generated until the owner asked page-by-page; the contact CTA (the conversion) came out as a one-line link; prompts were ambiguous (a vague 'remove the note' left stray text); per-surface quality had to be re-researched live. Pairs with DR-058 (generation mechanism/brief) and DR-062 (cohesion — DR-101's shared cta-band is the closing-frame instance). Source lesson: personal-page-v2 memory claude-design-skill-improvements (promotion: approved). See factory/decision-log.md + plugin/docs/decision-log.md (2026-06-28). Plugin v9.26.0→v9.27.0 (MINOR)."

  - id: DR-102
    patron: "after /architecture installs the stack and writes the architecture/blueprints/work-orders, NOTHING re-checks those docs against the REAL installed scaffold — so a blueprint can cite a framework API/file-convention/version the model only REMEMBERS (outdated), which then surfaces as mid-build rework ('context blindness'); plus the supporting gaps that feed it: dep versions pinned only in prose, no env-var inventory, no version-matched agent docs, and NFRs left implicit"
    default: "REPO-GROUNDING + GROUNDED ARTIFACTS, on top of DR-100's cohesion gate. The single most evidence-backed AI-build error-reducer is validating the plan against the actual repo BEFORE code generation; DR-100 proved internal COHESION, this adds external FIDELITY to the installed scaffold. (1) REPO-GROUNDING VALIDATION GATE (/architecture step 9b, before any doc goes ACTIVE; re-checked by /implement preflight): a fresh reviewer (not the author) verifies EVERY concrete claim in architecture.md + per-FRD blueprints + work orders against the scaffold installed in step 6 — (a) every cited file/dir path exists or is creatable as written under the installed framework's conventions (catches e.g. Next 16 `proxy.ts` vs the remembered `middleware.ts`); (b) every cited framework API/config key is current for the INSTALLED major, cross-checked against the framework's version-matched docs (the AGENTS.md pointer, not training memory); (c) every dependency version named in architecture.md is actually installed OR carried as an exact `pnpm add <pkg>@<version>` in a WO (no prose-only version); (d) hard guarantees are achievable as specified, verified against a real build (e.g. next-intl `setRequestLocale` present so `[locale]` is static, confirmed by `pnpm build`, not assumed). Any mismatch BLOCKS until fixed. (2) PIN VERSIONS AT THE INSTALL POINT, not in prose: install at the chosen versions or write the exact `pnpm add <pkg>@<version>` into the foundation WO. (3) GENERATE `.env.example` as a standard blueprint artifact (env-var inventory; commit it, keep real .env gitignored). (4) GENERATE/REFRESH `AGENTS.md` pointing agents at the framework's VERSION-MATCHED bundled docs (the create-next-app pattern; the model-uses-outdated-API fix). (5) NFRs EXPLICIT PER-WO: the work-order completeness-20% names security + performance + a11y + reduced-motion, not just functional ACs (NFRs are the most systematically dropped class in AI builds). HOLD THE ALTITUDE (DR-100): this grounds and currents the plan, it does NOT inflate it — tighten contracts + fix mismatches; spec VOLUME/quality alone does not reduce defects, grounded contracts + executable checks + repo-grounding do. Canonical: plugin/skills/architecture/SKILL.md (step 6 pins/.env.example/AGENTS.md + step 9b repo-grounding gate), plugin/templates/docs/work-order-template.md (explicit NFRs). Extends DR-100; factory-internal skill/template guidance (consumed by /architecture + architect/reviewer) — does NOT inject a project rule, so no rule-library/OVERLAY change."
    requiere_humano: false
    nota: "owner-driven (2026-06-29): on personal-page-v2, right after /blueprint produced a strong plan (115 ACs fully covered, acyclic DAG, disjoint artifacts) + installed the stack green, an adversarial audit found 4 BLOCKERS that would have caused mid-build rework — all 'context blindness' against the real installed stack: docs said `middleware.ts` but Next 16 renamed it `proxy.ts`; `setRequestLocale` missing so `[locale]` rendered DYNAMIC (broke the $0/static guarantee); theme attribute mismatch; dep versions pinned only in architecture.md prose. Deep-research (22 sources, 25 claims 2/3-adversarially verified) confirmed the remedy: validating intermediate artifacts against the actual repo BEFORE codegen is the #1 error-reducer (arXiv:2604.05278); AGENTS.md→version-matched docs measurably cuts outdated-API errors (Next.js /evals); NFRs are systematically absent (~14%, arXiv:2511.12884); and — important caveat, honored in the default — more/better spec VOLUME does NOT reduce defects (SSRN 6515898), so this grounds the plan, it does not inflate it. Extends DR-100 to add the missing external-fidelity half. The audit's 4 blockers were fixed in personal-page-v2 in the same session. See factory/decision-log.md + plugin/docs/decision-log.md (2026-06-29). Plugin v9.27.0→v9.28.0 (MINOR); no OVERLAY change (skill+template only)."

  - id: DR-103
    patron: "the factory's self-learning MEMORY (factory/memory/) was accumulating ACTIONABLE items — defects in the factory's own tooling (build engine, skills) and their file-by-file fix plans — disguised as durable lessons (e.g. LESSON-0002/0003/0004: each an anti-pattern whose 'Apply next time' is really a build-engine fix to make and CLOSE, not knowledge to retrieve). Same blur in docs/proposals/: audit P0/P1/P2 findings (actionable, closeable) live inside narrative RFCs. The factory had no home for plane-3 'actionable, closeable' work on its own tooling — a project has one (.pandacorp/inbox/changes/ via /change), the factory never mirrored it for itself"
    default: "THREE PLANES SEPARATED BY DURABILITY, WITH A ROUTING RULE. Keep three structurally-different stores apart (conflating them is a documented failure mode — a knowledge store that accumulates one-off/resolved items degrades retrieval and re-surfaces stale actions, 'temporal memory contamination'; mature practice separates them: Google SRE lesson-learned vs closeable action-item 'each lesson maps to ≥1 AI'; ITIL Known-Error DB vs Problem Record; RFC/ADR load-bearing artifacts vs scaffolding-archived-once-shipped). (1) PLANE 1 — DURABLE KNOWLEDGE (`factory/memory/`, standards, this registry, ADRs): retrievable lessons/verdicts/patterns/gotchas, read again before building something similar, forever; retrieved · re-weighted · deprecated, NEVER 'closed'. (2) PLANE 2 — NARRATIVE PROPOSAL (`docs/proposals/`): a research/audit/strategy doc that informs ONE decision; read once → decided → archived. (3) PLANE 3 — ACTIONABLE ITEM (`factory/backlog/`, NEW): a defect to fix or a change to make in the factory's OWN tooling (plugin, build engine, templates, standards machinery, hooks); opened → doing → done → CLOSED (an obsolete/infeasible item is closed with a reason, never kept forever). ROUTING RULE at every capture point (a lesson candidate, an audit finding, an owner remark): 'would a future agent RETRIEVE this before building something similar?' → memory; 'does someone have to DO something and then CLOSE it?' → factory/backlog; 'a research doc decided once?' → docs/proposals; 'BOTH a durable lesson AND a required fix?' → SPLIT — the actionable defect to the backlog, the GENERALIZABLE lesson (durable 'why', stripped of the file-by-file plan) stays in memory, linked to the backlog id (the lesson survives after the fix ships; the item closes). SCOPE: factory/backlog is for the FACTORY's own tooling ONLY; a defect/change in a PRODUCT project (Mission Control, siblings) goes to THAT project's .pandacorp/inbox/changes/ via /change, never the factory backlog (the factory backlog is not an 'inbox' — .pandacorp/inbox/ is a project→factory channel). ENFORCEMENT: the `librarian` (/pandacorp:memory) applies the routing rule when it refines the raw inbox — a `gap ·`/defect note routes to factory/backlog, only durable knowledge to factory/memory. Canonical: factory/backlog/README.md (the plane model + routing rule + item schema), factory/memory/README.md ('What this is NOT' pointer), plugin/skills/memory/SKILL.md + plugin/agents/librarian.md (the harvest routing step), plugin/skills/learn/SKILL.md (step 0 — the front-door router: an actionable factory-tooling defect/change is filed in factory/backlog, not forced into a standard), CLAUDE.md ('Changing the factory itself — route by plane' table). Factory-internal governance — does NOT inject a project rule, so no rule-library/OVERLAY change."
    requiere_humano: false
    nota: "owner-driven (2026-06-30): the owner saw LESSON-0002 in Mission Control's promotions queue and felt it was 'a bug to fix, not a lesson learned' — memory should be only 'things we learned / decisions that worked, to apply to a similar future situation', not bugs/errors/change-requests. Deep-research (deep-research skill: 23 sources, 25 claims 2/3-adversarially verified, 2 refuted) UNANIMOUSLY confirmed the intuition (A-MEM/NeurIPS 2025, MemGPT/Letta, ExpeL/AAAI 2024, the 2026 Memory-for-Agents survey; Google SRE, ITIL) — durable memory and an actionable queue are two stores with OPPOSITE lifecycles, and bugs/change-requests must not enter the learning store. Follow-up web research (RFC/ADR vs backlog) settled proposals: they are plane-2 RFCs that FEED the backlog, not merged into it. 3 of 4 existing lessons (L-0002/03/04, all anti-pattern/promotion:proposed) were plane-3 defects mis-filed; they were SPLIT (defect→factory/backlog BL-*, durable anti-pattern→memory, promotion reset to none). Audit-19 (docs/proposals/19) open FACTORY-TOOLING findings were extracted to factory/backlog; its Mission-Control-drift findings route to MC's own change queue. Store name deliberately 'backlog' not 'inbox' (owner: the factory has no inbox; inbox is the project→factory channel). See factory/decision-log.md (2026-06-30); factory/backlog/README.md. Plugin (librarian routing) bumped MINOR; no OVERLAY change (factory-internal). Day 1 DEC-14/DEC-16: nested projects and factory-root runs write an untracked local handback/engine-backlog-<run>.md draft, surfaced in summary.need_from_owner; no factory backlog write in that main checkout. Standalone projects retain ordinary factory backlog behavior (test-build-v2-nested.mjs)."

  - id: DR-104
    patron: "how the HUMAN GATES (production deploy, destructive git) are enforced — prose in skills vs mechanical rules the agent cannot rationalize past"
    default: "HUMAN GATES ARE MECHANICAL WHERE A COMMAND SHAPE EXISTS. infra.md always said gates ship as deny rules + hooks, 'NOT as limits stated in the conversation (context compaction can lose them)' — but the production gate was prose-only. Now block-dangerous.sh enforces: (1) PRODUCTION DEPLOY (DR-004): `vercel --prod`, `flyctl|fly deploy`, `railway up|deploy`, `wrangler deploy|publish` are BLOCKED with a message that names the gate — the agent presents staging + costs, the OWNER approves explicitly in the conversation, and only then the deploy runs (the approved re-run is the sanctioned path). Preview/staging deploys (e.g. bare `vercel deploy`) stay free. (2) HARD RESET: `git reset --hard` is allowed ONLY with an explicit hex-SHA target (the engine's DR-065/DR-067 restore-to-last_green_sha recovery, which precedes it with a merge-base ancestry check); bare/`HEAD~N`/branch-ref forms — the destructive human-mistake shapes — stay blocked. This resolves the hook-vs-engine contradiction where the blanket block made the engine's own sanctioned overnight recovery un-executable. Canonical: plugin/scripts/block-dangerous.sh, factory/standards/infra.md (Human gates as hard rules)."
    requiere_humano: false
    nota: "audit-20 (2026-07-01), owner-approved batch: P1-5 (the factory's most important human gate was its softest — nothing mechanical stopped an agent that drifted past the prose) + P1-20 (the blanket reset block fired even on read-only greps whose command TEXT contained the phrase, and contradicted engine line ~454's sanctioned recovery). Owner decision 1: narrow allowlist over changing the engine's recovery mechanism. Tested with a 6-case matrix (sha-target allowed; HEAD~ blocked; vercel --prod blocked; vercel preview allowed; flyctl blocked; normal cmds allowed)."

  - id: DR-105
    patron: "stacks B (Hono) / C (FastAPI) / D (scraper) have no canonical gate harness — can a project be built on them under the DR-059/DR-076 conformance doctrine?"
    default: "PROVISIONAL STACKS, DECLARED. Stacks B/C/D ship only a prose STACK.md (no canonical verify.sh/lint config/e2e set), so the conformance doctrine ('installed byte-for-byte; /upgrade diffs against the template; enforcement can never silently fall behind') is implementable ONLY for stack A today. Rather than pretend otherwise, each B/C/D STACK.md carries an explicit PROVISIONAL banner: before the FIRST real project is built on that stack, its canonical gate harness (verify.sh with set -euo pipefail + fail-closed lint/type/test/dead-code gates + canary fixtures per DR-079) must be built FIRST — tracked as a factory-backlog item (BL-0016). The browser gates are N/A for headless stacks and that opt-out is DECLARED in the guide (DR-059: an opt-out is a decision, not an omission). The architecture skill must treat choosing B/C/D as triggering that harness work, not as a silent hand-rolled verify.sh."
    requiere_humano: false
    nota: "audit-20 (2026-07-01), owner decision 5: declare-honestly over build-now — the portfolio is 100% stack-A so far; building three harnesses with no consumer would be speculative. The banner + BL-0016 make the gap visible at the exact moment it would bite (first non-Next project). TRIGGER WIRED (2026-07-03, BL-0016 done, plugin v9.53.0): architecture SKILL.md step 6 now carries a CANONICAL-HARNESS TRIGGER GATE — for the resolved chosen stack it detects the absent verify.sh (the load-bearing signal, corroborated by the PROVISIONAL banner; stack D is a pointer stub that resolves to stack C) and forces building THAT stack's canonical harness first (mirroring stack A: verify.sh + canary.sh + lint/type config + DR-079 broken fixtures + declared browser-gate opt-out, proven via verify.sh --canary) OR escalating to the owner, never a silent hand-rolled verify.sh. The three harnesses are still built ON FIRST USE only (not speculatively); the banners are removed per stack as each is actually built + canary-proved."

  - id: DR-106
    patron: "which e2e/browser gates run at the per-FRD gate vs at close-out — the focused gate used to run the WHOLE serialized Playwright suite on every FRD"
    default: "Gate scope follows build-engine.md Gates G0..G4 and BUILD-9: G1 synchronous per unit without e2e, G2 per FRD in a pinned full checkout, G3 full combined landing verification through merge-queue, G4 version hardening. Missing required browser harness remains red. No old focused-gate or whole-suite invocation shortcut overrides these layers."
    requiere_humano: false
    nota: "Day 1 retires the old per-FRD shell gate executor. Verification: test-build-v2-jobs.mjs, test-build-v2-next.mjs and test-build-v2-land.mjs."

  - id: DR-107
    patron: "what happens when the DR-073 in-place patch cannot green in one shot — the old contract ('change NOTHING') discarded the whole work order for any residual red, and every reopen deferred to the NEXT pass (re-paying baseline + full re-plan + sync + safe-points)"
    default: "SUPERSEDED recovery mechanism: DR-150/DR-073 and BUILD-15 own fresh patches, preserved red evidence, the per-WO build/patch budget and independent fallback. Re-review the latest patch diff and never discard healthy WOs or tests to obtain green. No separate reopen_count, patch-attempt or automatic next-pass convergence loop."
    requiere_humano: false
    nota: "The prior patch self-repair/model-budget ladder is historical; see dated decision logs."

  - id: DR-108
    patron: "what context a build subagent receives and what each spawn costs — builders got a one-line summary and re-read the same docs N times; a second same-model selftest agent ran per WO; mechanical steps (commit/stamp/sync/archive/notify) paid the worker model"
    default: "Workers receive bounded file-backed context from CLI units/brief.mjs: scope, owned artifacts, FRD/WO contract, dependency Status Notes, design references and preserved gate-failure evidence. Mechanical state/commit operations are deterministic CLI functions, not model spawns. BUILD-10/DR-152 owns routing and effort, BUILD-9 admission."
    requiere_humano: false
    nota: "The old planner context-pack and mechanical-agent accounting vehicle is retired; current contract: plugin/docs/build-engine-cli.md and test-build-v2-report.mjs."

  - id: DR-109
    patron: "how the Claude Design canvas loop is DRIVEN — who carries the messages (the owner was the bus in both directions), where completeness state lives (model attention vs disk), whether canvas rounds are journaled, and which generation engine a design phase picks (Claude Design vs hand-HTML vs in-repo)"
    default: "AUTOMATE THE MESSAGES, NEVER THE DECISIONS + EXTERNALIZED TRACKER + CANVAS JOURNAL + ENGINE ROUTING TABLE. The EXPLORE+Claude-Design path is driven by ONE numbered stateful algorithm (plugin/skills/design/references/canvas-procedure.md), model-agnostic by design (Sonnet-safe: every checkpoint is a FILE, not attention). (1) RELAY: outbound prompts go by the best transport — the owner's logged-in browser via claude-in-chrome (agent pastes + submits) when connected and allowed, else clipboard pbcopy (the owner's whole job per round = one Cmd+V), else manual — and EVERY prompt is also written to docs/design/canvas/prompts/NNN-<slug>.md (provenance); inbound is POLLED (DesignSync list_files until the file set stabilizes → auto pull-and-review) — the agent NEVER asks the owner '¿ya generó?'; the owner only receives decisions (approve/correct/defer), never courier work. (2) TRACKER: docs/design/canvas/tracker.md — row 0 the design system, one row per ui:true FRD screen enumerated UP FRONT from the FRDs, last row the closing sweep; statuses pending→generated→reviewed→corrected→owner-approved / deferred(owner); the design advance gate (SKILL.md Step 9) REFUSES to advance while any row is neither owner-approved nor deferred — a skipped screen is structurally impossible on any model (same mechanism class as work-order frontmatter). (3) JOURNAL: every canvas round appends to docs/design/canvas/log.md + the essence to .pandacorp/comms/iteration.md — DR-032 applies to EXTERNAL-tool rounds too (personal-page-v2's journal read '1 clean round' over a many-round canvas reality = a false history). (4) CLOSING SWEEP: after the last screen, a bidirectional component reconciliation (union of components used across ALL screens vs the Stage-1 gallery + _ds_manifest.json; back-port orphans or record exceptions; confirm/prune unused) BEFORE the manifest bridges to components.md — closes 'components appeared in screens but never in the system'. (5) ENGINE ROUTING (codifies the owner's criteria): greenfield EXPLORE + canvas auth → Claude Design (default, DR-058; rationale: HIGH implementation fidelity from token-clean output, vs hand-HTML that historically diverged); no canvas access / headless → hand-authored HTML directions; ADOPT-VISUAL → neither generates, extract; brownfield with substantial built UI → iterate in-repo, canvas only for genuinely NEW surfaces; post-freeze per-FRD tweak → in-repo on frozen tokens (+ the DR-081 re-sync mirror offer on CD provenance, never auto-push). Content rules unchanged (DR-058 §1c checklist, DR-101 cadence/hierarchy/real-content/rubric). Canonical: plugin/skills/design/references/canvas-procedure.md, plugin/skills/design/SKILL.md (Step 0 routing + Step 9 gate), factory/standards/design.md §1c/§11/§12."
    requiere_humano: false
    nota: "owner-approved design-skill audit (2026-07-01, docs/proposals/22-design-skill-audit-2026-07-01.md, phases A+B+D). Evidence from personal-page-v2: the owner manually relayed every prompt owner↔canvas ('mucho back and forth... copiando el prompt, pasándolo'); screens were skipped until the owner asked page-by-page; components used by pages never entered the system gallery; iteration.md recorded 1 clean round over a many-round reality; the procedure lived in ONE ~700-word paragraph (Opus-shaped — Sonnet would drop items). Note: most of the CONTENT pain was already codified same-day as DR-058-corrected + DR-101 (v9.24→v9.27) but never battle-tested; DR-109 adds the MECHANICS (relay, tracker, journal, sweep, routing). Phase C spike VERIFIED (2026-07-01, same session): via claude-in-chrome the agent opened claude.ai/design in the owner's logged-in browser, opened the PersonalPage v2 design-system project, typed a test prompt into the canvas chat, submitted it and read the canvas reply ('OK, conexión verificada') — the browser transport (relay rung 1) WORKS end-to-end; remaining hardening for real use: canvas UI selectors may drift (re-screenshot before typing), long generations still use the DesignSync poll loop for inbound, and the transport requires an interactive session with the Chrome extension connected + the owner's standing permission. Validation (phase E): next UI project runs once on Opus + once on Sonnet; fixed = a Sonnet run completes the tracker with zero owner where-is-my-page interventions. Factory-internal design-phase guidance — no rule-library/OVERLAY change. Plugin v9.42.0→v9.43.0 (MINOR). See factory/decision-log.md + plugin/docs/decision-log.md (2026-07-01). SUPERSEDED-PENDING 2026-10-11 (BL-0229, docs/proposals/42-absorb-claude-design-to-artifacts.md): standalone claude.ai/design closes 2026-12-14 and designs are now Artifacts; the DesignSync tool now forbids generating with it. EXPLORE routes to hand-authored HTML until the Artifact review loop (BL-0117 spike) is validated on a real project; a replacing DR is written only then. The canvas mechanics are legacy (finish in-flight canvases before the sunset); the content rules still bind."

  - id: DR-110
    patron: "how the LEAD agent talks to the owner in conversation — no propagated rule existed beyond language (DR-009); the owner couldn't tell progress narration from the real answer, replies ran too verbose/technical by default, and proposals got rubber-stamped instead of red-teamed"
    default: "OWNER-FACING INTERACTION STYLE IS A PROPAGATED STANDARD, SCOPED TO THE OWNER↔LEAD-AGENT CHANNEL ONLY. Codified as CONV-11 in factory/standards/conventions.md (SHOULD, enforcement: manual — agent self-check each turn + owner spot-check, consistent with the catalog's zero-aspirational-MUST bar). Explicit scope carve-outs stated in the rule itself: it does NOT touch product/UI copy (stays with the `copywriter` agent + the i18n rule) and does NOT touch orchestrator↔subagent communication (Task/Agent prompts and results stay whatever shape serves the agents involved — the rule propagates outward to the owner, never inward). The rule: (1) mark where the real answer begins after progress narration (a `---` + short bold label); (2) concise/scannable by default, lead with the conclusion; (3) clean skimmable formatting — headers, bold, bullets; (4) high-level by default, technical only on request or when the topic demands precision (security, money, data loss, irreversible actions); (5) storytelling/analogies over jargon; (6) visualize complex flows/algorithms with a diagram or widget instead of prose; (7) red-team proposals that require judgment before agreeing — never rubber-stamp, skip for simple statements/questions/greetings; (8) human, empathetic tone, but disagreement stays substantive. Propagated via the existing DR-051 channel (the same one that ships CONV-1/language): factory/standards/conventions.md → plugin/templates/rules/code-conventions.md (operative copy shipped by /pandacorp:scaffold and /pandacorp:upgrade to every project's docs/rules/) → concise pointers duplicated in plugin/templates/shared/AGENTS.md.tpl and .pandacorp/guide.md.tpl (rule 10) → panda-corp's own root CLAUDE.md (rule 10, applies immediately to factory sessions without waiting for upgrade)."
    requiere_humano: false
    nota: "owner request (2026-07-02, this conversation): the owner was disengaging from conversations because progress narration and the substantive answer blended together, replies were too verbose/technical/agreeable by default. Scope was narrowed twice at the owner's explicit correction during the planning turn: first to exclude product/UI copy (not a copywriter/voice change), then to exclude orchestrator↔subagent communication (internal Task/Agent coordination is unaffected). Plugin MINOR bump + OVERLAY_VERSION bump land in the same change. See factory/decision-log.md + plugin/docs/decision-log.md (2026-07-02)."

  - id: DR-111
    patron: "an ad-hoc subagent delegation (the `Agent` tool without a `subagent_type` that already pins its own model, or a `Workflow` script's `agent()`/`pipeline()`/`parallel()` calls outside the build engine) left without an explicit model silently INHERITS the parent conversation's model tier (Sonnet/Opus/Fable) instead of sizing to the subtask — a session running on Opus or Fable fans out many subagents (e.g. each leg of a deep-research) at that same expensive tier and burns the token budget on work that didn't need it"
    default: "CALCULATE THE SUBAGENT'S MODEL TIER BY SUBTASK COMPLEXITY, NEVER BY THE PARENT'S TIER. Codified as CONV-12 in factory/standards/conventions.md (SHOULD, enforcement: manual — agent self-check before each ad-hoc delegation + owner spot-check, consistent with the catalog's zero-aspirational-MUST bar). Scoped to delegation where the model ISN'T already pinned — explicitly does NOT reopen: (a) Pandacorp's own named agents (`plugin/agents/*.md`), which already declare a static `model:` in frontmatter (architect/designer/reviewer/product-manager/copywriter → opus; implementer/backend-dev/frontend-dev/test-writer/researcher/security-auditor/librarian/analytics/devops → sonnet); (b) the build engine's own adaptive escalation inside `/pandacorp:implement` (`pickWorkerModel`, DR-073 — sonnet floor + opus escalation on `difficulty: high`/`reopen_count >= 1`; mechanical steps on the cheap tier, DR-108) — already the correct, calibrated instance of this same principle for work-order execution. The rule, for everything else (generic Agent-tool types — `general-purpose`/`Explore`/`Plan`/`claude` — and any Workflow authored outside the build engine, e.g. a deep-research-style fan-out): (1) haiku — zero-judgment, mechanical, short output (a commit, a rename, a one-line text/copy tweak, a lookup/grep-and-report, formatting); (2) sonnet — the default floor for real work (implementation, research/summarization fan-out, most subagent execution, medium analysis); (3) opus — genuine judgment/high complexity (architecture/blueprint decisions, adversarial review, open-ended synthesis, red-teaming a proposal, anything expensive to unwind if wrong); (4) fable — NEVER chosen automatically; only used when the owner explicitly asks for it, or the agent sees a genuine benefit and asks the owner for confirmation BEFORE launching it. Escalate upward, never downward, if a lower tier proves inadequate (same empirical spirit as DR-073's `reopen_count`, generalized outside the build engine). Propagated via the existing DR-051 channel (the same one that ships CONV-1/language and CONV-11/interaction-style): factory/standards/conventions.md → concise pointers duplicated in plugin/templates/shared/AGENTS.md.tpl and .pandacorp/guide.md.tpl (rule 11) → panda-corp's own root CLAUDE.md (rule 11, applies immediately to factory sessions without waiting for upgrade)."
    requiere_humano: false
    nota: "owner request (2026-07-02): the owner reported that deep-research-style fan-outs (and other ad-hoc delegations) run their subagents at whatever model the parent session happens to be on — including Opus/Fable — exhausting the token budget on legs that only needed Sonnet. During planning the owner explicitly excluded Fable from the automatic calculation: Fable must never be auto-selected, only used on the owner's explicit request or after asking for confirmation first. REAFFIRMED 2026-09-02 (proposal 33 §12.2, option i+ii): the opt-in-only policy is UNCHANGED — Fable is still never auto-selected. The owner additionally PRE-AUTHORIZED exactly ONE Fable sprint, for BL-0111's R-02 prompt-surface recalibration against the Claude 5 generation, under two conditions that both bind before any spend: (a) a docs/proposals/ note recording scope, expected cost (+$13.20 in call-units over the same sprint on Opus 5) and success criteria must exist first, exactly as proposal 26/DR-114 did; and (b) the owner gives an explicit go AT LAUNCH TIME. This pre-authorization is single-use, scoped to BL-0111, and does not generalize to any other work. Plugin MINOR bump + OVERLAY_VERSION bump land in the same change. See factory/decision-log.md + plugin/docs/decision-log.md (2026-07-02)."

  - id: DR-112
    patron: "a project generated by Pandacorp had NO template producing a populated root README.md — the repo's actual GitHub front door — so a project could reach `phase: release` (the pre-release checklist already asked for one, DR-085/`release` SKILL.md step 3) with no producer ever having written it; a human or a brownfield-adopting agent opening the repo had to reverse-engineer 'what is this / how do I run it' from code"
    default: "ROOT README IS A PROPAGATED, PROGRESSIVELY-POPULATED ARTIFACT — SHOULD (Product/Docs, DOC-3 in rule-registry.md). Codified in factory/standards/documentation.md (new canonical-doc row: 'External-facing overview' → root README.md) + its operative form `rules/documentation-and-decisions.md`. Content stays THIN and never duplicates the PRD/blueprint (points to `docs/` instead): one-liner, what it does, tech stack, getting started (install/env vars via `.env.example`/dev command/tests), a pointer to `docs/` for depth. Populated PROGRESSIVELY by whichever skill first knows each part — never all at once, never invented: (1) `scaffold`/`spec` step 0 seeds a placeholder (`README.md.tpl`, project name only, carrying a `PANDACORP-README-PLACEHOLDER` marker comment) since the product doesn't exist yet; (2) `spec`, once the PRD/FRDs exist, fills 'what it does' + doc links from `readme-template.md` and removes the placeholder marker; (3) `architecture`, once the stack is installed and `.env.example`/`.claude/launch.json` are materialized, fills 'Getting started' with the REAL install/dev/test commands (read from what was just installed, never guessed); (4) `implement`'s hardening close-out re-checks (advisory) that the Getting Started commands still match `package.json` scripts / `.env.example` — work orders can add env vars mid-build, so this catches drift before it reaches the owner; (5) `release`'s pre-release checklist (already existed, now has an actual producer) is the final human-facing gate. Verifier: `.pandacorp/doc-lint.sh` — root README.md must exist, and (HARD-ELIGIBLE, greenfield only, BL-0009 pattern) once `docs/product/prd.md` exists the placeholder marker must be gone. Started `SHOULD`, not `MUST` (learn's own rule: a new MUST that could break in-flight projects starts as SHOULD/warning) since existing projects predate this and shouldn't retroactively fail a gate."
    requiere_humano: false
    nota: "owner request (2026-07-03): the owner wants every Pandacorp-generated project to reach GitHub with a populated README (what it does + how to run it) — asked to research what else belongs in a good README and when it should be (re)populated during the pipeline. Multi-touchpoint by design (scaffold placeholder → spec content → architecture run-instructions → implement drift-check → release's pre-existing checklist), rather than a single skill owning it end to end. Plugin MINOR bump + OVERLAY_VERSION bump land in the same change. See plugin/docs/decision-log.md (2026-07-03)."

  - id: DR-113
    patron: "the factory (and its product projects) could only be operated from Claude Code — the owner wants dual-channel operation, talking to the factory from Claude Code AND OpenAI Codex (app + CLI first, Cursor and OpenCode next) to cross-check each other's work, and the ecosystem has converged on open, tool-agnostic standards (AGENTS.md donated to the Agentic AI Foundation, Agent Skills open standard) that make this newly feasible without forking the know-how"
    default: "MULTI-RUNTIME PORTABILITY: AGENTS.md is the instruction source and CLAUDE.md its one-line shim (DR-155). Skills are shared files; agents, manifests and enforcement registrations are generated from their canonical sources. Codex and Claude Code have equal native read/write authority under DR-133, coordinate the same CLI and use runtime-local workers. Missing tools require honest attended execution, never weaker gates or invented background continuity. Canonical: agent-portability.md PORT-1..PORT-6."
    requiere_humano: false
    nota: "Day 1 replaces retired product executors and their qualification procedures. Runtime hook installation/trust is separate from source compatibility; check-derived-drift.sh and check-skill-capabilities.mjs check projections."

  - id: DR-114
    patron: "the factory's prompt surface (plugin/agents/*.md, plugin/skills/*/SKILL.md) was written incrementally across model generations — emphasis inflation and thousand-word rule+rationale+war-story paragraphs that once helped weaker models now REDUCE quality on the Opus 4.8/Sonnet models consuming them daily (load-bearing rules buried, over-triggered imperatives); but every clause traces to a DR or a paid-for incident, so a naive cleanup silently drops rules that exist because something broke (the ACE context-collapse trap)"
    default: "PROMPTING CONVENTIONS ARE A FACTORY STANDARD (PROMPT-1..8 in factory/standards/prompting-conventions.md; rows in rule-registry.md): recalibrate the FORM for the models in use, verify the CONTENT survives, freeze the governance. (1) Goals/constraints over step enumeration — steps enumerated only where order is normative (gates, state writes). (2) Emphasis is scarce: CAPS/NEVER/bold reserved for load-bearing tokens; never repeat an instruction in multiple phrasings. (3) One rule one home; incident origin as a terse (DR-NNN/BL-NNNN) pointer, never an inline war-story. (4) MUST: the never-degrade list (human gates, DR-009 language rules, two-layer doc discipline, fail-closed gate semantics, state-machine contracts) is verbatim-stable in any prompt edit — touching one is a governance change routed through /pandacorp:learn + the owner, not a recalibration. (5) MUST: frontmatter (name/description/tools/model/effort) is policy, never changed silently (DR-111 pins; the Codex TOMLs regenerate from it — the derived-drift gate catches violations). (6) MUST: every prompt edit gets an INDEPENDENT fresh-context normative-survival verification (constitution rule 4 applied to prompt surgery: extract every normative element from OLD, assert each survives in NEW or is an explicit recorded removal). (7) Skimmable shape (~≤120-line agents; shared boilerplate byte-identical across files so sweeps stay mechanical). (8) Runtime-synthesized dispatch prompts (engine/skill-composed subagent briefs) are self-contained on-camera briefs — role+boundary, owned files, embedded commands, output contract, verbatim context pack — never pointer specs."
    requiere_humano: false
    nota: "Fable hardening sprint WS3 (2026-07-04, proposal 26 — the owner's explicit one-shot Fable opt-in). The audit found the prompts were NOT the naive prescriptive style the sprint brief assumed — they are dense, evidence-anchored rule sets whose real defect is FORM (mega-paragraphs mixing rule+rationale+exception+anecdote; the reviewer's visual-lens step was a single ~1,000-word paragraph). First application: 4 densest agents (reviewer/designer/architect/product-manager) + 15 skills (7 restructured: architecture/implement/design/adopt/spec/sync/upgrade; 8 light: change/decide/discover/learn/new-idea/onboarding/release/work-orders) — each independently PROMPT-6-verified. 10 of 14 agents and 10 of 25 skills already conformed and were deliberately NOT churned. Preflight-block drift filed as BL-0042. Plugin v9.67.0 (MINOR). See plugin/docs/decision-log.md + factory/decision-log.md (2026-07-04)."

  - id: DR-115
    patron: "the same FACT (a count, a status, a level, a rollup) stored or derived in MORE THAN ONE place — a stale cached copy read by display surfaces while a live source exists, a counter maintained by scattered increments, a dead field mapped by readers, docs claiming a different source than the code uses — so different views of the system show different values for the same thing"
    default: "SINGLE SOURCE OF TRUTH IS A FACTORY-WIDE DATA-ARCHITECTURE LAW — one writer per fact; readers DERIVE, never duplicate. Applies to code, DB schemas, JSON/YAML artifacts, markdown documents and UI alike. Every fact consumed by more than one surface takes exactly one of two shapes: (1) DERIVE-ON-READ (default) — readers compute from the atomic source through ONE shared resolver (request-scoped `React.cache()` / one query module / one script), never a private re-implementation per call site; (2) HONEST CACHE (performance-justified exception) — a stored derived value is legitimate ONLY with a single named writer, re-derivation from the atomic source at defined safe points (never scattered increments/decrements), the storage documented as a replica at the field itself, and NO display surface reading it while a live resolver exists. FORBIDDEN: a second independent derivation of a value an existing resolver provides; increment-maintained counters; reader mappings of writerless dead fields; docs that lie about the source; silent fallback from live source to stale copy. Strongest enforcement is BY CONSTRUCTION: when retiring a stale copy, remove the field from the reader's types/mappings so the compiler forbids regression — there is no reliable generic linter for 'a second semantic derivation', so the layers are the reviewer FRD gate (rejects any new count/aggregate that doesn't call the existing resolver, and any stored derived value without a named writer + re-derivation point), the type system, and doc-lint's advisory schema-drift check (status.yaml keys not in the template). Canonical: factory/standards/single-source-of-truth.md (the umbrella) — federates DR-092 (UI resolver instance), DR-050 §1 (WO frontmatter atomic, FRD rollup an honest cache), DR-087 (dependsOn is the DAG source), DR-066 (liveness derived by crossing, never the flag), DR-078 (fail-loud reads). Propagated to products via plugin/templates/rules/clean-code.md."
    requiere_humano: false
    nota: "owner mission (2026-07-05, docs/proposals/29-single-source-of-truth.md): Mission Control showed up to three different work-order counts for the same project (live wo-*.md files vs the status.yaml replica vs the track.jsonl reconstruction), the XP/level fed on the stale yaml cache, and a 'pending bugs' badge read a dead field nothing wrote. DR-092 existed but only covered UI derived values and was not consistently applied or enforced; the owner elevated it to a first-class principle covering all data design, enforced at review + by construction + doc-lint, propagated to every product project. MC fixes landed in the same change (see mission-control/docs/decision-log.md 2026-07-05)."

  - id: DR-116
    patron: "a rule/contract is superseded in ONE document but its old statement is left standing in another that was not updated in step — two authoritative, current, mutually-exclusive claims about the same fact — so autonomous agents reading different docs diverge and the owner loses trust in the rule set (the ~21 accidental contradictions of the 2026-07-05 audit; the trigger: 'targeted build = only that' vs 'at each safe-point drain everything ready')"
    default: "DOCUMENT CONSISTENCY IS A SUPERSESSION-COMPLETENESS GATE, not a blind anti-contradiction blocker: it NEVER blocks a rule change, only an INCOMPLETE PROPAGATION of one. Two cases. (1) ACCIDENTAL contradiction (two docs drifted, nobody intended two truths) → catch it. (2) INTENTIONAL supersession (the author WANTS to change a rule) → never block the change itself; require it to be complete. Enforced at two moments. FRESH-SET BLOCKING VERIFIER: a freshly generated set (spec output = PRD+FRDs; architecture output = blueprint+WOs) has no supersession intent, so a FRESH verifier agent (generator != verifier, constitution rule 4) reads the whole new set and a HARD internal contradiction (two acceptance criteria that cannot both hold, a WO contradicting its FRD) BLOCKS the close of the phase — the docs stay DRAFT until reconciled, analogous to the readiness_gate/grounding_gate at architecture step 9b2. SUPERSESSION-COMPLETENESS CHECK: edits to the EXISTING corpus (change/iterate in a project; learn for a standard/DR/skill/constitution clause in the factory) do NOT block the change — the author DECLARES the superseded claim and the verifier confirms (a) every place stating the OLD claim was updated in the same change (no survivor anywhere in factory/, plugin/, docs/ except append-only dated decision-log history, DR-093) AND (b) the why was recorded (the two-writes discipline: canonical doc + decision log). Detection is bounded, cheap, semantic — never a dumb grep: seed with the author's declared supersession list, derive the owning-doc set via the AGENTS.md canonical-doc table + the standards registry, grep the OLD claim's key terms across factory/plugin/docs to build a CANDIDATE list, then a verifier subagent semantically reads ONLY the candidates to judge true contradiction vs noise (soft-tier/default-unless/tombstoned mentions do not count). PERIODIC ADVISORY SWEEP: a lightweight fan-out re-run of the audit over corpus slices (the pandacorp-consistency-sweep routine, plugin/docs/routines.md; may fold into the memory-review sweep or run as a /loop job) catches drift that slips through — ADVISORY, never blocking; a confirmed contradiction it finds is filed as a BL-* item (DR-103). Canonical: factory/standards/document-consistency.md."
    requiere_humano: false
    nota: "owner mission (2026-07-05, docs/proposals/30-factory-contradiction-sweep.md): the build engine built TWO changes when the owner asked for ONE, because two authoritative rules contradicted each other; a 6-reviewer audit then found ~21 more instances of the same root pattern (a rule superseded in one doc, its old statement surviving elsewhere — e.g. DR-115 deleted pending_changes but left infra.md still claiming the gate writes it). All 21 fixes landed in the same change; this DR codifies the PREVENTIVE mechanism so the class never recurs. Human-gate posture: the advisory sweep has NO gate (it only reports); a fresh-set hard contradiction BLOCKS the phase close (fail-closed, like a surviving [NEEDS CLARIFICATION], DR-100); an incomplete supersession is reported back to the author (held, never vetoed). Wired into spec/architecture (fresh-set verifier) and change/iterate/learn (completeness check). See factory/decision-log.md + plugin/docs/decision-log.md (2026-07-05)."

  - id: DR-117
    patron: "the build's FRD gate rejects a work order and the engine must decide HOW to recover — a bounded point-fix, a rebuild, or stopping for the owner — with no memory of what earlier attempts on the SAME work order already tried, so it grinds the reopen budget on a spec it can never satisfy autonomously, or discards ~correct work to rebuild from scratch"
    default: "Recovery follows BUILD-15 diagnosis, preserved red evidence and DR-073 selective patching. Disputed test-defective failures receive one reviewer reply, spec ambiguity enters BUILD-12 doubts, dependency/human gates hand back, and exhausted budgets block only the affected unit/dependents. Engine faults retry once after rebuild-state then stop safely and file the appropriate backlog/draft under DR-103."
    requiere_humano: false
    nota: "The former automatic revert/rebuild and two-cause fallback ladder is superseded at Day 1; healthy work and tests are preserved."

  - id: DR-118
    patron: "the per-FRD review/test gate runs a whole-project verify.sh that needs a QUIET tree, so historically each gate was a synchronous barrier that stalled the whole pipeline while one feature was reviewed — build and review never overlapped, wasting wall-clock on every FRD"
    default: "G2 runs in a dedicated bootstrapped detached full checkout pinned to integration SHA, under a host H slot; its verdict is stale only when same-FRD integrated work is outside the pin ancestry. Bootstrap exit 75 is env-infra, reserved exit 76 is wait/disk, not a code verdict. Fenced harvest applies evidence and state only after job/epoch validation. G3 runs through merge-queue, never a legacy synchronous-main fallback. Canonical: BUILD-9/13/15."
    requiere_humano: false
    nota: "Day 1 replaces the shared gate-worktree/apply-agent mechanism. Verification: test-build-v2-jobs.mjs, test-build-v2-next.mjs, test-build-v2-disk.mjs."

  - id: DR-119
    patron: "how /pandacorp:adopt fixes the phase of a brownfield project — historically it read the phase straight off code maturity (live deploy → release, code+tests → implementation, boilerplate → architecture) and STAMPED it, trusting whatever as-built docs it reconstructed without an independent quality check, so a project could reach a build phase on contradictory/incomplete reconstructed docs"
    default: "ADOPT DERIVES THE PHASE FROM DOC-QUALITY GATES, NOT FROM CODE MATURITY. Code evidence yields only a CANDIDATE CEILING (upper bound); the actual phase is derived by running the SAME doc-quality batteries the phase skills run, BOTTOM-UP to that ceiling, ONCE per adoption (Step 6b) — the first failing battery caps the phase at that boundary's predecessor. (1) PRODUCT battery: a JUDGE-tier fresh agent (opus, DR-111; not the authoring product-manager, rule 4) runs spec Step 7c's fresh-set contradiction verifier (DR-116) + no surviving [NEEDS CLARIFICATION] (DR-100) + DR-095 agent-critical-fields presence per FRD — reused VERBATIM from the phase skills (independent oracle per constitution §24, referenced not edited). (2) DESIGN battery: FIRST design Step 5's verification (axe-core + Playwright at 375/1280) producing a11y-report.md + prototype/screenshots/, THEN design Step 9's deliverable-presence check (MECH) + design.md §1c anti-omission completeness read (JUDGE-tier fresh agent); a non-UI/no-visual project uses design Step 9's Non-UI minimal set and ROUTES to /design rather than failing. (3) ARCHITECTURE-layer readiness is DEFERRED to /pandacorp:architecture — its gates need work orders + a Build Plan adopt never produces; the gate-derived phase tops out at design, and `architecture` is only a ROUTING ceiling reached by code evidence WITH clean product+design batteries. A not-live project is never stamped implementation (adopt emits no work orders → /implement preflight routes back to /architecture). Pre-existing and reconstructed docs run the identical battery (one oracle regardless of provenance). Fix-vs-route on each gap: a gap the code already embodies (thin FRD, un-extracted real tokens) → adopt reverse-documents harder THIS run (DR-054); a gap needing a forward decision/net-new creation → hand it to the capped phase's skill, never fabricate. Close phase-aware: a derived MANUAL phase (product/design/architecture) → write phase + advance_pending:true and STOP (DR-032); a live app (release) keeps phase:release (a live deploy is observable — never downgrade the board) and each failed-battery gap becomes a /change card (never a phase downgrade), routing to /design + /review-launch. The Spanish report gains ## Estado derivado / ## Huecos por fase / ## Siguiente paso. Non-Claude runtimes run the batteries inline sequentially (tier-judge mapping, DR-113). Canonical: plugin/skills/adopt/SKILL.md Steps 2, 6, 6b, 9."
    requiere_humano: true
    nota: "adopt phase-gate battery (2026-07-10, owner-approved; red-team-approved spec). Incident: the Mission Control adoption stamped a phase over reconstructed docs whose quality was never independently checked (bad reconstructed docs undetected, phase over-stamped) — a downstream build consumed them and ~2 days of build work were lost. Root cause: phase read off CODE MATURITY and stamped, with no independent doc-quality oracle at the adoption boundary. Fix = the Step 6b battery + the code-evidence CEILING recast (Step 2) + fix-vs-route (Step 6) + the phase-aware close (Step 9). requiere_humano: the derived-phase confirmation stays the owner's (advance_pending on manual phases, DR-032). Red-team cuts: the architecture battery was KILLED as mechanically impossible (adopt has no work orders / Build Plan for architecture's gates to run on); a constitution edit was DEFERRED to the owner. Two owner-defaults taken: a not-live project caps at `architecture` as a ROUTING ceiling (not a build-ready claim); the battery runs ONCE per adoption and doc-lint stays advisory-only for adopted projects (created_via: adopt, DR-077). See factory/decision-log.md + plugin/docs/decision-log.md (2026-07-10)."

  - id: DR-120
    patron: "a second coding runtime (OpenAI Codex) holds a narrow, certified permission to write project build state, but the capability has never been exercised on a real build while its permanent dual-runtime change protocol is paid on every factory change — and the remaining certification gates (an installed cross-runtime canary, a several-hours unattended run) each cost real owner-supervised spend"
    default: "SUPERSEDED BY DR-133 (2026-10-20). Codex and Claude Code have full native read/write authority across every Pandacorp skill and application. The former freeze and wake-scheduling reopen prerequisite no longer restrict native attended work; actual automation limits and safety gates remain."
    requiere_humano: true
    nota: "Historical rationale below, superseded for permission by DR-133 on 2026-10-20; the old wake-scheduling prerequisite is withdrawn and does not condition native write authority. owner decision (2026-09-02, docs/proposals/33-model-era-audit.md §12.1 option B). Evidence balance the owner decided on: the only recorded rationale for dual-runtime was ever cross-check (docs/proposals/25:5 — a repo-wide grep for vendor-lock-in / resilience / cost returned zero matches, so those were never argued or sized); the only demonstrated benefit was one self-referential review (LESSON-0067, inside the portability layer Codex was part of); the profile ran ZERO production builds in the 49 days it was available; the only recorded harm came from write access and its root cause is UNKNOWN (BL-0035). Freezing was chosen over dropping (option C) because re-deriving the design later is cheaper than the original sprint but not free, and over continuing (option A) because R11 needs a repeated 3-hour+ owner-supervised real-spend run. This REOPENS proposal 32 §15 decision #4 ('Unattended Codex implement approved as mandatory'), which is explicitly superseded. requiere_humano: true — only the owner may lift the freeze, and only after the trigger is observed. Codex BL triage under the freeze: BL-0030 raised p1->p0 and kept live; BL-0032 kept live as a guardrail; BL-0031's build-profile half and BL-0113's re-map are annotated blocked-by DR-120 (BL-0113 stays open because the agent TOML mirrors are still generated and a retired model id would break a read/review dispatch too). See factory/decision-log.md + plugin/docs/decision-log.md (2026-09-02)."

  - id: DR-121
    patron: "a recurring unattended job (a Desktop scheduled task or a /loop routine such as pandacorp-memory-review or pandacorp-review-launch) hits a tool call that is not on the permission allowlist and SILENTLY STALLS waiting for an approval nobody is there to give — recorded three times (BL-0054, BL-0085, LESSON-0119) with the job appearing to have run and produced nothing"
    default: "ROUTINE PERMISSION POSTURE IS `dontAsk` PLUS A CURRENT ALLOWLIST. Set each recurring Desktop task's per-task permission configuration to **`dontAsk`** (a GA, per-task setting), and keep the project allowlist current with the `fewer-permission-prompts` skill — run it whenever a routine is added or its tool surface changes. `dontAsk` makes the allowlist the ENTIRE permission surface, which converts the failure mode from a silent stall into a LOUD, visible denial the next run can be fixed from. EXPLICITLY NOT `auto`: `auto` is a per-action classifier that WIDENS approval with nobody present, on a machine whose one recorded permanent data loss (BL-0035) still has root cause UNKNOWN — the cost of a wrong widening is unbounded, the cost of a loud denial is one re-run. `--permission-prompts none` is `[UNVERIFIED]` (not on the headless docs page) and must not be used as the mechanism until a primary source confirms it. Order matters: refresh the allowlist FIRST, set `dontAsk` SECOND — the reverse turns every unlisted call into an immediate denial. Implementation and its canary (fire `pandacorp-memory-review` and confirm a genuinely new tool call fails loud) are tracked as BL-0103."
    requiere_humano: false
    nota: "owner decision (2026-09-02, docs/proposals/33-model-era-audit.md §12.6 option ii). Chosen over (i) keep the hand-curated allowlist unchanged (does not fix the stall class), (iii) `auto` (rejected on the safety argument above), and (iv) wait for `--permission-prompts none` (rests on an unverified flag). Cheapest fix to a failure class recorded three times. Not implemented in the decision-recording change: BL-0103 carries it, in its two mandatory ordered steps. See factory/decision-log.md (2026-09-02)."

  - id: DR-122
    patron: "the build's whole-FRD oracle finds a contract contradicted by code this cycle did not write (legacy drift in a shipped FRD being extended), and the verdict for that same class of drift depends on which rung of the gate ladder the FRD happens to land on: blocked on one path, shipped silently on another"
    default: "The old automatic preexisting-drift waiver and whole-FRD drift-finder are retired. Tests-first units cover floor/r1 work and bug cards under BUILD-10; no claim of legacy drift waives a red current gate or downgrades the approved contract. Record out-of-scope issues as draft cards validated by card check; scoped work remains fixed. Drift-proof for bug cards is replaced by tests-first (build-engine.md Deferred F8)."
    requiere_humano: false
    nota: "Historical differential-run and drift-frontmatter mechanism remains recoverable at the retirement tag, not an active path to VERIFIED."

  - id: DR-123
    patron: "a small-scope build (one FRD, a handful of work orders) pays the same foundation-first deferral, the same agent-budget sizing and the same security-fix spawn as a ten-FRD build, and the factory's only measured small-scope run (bench A-1) spent 84 minutes for a result a vanilla agent matched on the oracle in 3-5"
    default: "SUPERSEDED at Day 1 for scheduling, projected budgets and hardening dispatch. BUILD-9 owns dependency/barrier planning and adaptive admission; BUILD-10 and Gates G0..G4 own verification and version audit. No maxAgents:auto, queue-driven cap recomputation or legacy lean-tail spawn sequence is active. Scope and human gates remain fixed."
    requiere_humano: false
    nota: "Earlier foundation-wave optimization and measurement rationale live in the dated decision logs; use the current CLI planner rather than reviving old options."

  - id: DR-124
    patron: "the build's review half (the opus FRD gate plus the close-out, about 36-44 of the ~51-59 measured minutes of a 1-FRD bench run) holds the owner's clock even though the build half had already landed every work order on main at ~13 min, and a subscription usage limit mid-run has no handling at all: the engine treats a 429 or a dead agent as a work-order failure and repairs, blocks or reverts good work"
    default: "SUPERSEDED by DR-150/DR-154. There is one product engine and no fast/classic lane selector, main-tree mechanical writer, USABLE milestone or deferred review-budget path. The CLI owns scoped units, isolated checkouts, independent review and one path through merge-queue to main under BUILD-7..BUILD-15."
    requiere_humano: false
    nota: "Proposal 39 and the original benchmark history remain in docs/proposals/39-fast-lane-implement.md and dated logs; no executable or prompt from that vehicle is shipped."

  - id: DR-125
    patron: "after the fast lane became the default (DR-124) every oracle result was already final at USABLE, yet the opus gate and its tail cost 38-62 % of a build and ~30-40 min after USABLE, and the FRDs still built strictly one at a time on main even when the work-order DAG was wide"
    default: "SUPERSEDED executor and options at Day 1. BUILD-9 owns chains of at most three WOs, barrier planning and adaptive concurrency; BUILD-10 owns reviewer model/effort and tests; BUILD-15 owns patch budgets. No fixed mode cap, USABLE check, legacy lane writer or main-tree schema chain."
    requiere_humano: false
    nota: "Proposal 40 measurement history: docs/proposals/40-implement-speed-v2.md; runtime policy now comes only from build-engine.md and model-tiers.json."

  - id: DR-126
    patron: "the fast-lane builder is limited by what it generates, not by its tools: across 20 builder transcripts 71.5 % of builder time is model time, builders write 4.2-4.8x a vanilla agent's output for the same app (unit tests 8-10x, e2e specs 6x, fix churn), re-run verify.sh to recover an exit code `| tail` hid, orient for 0.5-2.4 min before their first write, and the implementer agent file contradicts the fast prompt (full suite per WO, 3 fidelity cycles, a memory INDEX read)"
    default: "SUPERSEDED executor-specific builder defaults and TDD exception. Current briefs, effort and tests-first selection follow BUILD-8/10 and quality.md. A bounded unit test must prove its contract; lean prompts never weaken independent-oracle tests, frozen visual references or deterministic gates. No legacy builder-effort option or obsolete mechanical brief command."
    requiere_humano: false
    nota: "Proposal 41 history remains in docs/proposals/41-builder-speed.md and the dated decision logs; CLI routing is the current source."


  - id: DR-127
    patron: "create, capture, consolidate or rename an idea card displayed on the board"
    default: "The title MUST be a creative commercial name followed by a spaced em dash and a short concrete description of what the product does: Brand — purpose. Never save a brand alone or a description alone. Describe the general product, not only its first catalog, franchise or medium. Keep the owner-facing description in Spanish (DR-009), preserve an approved brand and stable card slug, and retain the descriptor when renaming. If a brand is not yet selected, propose a clearly provisional commercial name rather than silently treating it as approved. Before saving, check that both segments are nonempty and that the description communicates the purpose without opening the card. Apply to new cards and title edits; do not mass-rename historical cards without a request."
    requiere_humano: false
    nota: "Explicit owner instruction, 2026-10-12: a brand-only title is not recognizable months later. Factory-internal card-authoring rule, enforced by the capture/rename checklist and the shared idea template; no project overlay or build-state change. Canonical template: factory/ideas/_idea-template.md. Manual: GuideCapturar in mission-control/src/app/manual/manualPages.tsx."

  - id: DR-128
    patron: "freezing a product's design for the build (typography, logo, fidelity hand-off)"
    default: "The design phase ends with everything the build needs to reproduce the approved look and measure the difference. (1) TYPOGRAPHY is web fonts chosen by the owner from a side-by-side render (open licence, recorded in design-tokens.json `fonts`, self-hosted by the build); system font stacks are never frozen. (2) BRAND: the logo is designed in the design phase: principles from the PRD's future scope, 4 to 6 concepts generated in parallel with Codex image generation, the owner chooses, the chosen concept is redrawn by hand as SVG with size and tone variants. (3) PROTOTYPE HOME docs/design/prototype/ on every path, EXPLORE included. (4) TOKENS regenerated mechanically from the prototype's final CSS. (5) SHARDS per UI FRD cover every state the acceptance criteria name, with 1280/375 screenshots. (6) FIDELITY REFERENCES: measured computed styles of every frozen component (light/dark × 1280/375), a component catalogue, exact SVG exports of icons and logo, and docs/design/fidelity-checklist.md; build requirements in technical-assumptions.md. (7) The Step-9 gate runs scripts/check-design-gate.mjs and advances only on READY."
    requiere_humano: true
    nota: "Owner request, 2026-10-15, after PandaSaga's 17-round design: the owner has repeatedly seen implementations drift from approved designs and asked that the design skill always leave these documents, including typography and a Codex-generated logo. Human gates: font choice and logo choice. Wired in plugin/skills/design/SKILL.md (Steps 2, 2b, 5, 7, 8, 9), references/{brand-and-logo,iteration-loop,freeze-and-fidelity}.md, scripts/{shard-prototype,measure-components,check-design-gate}.mjs + codex-image.sh (the first two are wrappers over scripts/fidelity/freeze.mjs since DR-129), templates/docs/{fidelity-checklist-template,fdd-template}.md, factory/standards/design.md §5c."

  - id: DR-129
    patron: "how the design freeze is run and how much fidelity is enough (the fidelity target, the prototype contract, the freeze's stop rule and time box)"
    default: "EXTENDS DR-128 (the hand-off artifacts stay as DR-128 defines them; this adds how they are measured and how the freeze is bounded; DR-128 is not superseded). Detail: factory/standards/design.md section 5d to 5f. (1) FIDELITY TARGET, layered and measured, never one headline percentage: L1 computed typography and colours 100% exact; L2 geometry with exact box sizes and +-1 px spacing, radius and floating-panel anchor offsets; L3 pixels per viewport-height slice at most 0.5% above YIQ threshold 0.1 with anti-aliasing ignored, comparator pinned to pixelmatch 7.x semantics (8 changed the metric); L4 100% of the listed states x widths 375 touch / 768 / 1280 x light/dark themes, axe 0 serious/critical. No tolerance is loosened without a measured flake. Owner-facing meaning: a simple vista no se distingue del prototipo, con fuentes y colores exactos. Infrastructure failures of the gate are always RED (fail-closed). GATE MODE: a measured L1-L4 mismatch BLOCKS the FRD by default (Gate mode: blocking, owner decision 2026-10-16); this AMENDS DR-072 for measured fidelity-gate mismatches only (DR-072's advisory class keeps covering judged nits); leftovers below the bar and the freeze's time-boxed backlog live in .pandacorp/comms/visual-punch-list.md for the end-of-build Visual QA; Gate mode: advisory only with the owner's decision recorded in the project's docs/design/design-decisions.md. (2) PROTOTYPE CONTRACT from round 1, checked after every round by preflight-round.mjs (JSON at docs/design/freeze/preflight.json): tokens-only CSS, demo-only marks with ?demo=off, ?host=page when the prototype auto-detects a host, product text at least 12 px, only transforms animate (text never fades), hover only inside @media (hover: hover) with the touch branch as default, web fonts self-hosted where possible, sticky offsets from a product token that excludes the demo chrome. (3) FREEZE STOP RULE: a parallel staged plan tracked in docs/design/freeze/tracker.md; exactly ONE independent audit (a different model from the authors where possible), fix its blockers only, no re-audit unless a blocker fix touched shared CSS or tokens; target 60 to 100 minutes, hard limit 2 hours, on the limit ship with the blockers fixed and the rest as a fidelity backlog in .pandacorp/comms/visual-punch-list.md for the end-of-build Visual QA (DR-072); one Spanish owner status per milestone; check-design-gate.mjs reads the tracker and the preflight."
    requiere_humano: false
    nota: "Owner-approved 2026-10-16 after PandaSaga's 17-round freeze and Funko Tracker's hardened gate (docs/design/fidelity-checklist.md in that project is the concrete instance). Research behind the numbers: Playwright toHaveScreenshot (threshold 0.2, no pixel tolerance by default), Chromatic diffThreshold 0.063, pixelmatch threshold 0.1 with anti-aliasing ignored, BackstopJS misMatchThreshold 0.1 percent; a single 95 percent headline was rejected (5 percent of pixels lets a whole missing card pass; 95 percent of style properties means one value in twenty is wrong). pixelmatch 7.2.0 vs 8.0.0 verified 2026-10-16 by diffing the published packages (YIQ vs OKLab HyAB). requiere_humano is false for RUNNING the freeze; the owner keeps the final advance gate and the font and logo choices (DR-128, DR-032). Gate mode: the owner decided on 2026-10-16 that the build's fidelity gate blocks by default on measured mismatches (a deterministic comparator is not the noisy judge DR-072 protects against); DR-072's note points here. Wired: factory/standards/design.md section 5d to 5f and section 13, plugin/templates/docs/{fidelity-checklist-template,fdd-template,design-freeze-tracker-template}.md, plugin/skills/design/scripts/fidelity/ (freeze.mjs: split + token extraction, measure, shard, screens, catalog, identity; diff.mjs; one config docs/design/freeze/fidelity.config.json validated by config.schema.json, also read by the preflight and the gate), plugin/skills/design/scripts/{preflight-round.mjs,check-design-gate.mjs}, plugin/skills/design/{SKILL.md,references/freeze-and-fidelity.md,references/iteration-loop.md}, plugin/agents/{designer,reviewer}.md, factory/standards/build-orchestration.md section 9. Tests: plugin/scripts/test-design-fidelity.mjs, plugin/scripts/test-design-gate.mjs. Plugin v9.127.0, overlay 8.100.0. Factory-internal process: no rule-library change and no OVERLAY_VERSION bump from the standard and templates (design.md is not injected; the per-project checklist is written at freeze, not synced by upgrade)."

  - id: DR-130
    patron: "what an FDD may specify relative to the frozen prototype (FDD <-> prototype <-> blueprint synchronization)"
    default: "An FDD specifies only UI the fidelity oracle captures. (1) Every table row under the FDD's ## Screens and ## States cites, in backticks, the id of a captured state of its FRD (a mock-screen section of the shard, and its oracle-states.json entry when that table exists). (2) Every control, region and string the FDD names is drawn in that FRD's captured states; a string drawn only in another FRD's states is named with that FRD on the same line. (3) No pictureless GAP: DR-064 Group B (an FRD wants it, the prototype lacks it) is drawn into the prototype as a configured, captured state with its own oracle entry, or the owner takes it out of the FRD; 'flag it as an explicit gap' is withdrawn. (4) The prototype wins for visuals: an FDD that contradicts it (calls it a demonstration, enabled vs disabled, error at rest vs after a press, column order) is amended, or the prototype changed and re-captured, before freeze. (5) Enforcement, fail-closed: plugin/skills/design/scripts/check-fdd-coverage.mjs runs inside check-design-gate.mjs (READY requires it) and with --plan in the architecture readiness gate (step 9: blueprints and work orders name only drawn UI; a red goes back to design). It reads the copywriter's keyed docs/design/microcopy.<locale>.json. Behaviour agreement beyond its mechanical checks is a BLOCKER of the one S3 freeze audit."
    requiere_humano: false
    nota: "Owner instruction, 2026-10-17, after funko-tracker reached architecture with a design gate READY while the FRD-06/07 FDDs specified an operator console (Nueva carga, the Ver ejecucion select, a per-source progress table, Configurar, Ver mas candidatos, Volver a la cola) whose strings existed only in the copy file, with one operator capture for both FRDs; under DR-129's blocking fidelity gate those FRDs could never pass. Owner: FDD, prototype and blueprint must be 100% synchronized and this must never happen again. A read-only run of the new check over funko-tracker found the same class (pictureless GAP rows, named-but-undrawn strings) in all 8 UI FRDs; that project resolves its own case with the owner. The owner keeps the scope decision (draw it or take it out) at the freeze's M1. Wired: plugin/skills/design/{SKILL.md (Steps 7, 8, 8b, 9),references/freeze-and-fidelity.md,scripts/check-fdd-coverage.mjs,scripts/check-design-gate.mjs}, plugin/agents/{designer,copywriter}.md, plugin/templates/docs/fdd-template.md, plugin/skills/architecture/SKILL.md step 9, factory/standards/design.md section 8, rule registry DES-8. Tests: plugin/scripts/test-fdd-coverage.mjs (fixtures/fdd-coverage: funko-like RED, synced GREEN), plugin/scripts/test-design-gate.mjs. Backlog BL-0239. Plugin v9.128.0. No OVERLAY_VERSION bump: the scripts run from the plugin root and the FDD template is used at freeze time, not synced by upgrade."

  - id: DR-131
    patron: "which technical choices the architecture phase asks the owner about, when, and how the rest of the phase is paced (decision round, planning pipeline, one fix pass)"
    default: "EXTENDS DR-002 (the light stack gate becomes a structured round; DR-002 is not superseded). (0) Input readiness first: architecture runs check-design-gate.mjs and check-fdd-coverage.mjs (DR-130) before any work; not clean -> STOP, tell the owner the counts and a time estimate, route to a design mini-round. (1) DECISION ROUND before any document under docs/: the architect drafts a Spanish brief (.pandacorp/comms/arquitectura-decisiones.md) with every owner-visible decision: context citing the FRD/AC, 2-3 alternatives with cost/month, risk incl. legal, effort and the owner's ops workflow, the recommendation and why, facts verified live and dated (never from memory), prior art from sibling factory projects, the cost of changing it later. Mandatory triggers whenever the product has one: stack and golden-path deviation; hosting and monthly cost (DR-005); media and third-party content (store vs hotlink vs same-origin proxy, rights stance); data ingestion/curation (in-app pipeline vs owner-run skills over a CLI vs manual) and whether an admin web UI is needed; external data access and legal; background compute and AI cost; auth and deletion promises; email; analytics consent/PII; backups/retention; prior art. Asked in ONE round (AskUserQuestion, at most 4 per call, recommended option first; chat elsewhere); each answer locked as an ADR + decision-log entry; unanswered = the recommendation recorded as default EXCEPT the five explicit scope choices: always ask separately about PostHog, Sentry, internationalization, SEO and mailing-list need (Kit off by default), even for internal projects or when absent from the PRD; explicit now/deferred/excluded answers (i18n distinguishes one launch locale from multiple active locales), or explicit acceptance of recommendations, are required before planning. Silence is pending, never consent. Reuse already locked project answers on reruns. Deferred/excluded capabilities get no SDKs, stubs, credentials, required env validation, provider gates or work orders; preserve centralized launch-locale copy, basic page identity (app-name browser title only, not SEO descriptions/OG), and security. Lock scope in ADRs and propagate to architecture, FRDs, plans, installer, env and owner digest. Choices with no owner-visible trade-off follow the standards silently. (2) PLANNING PIPELINE: platform from the locked decisions -> ONE cross-FRD work-order map -> parallel blueprint authors with one brief -> one cross-issues ledger -> one reconciler -> the three gates in parallel (DR-100/102/116) -> ONE fix pass -> deterministic re-verification by the lead (waves.mjs, ac-matrix.mjs, plan-consistency.mjs, check-fdd-coverage --plan) + a resolution addendum -> flip-active.mjs stamps and flips. A second full gate run only when a fix changes scope; later changes get a delta review over git diff. (3) PACING: plan + rough duration up front, milestone messages only (decision round, plan ready, gates passed, merged), an estimate and the cheaper alternative before any unannounced step over 30 minutes, no audits beyond the three gates, owner visual reviews never block. (4) EXECUTION (v3, 2026-10-17): every dispatch is a portable TIER·effort (PORT-2 MECH/STANDARD/JUDGE, effort from effort_rank) resolved at dispatch time from plugin/runtime/model-tiers.json (Claude: the tier alias as the Agent model + the effort parameter, overriding a named agent's pinned default; Codex: the tier worker, STANDARD·high on tier-judge, and only inside the factory, a project falls back to inline sequential; Codex and Claude Code have full write authority for all phase artifacts and state under DR-133; missing tools degrade to native attended sequential work; elsewhere: inline, sequential); the skill and its briefs never name a model, so a new model ships by editing the JSON alone; the most expensive tier is never auto-selected. One dispatch table (references/dispatch.md) gives each stage its parallel group (G1 platform architect + installer + analytics + devops; G2 map after the context packs; G3 every blueprint author at once, STANDARD·high for an FRD with <= ~10 ACs and no novel integration, JUDGE·high otherwise; G4 one STANDARD·high reconciler; G5 the gates at once: readiness = the lead's scripts + one STANDARD·medium check, grounding and consistency JUDGE·medium, plus the digest), its inputs, owned outputs, budget and lead-run steps. Context packs (build-packs.mjs, deterministic, read-only on docs/; ACCEPTED ADRs listed as binding, PROPOSED apart, SUPERSEDED omitted) replace re-reading the doc set, but whoever plans, writes or judges an FRD still reads its frd.md in full (the map planner and the consistency gate read every frd.md, the latter also prd.md; the readiness gate gets data-model.json for the DATA-7 comparison); the lead pre-assigns ADR numbers, writes decision-log lines by script and reconciles .env.example after G1; each author writes its own ledger file; the lead reads reports and script outputs, not the docs. Budget about <= 5 h wall clock and <= 6 M subagent tokens for 6-8 FRDs averaging ~12 ACs, stated at the start; the lead checks the dispatch log on every completion notice and the total after each group, and a stage past 2x its budget stops with the cheaper option. A late change is a scoped delta with delta gates, never a regeneration; a cut agent is resumed by SendMessage from the dispatch log."
    requiere_humano: true
    nota: "Owner request, 2026-10-17, after funko-tracker's architecture phase (~90 commits over two days): two owner-driven reversals after the docs were written (ingestion as owner-run skills instead of a web operator console, ADR-0012, 10 WOs regenerated; official images hotlinked instead of stored in R2, ADR-0013, ~20 WOs touched plus delta gates), both choices the architect had made silently inside a one-shot stack approval; a design gap found mid-phase by DR-130 (257 findings, 69 pictureless states, a ~11 h mini-round); seams discovered late by per-FRD authors and handled by an improvised ledger; owner frustration at extra audits and unannounced duration. requiere_humano: true because the round IS the owner gate. Wired: plugin/skills/architecture/{SKILL.md (steps 0b, 1, 9, 9b2, 10),references/{decision-round,planning-pipeline,wo-map-template,blueprint-author-brief,gates,stack-install}.md,scripts/{lib-plan,waves,ac-matrix,plan-consistency,flip-active,resolve-versions}.mjs}, plugin/templates/docs/architecture-template.md (Owner decisions, Pinned versions, Media & third-party content, Operations & admin tooling), plugin/templates/shared/.gitignore (.claude/worktrees/), plugin/skills/upgrade/SKILL.md (additive .gitignore). Tests: plugin/scripts/test-architecture-plan.mjs (+ fixtures/architecture-plan). Closes BL-0244, BL-0245; files BL-0247..BL-0250. Plugin v9.130.0, OVERLAY_VERSION 8.101.0. Proposal: docs/proposals/architecture-skill-v2.md. v3 (2026-10-17, owner request: speed, parallel subagents with the tier and effort each task deserves, no hardcoded model names, works on Claude and Codex): funko-tracker's run cost ~45 subagent runs, ~12 M subagent tokens and ~1 day (each judge-tier author re-read the whole doc set, ~450-520 k tokens; late scope changes regenerated ~2.5 M). Wired: plugin/skills/architecture/{SKILL.md,references/{dispatch (new),planning-pipeline,gates,stack-install,blueprint-author-brief}.md,scripts/build-packs.mjs (new)}; tests plugin/scripts/test-architecture-packs.mjs (+ fixtures/architecture-packs); Manual PipelineDetail.tsx + skill-flows.ts. Plugin v9.131.0 (with one audit fix pass: FRDs read in full where planned or judged, the DATA-7 inputs of the readiness gate, honest budgets, Codex worker mapping and DR-120 scope, G1 shared-file rules, ADR status in the packs)."

  - id: DR-132
    patron: "how the fast lane schedules work around a floor FRD when the FRD graph is cyclic over an acyclic work-order DAG, what a deferral that can never resolve does, and which baseline a relaunch over a clean half-built tree gets"
    default: "SUPERSEDED fast-lane scheduler at Day 1. The CLI planner consumes the WO dependsOn DAG and declared artifacts, adds barrier constraints and refuses invalid plans; next owns ready-unit selection and blocked-dependent propagation. No USABLE/floor-taint waiver or legacy carry-over baseline command is active. Resume and preflight follow BUILD-7/9/14 without widening scope."
    requiere_humano: false
    nota: "Cycle/floor-wait and greenfield baseline history: dated decision logs. Verify current planner/next/cli suites, not the retired scheduler."

  - id: DR-133
    patron: "runtime permission for any Pandacorp skill or application, including canonical documentation, work orders and build state"
    default: "Codex and Claude Code have full native read/write authority across skills and applications, superseding DR-120 and former runtime-only permission restrictions. Use the shared CLI, runtime-local available tools and attended execution when scheduling/delegation is absent. Preserve human gates, deterministic verification, independent review, atomic ownership and one writer per checkout. A cold foreign handoff requires the prior executor to stop at a durable safe point; the preauthorized same-run drive/start --resume epoch transfer is the explicit BUILD-14 exception. Permission does not certify unattended survival or bypass the active sandbox."
    requiere_humano: false
    nota: "Day 1 aligns PORT-5 with DR-150/153. Missing capabilities require honest execution limits, not invented permission differences or a takeover of a live foreign run."

  - id: DR-134
    patron: "cross-project service reuse, account directory, provider recipes and environment preparation"
    default: "Apply factory/standards/external-services.md and factory/services/catalog.yaml. Public recipes contain no personal identities or secrets; private vault account metadata and per-project associations are the source of account/resource facts. Read them at architecture preflight without speculative creation; after decisions/consumer contract are final, materialize obtainable approved provider values and local app secrets under external-services.md, not just a map. Preserve existing values and independent dev/prod secrets, with explicit Google OAuth exception; private delivery/status never certifies production readiness. Record exact resource_slug, default pandatrack.app subdomain, selected services, dated quotas, independent evidence levels and variable origins/destinations/status. Optional Kit is off until explicitly chosen; PostHog/Sentry/i18n/SEO retain explicit now/deferred/excluded decisions. API/CLI preferred only with verified operation-specific access; stored IDs and reconciliation before retries. No cloud creation, cards, spending or migration implied by this standard. GitHub remains shared standard infrastructure outside the service choices."
    requiere_humano: false
    nota: "Owner approval 2026-10-20 of consolidated services HTML proposal, with later Modal decision superseding Railway/Cloud Run for Funko exports. Replaces old universal pandacorp-slug naming, one R2 bucket/app, Resend domain/app, mandatory Kit/Sentry and the former PostHog org/app policy (the PostHog restriction is superseded by DR-160). Provider-specific defaults and verification live in external-services.md/catalog, not duplicated here."

  - id: DR-135
    patron: "cleaning up a repository's git worktrees and un-merged branches (factory or product project)"
    default: "Run /pandacorp:worktrees; its engine plugin/scripts/worktree-sweep.mjs decides, never the agent's eye. AUTOMATIC removal only for what is provably safe: commits already ancestors of the default branch (origin/HEAD, else main), zero uncommitted/untracked files, no gitignored owner state (.pandacorp/ outside run/, factory/{ideas,memory,profile.md,portfolio.md}), no nested worktree, no running process with its cwd inside, idle >= PANDACORP_STALE_HOURS (default 3) — via git worktree remove (no --force), git branch -d (no -D), git worktree prune. NEVER touched: locked or local-deployments/ worktrees, the session's own checkout, a worktree in use, and the build-engine worktrees (.pandacorp/run/**) and lane/* branches of a project whose build is live or resumable (check-build-liveness.sh != NOT_RUNNING, or any atomic lease, stale included). Everything else is explained to the owner per item (content, origin, age, commits ahead, uncommitted files) with a recommendation (integrate via .pandacorp/merge-queue.sh in projects / direct merge in the factory, discard, or keep) and acted on only after the owner confirms THAT item; a confirmed discard first archives the tip plus a snapshot of uncommitted and owner-state files under refs/pandacorp-archive/<date>/ so it can be restored."
    requiere_humano: true
    nota: "Owner request relayed 2026-10-20 while redesigning Mission Control's Inicio: raw worktree lists are unusable after months away (factory: 17 extra worktrees, 1 locked, 9 detached; Funko Tracker 8 worktrees, 3 un-merged branches; PersonalPage v2 2 worktrees, 1 branch idle 41 days); the dashboard only shows a per-project table pointing at where to run the skill. Agreed boundary: auto-remove only merged + clean; everything else needs the owner. requiere_humano: true for the non-safe items only. Semantics shared with mission-control/src/lib/pendingMerge/pendingMerge.ts. Wired: plugin/skills/worktrees/SKILL.md (+ evals/), plugin/scripts/worktree-sweep.mjs, test plugin/scripts/test-worktree-sweep.mjs; Manual skill-flows.ts. Plugin v9.139.0."

  - id: DR-136
    patron: "describing environment variables in a project's .env.example"
    default: "Every variable in .env.example (including commented-out optional `# NAME=value` ones) carries its OWN one-line `#` description of what it is for (and how to obtain it, where that applies) on the line directly above it. A comment shared by a block of variables, a section header (`# --- Group ---`, `# ====`) or a commented-out assignment is not a description. Purposes come from the project's docs and code; when one cannot be established the agent asks the owner instead of inventing it. Enforced by `.pandacorp/doc-lint.sh` (run by verify.sh), fail-loud on every project regardless of created_via, canaried by canary.sh step 9 and plugin/scripts/test-doc-lint-env-example.sh. Rule CONV-16 in factory/standards/conventions.md; operative form rules/code-conventions.md."
    requiere_humano: false
    nota: "Owner request 2026-10-20 from the Órbita redesign of Mission Control: the Arquitectura tab lists each variable with its purpose and showed 'Sin descripción' for 28 of 55 Funko Tracker variables. Mission Control's reader (src/lib/architecture/env.ts) attaches only the immediately preceding comment block to the next variable, so the fix belongs in the source files and the gate, not in the UI. Existing projects are backfilled through their own change discipline."

  - id: DR-137
    patron: "creating or renaming a skill owned by a Pandacorp product project"
    default: "Expose every project-owned skill as <project-slug>:<skill-slug>, both in English kebab-case; use ingest-delta for incremental ingestion. Resolve the project slug from status.yaml. Follow CONV-17 in conventions.md and rules/code-conventions.md for standalone versus plugin/runtime packaging; never duplicate a plugin-supplied namespace. Update live contracts/examples/routines on rename and preserve historical evidence and persisted extractor compatibility."
    requiere_humano: false
    nota: "Owner decision 2026-10-20 in funko-tracker: funko-tracker:ingest-catalog and funko-tracker:ingest-delta; applies to every new project skill. Standalone Claude naming is checked by check-project-skills.mjs through doc-lint.sh; runtime namespace resolution stays an authoring-review check. Overlay 8.110.0 propagates the convention and verifier on normal upgrade, never mid-build. Compatible upgrade warns on older/unknown created_with without renaming product skills; new-project gates and scoped strict checks at new/renamed-skill authoring enforce the rule."

  - id: DR-138
    patron: "production branch, when hosting is created, how a deploy is triggered, and who may update main after launch"
    default: "(1) main is the ONLY production branch in every project, always: never create a production/prod/release/live branch or point a host's production at another branch. (2) Everything is local until /pandacorp:release: no Vercel (or other host) project, no preview/staging deployment and no host-side configuration before it; architecture designs the deploy and never executes it. (3) Deploys come only from GitHub: at release, after the DR-004 approval, devops creates the Vercel project, connects it to the GitHub repo through the Git integration with Production Branch = main, loads the production env vars, and GitHub produces the deployment; push to main = production, any other branch = preview. Never a CLI upload (vercel, vercel deploy, vercel redeploy, --prod, --prebuilt) or a dashboard redeploy as the path; instant rollback to an earlier Git-built deployment only as the incident runbook's emergency first move, the fix then lands on main. (4) After launch (phase: release with deploy_target not internal; missing counts as external) nothing reaches GitHub main without the owner's explicit order in chat: work lives on a branch (push it for a preview), and on the order the agent runs PANDACORP_OWNER_RELEASE_OK=1 bash .pandacorp/merge-queue.sh (ff-merge + push). The token is set only after that explicit order and never reused for another change."
    requiere_humano: true
    nota: "Owner decision 2026-10-23 after funko-tracker's ADR-0011 created a fast-forward production branch to keep the DR-004 gate (the project itself is not modified; existing projects keep their setup until their own change). Enforced: block-dangerous.sh blocks every manual Vercel deploy and, in a launched project, any push that would update main without the token (canary test-block-dangerous.sh); merge-queue.sh hands back with exit 21 in a launched project and pushes main with the token (canary test-merge-queue-release-gate.sh); Codex execpolicy forbids vercel deploy/redeploy. Rules: INFRA-7/INFRA-8 in factory/standards/infra.md, constitution §11, rules/external-services.md. A post-launch /pandacorp:implement run still builds on the local main checkout (engine single-writer contract), so its unpushed delta is one release candidate pushed only on the owner's order. Amends DR-003 (no pre-launch staging) and states DR-004's mechanism."

  - id: DR-139
    patron: "naming a URL: route segments, App Router folders, API paths, query keys, slugs, in any project language"
    default: "Every URL is English, 100% of the time, whatever the app's language (Spanish, Japanese, French...): route segments and App Router folders, dynamic-segment names, ROUTES constants, API paths, query-string keys and fixed values, and data slugs (built from a stable ID or an English/canonical slug; proper names in ASCII kebab-case, common words never translated). In a multilingual app the locale prefix (/es/...) is the only localized part; never a per-locale pathnames map or localized rewrites. FRDs, FDDs, prototypes, blueprints and work orders name routes the same way. Existing projects keep their URLs until a change of their own migrates them with redirects; upgrade never renames routes."
    requiere_humano: false
    nota: "Owner decision 2026-10-23 after funko-tracker shipped Spanish URLs (the project itself is not modified here). Rule CONV-18 in factory/standards/conventions.md (plus seo-i18n.md), operative form in rules/code-conventions.md and rules/i18n-next-intl.md. Verified manually: architecture readiness gate (route map), reviewer quality lens, release checklist; a deterministic route-name check is not wired (natural-language detection would false-positive on proper names)."

  - id: DR-140
    patron: "where automated tests that need a database run, and what they leave behind"
    default: "(1) Every DB-backed automated test (unit/integration, verify.sh, e2e) runs ONLY against a native local PostgreSQL: Homebrew postgresql@NN, data dir under the user's home, 127.0.0.1 on the project's ledger port base+2 (review base+3), never the default 5432. Never Docker Desktop, never a cloud DB (Neon dev/prod); app development itself may use the Neon dev branch. A non-loopback test URL fails loud. (2) Zero residue, always: per-run/per-worker DBs dropped at teardown, per-test transactions rolled back, stale <slug>_test_* swept at setup; between runs only the empty template remains; a post-run db:test:check-clean in verify.sh fails the gate on leftover test DBs or non-empty template tables. (3) Architecture documents the test DB (port, DB names, pnpm db:test:up / db:test:check-clean) in architecture.md's test-environment section and generates TEST_DATABASE_URL with its real loopback value in .env.local and .env.example (loopback credentials are not secrets), one comment per variable (CONV-16). Docker is not required for any project database."
    requiere_humano: false
    nota: "Owner decision 2026-10-24 (owner-stated): the owner runs two macOS users in parallel and the work user must run Docker Desktop, which cannot run for both at once, so the personal user must not depend on Docker; cloud DBs are wrong for tests (per-worker create/drop, quota, pollution). Rules INFRA-9/INFRA-10 in factory/standards/infra.md (INFRA-1 rewritten), operative form rules/quality-and-testing.md + data-modeling.md + external-services.md; architecture skill stack-install.md (d) and environment-delivery.md. Supersedes LESSON-0429/0441/0446 (one Docker container per project). Existing projects migrate through their own change (funko-tracker in its own session); upgrade never rewrites their test setup."


  - id: DR-141
    patron: "several finished, independently verified work branches are waiting to land"
    default: "BATCH INTEGRATION. Combine all selected finished branches into one integration branch from current main, resolve conflicts, then run the full gate ONCE on the combined result through merge-queue.sh (DR-146: or once as the full verify.sh that certified that exact combined tree, after which the queue logs [certified-tree] instead of re-running it). Never run the queue/full gate sequentially for every waiting branch. On red, attribute the failure to the owning change, fix only that defect and re-run once on the combined result, within existing repair limits. A single finished change lands alone as today. Procedure, evidence checklist and source-branch retention: factory/standards/build-orchestration.md, Parallel manual sessions §5 (BUILD-4)."
    requiere_humano: false
    nota: "Explicit owner order 2026-10-27: repeated full gates for accumulated completed work take too long. Amends DR-096 landing granularity; DR-099 attribution/hand-back and DR-138 production authorization remain unchanged. A production batch still requires the owner's explicit order covering its selected changes and PANDACORP_OWNER_RELEASE_OK=1 for that landing. Does not waive branch verification, per-FRD gates or lightweight catalog validation in the factory backlog engine. Manual procedure uses the existing single-branch queue; no new runtime CLI. Operative forms: always-injected rules/quality-and-testing.md and guide.md.tpl; compatible overlay upgrade."

  - id: DR-143
    patron: "making full Playwright passes faster with more than one worker"
    default: "SERIAL BY DEFAULT, PARALLEL BY EVIDENCE. A full verify.sh run splits into two tiers only when the project ships e2e/parallel-safe.json (project-owned seed, never overwritten): listed specs on PANDACORP_E2E_WORKERS (default 3), then all others on one worker. A spec is listed only with per-test write evidence and repeated green runs at normal machine load. visual.spec.ts is never listed (DR-056). The --since gate and manual runs stay on one worker. Viewport-agnostic gates (shell, headers, hydration) run on desktop only. A project seed e2e/prod-server.mjs makes the full run use one production build for both tiers, plus a page-error sweep of every surface; manual runs, --since and projects without the seed stay on next dev."
    requiere_humano: false
    nota: "Owner request 2026-10-31. Measured on funko-tracker: 459-475 s serial, 417 s tiered at comparable load, 422 unique tests in both. Under heavy machine load a tiered run was slower (539 s), and one next dev server limits scaling. Production server measured the same day: about 470 s warm dev, 275-305 s prod including the build, 9 of 9 green, 4 workers gain under 10 s. The serial tier is now about 75% of the pass."

  - id: DR-142
    patron: "running /pandacorp:implement from Claude Code with the delegated workers on the owner's Codex subscription"
    default: "SUPERSEDED by DR-150/DR-152/DR-153 from plugin 10.0.0. Both runtimes coordinate the same CLI with runtime-local workers and the documented cross-company worker vehicle. A Codex coordinator/drive never launches Claude. Review availability, quota fallback and the epoch-fenced relay follow BUILD-10/11/14, never a silent rerun on another engine."
    requiere_humano: false
    nota: "The former worker-tag relay and its runtime-specific orchestrator are retired; source vehicle is plugin/scripts/codex-worker.mjs and PORT-5."

  - id: DR-144
    patron: "Tests or production invariants depend on live/curated data volume or incidental rendering"
    default: "Assert behavior on test-owned fixtures or structural contracts; never pin curated counts/contents, hard-code production data volumes, or write markup/style/copy change-detector tests. Real-file reader checks prove structure, not volume."
    requiere_humano: false
    nota: "Owner-stated 2026-11-03. funko-tracker Bleach merge broke 12 tests and 3 guards (1335 franchises / 2399 series / Bleach=2), blocking production merge >1h; removing 14 change-detector tests saved only 0-5 s. Signal, not speed. Canonical: factory/standards/quality.md, Behavior on owned fixtures (DR-144); reviewer rejects, live-data-asserts warns."


  - id: DR-145
    patron: "finishing an implementation, direct change or backlog fix leaves worktrees and temporary artifacts on disk"
    default: "Automatically reclaim only eligible session-owned resources under BUILD-5/DR-157/CONV-21. Ordinary session worktrees require merged ancestry, ownership receipts and clean state; disposable engine checkouts use the shared run/branch/exact-path and terminal-run predicates, retaining every branch and evidence file. Keep dirty/hidden changes without identity-bound bootstrap provenance, protected owner state, locked/deployed/in-use checkouts and unproven running workers. No parent .pandacorp directory or shared cache deletion. Stop writers and move cwd first; use Git without force, report unsafe survivors, prune only missing-target bootstrap manifests."
    requiere_humano: false
    nota: "Day 1 adds the narrow engine-root carve-out. gc/archive reserve withUnleasedProject throughout reclamation/metadata moves; terminal cleanup reserves through post-release writes and revalidates run/epoch. Tests: test-session-cleanup.mjs, test-session-cleanup-adversarial.mjs, test-worktree-sweep.mjs, test-build-v2-disk.mjs."

  - id: DR-146
    patron: "the Stop hook runs the full verify.sh at every session stop, and merge-queue re-runs the full gate after a rebase that changed nothing, so gates queue on each other, saturate the CPU and time out the expensive tests (the 'flaky tests' the owner sees)"
    default: "LIGHT AT THE TURN, FULL AT THE DOOR, NEVER TWICE ON THE SAME TREE. (1) The Stop hook runs `verify.sh --light` (every cheap static sub-gate, whole project) plus `--tests=` exactly the test files belonging to this session's own edits (edited tests; `_tests/<name>.test.*` siblings of edited sources; cap 50) — never Playwright, never the whole vitest suite, scope partial (certifies nothing). DR-099 attribution and the DR-063 build stand-aside are unchanged; `PANDACORP_STOP_GATE=full` forces the full gate; an overlay whose verify.sh lacks `--light` keeps the full gate. (2) A FULL verify.sh (no --since/--only/--files/--light/--tests) that exits 0 on a tree clean at its start and end records that tree in gitignored `.pandacorp/run/green-stamp` via `.pandacorp/green-stamp.sh` (single writer/reader); every red exit drops it. (3) merge-queue.sh skips its post-rebase integration gate, and the Stop hook skips entirely, ONLY when `green-stamp.sh check` proves: same HEAD^{tree}, clean incl. untracked, no skip-worktree/assume-unchanged entries, same sha256 of verify.sh, stamp at most 12 h old. Any doubt runs the full gate. The queue logs `[certified-tree]` or `[full-gate]` and hands the stamp to the main checkout after landing. The DR-138 owner order is checked after and never bypassed. (4) Vitest always runs shuffled with an explicit seed, printed and recorded as `vitest_seed`; `PANDACORP_VITEST_SEED` replays it. No retries anywhere. (5) The light gate is never presented as the full gate: on the default branch, with this session's own edits and an uncertified tree, the hook prints (stderr + Claude systemMessage) that the FULL gate has not run and that direct work on main must be certified with a full `bash .pandacorp/verify.sh` (or landed via merge-queue) before push. (6) Candidate tests = the session edit record UNION dirty/untracked paths; Codex apply_patch Update/Add File headers are recorded; DR-099 attribution still reads the edit record only."
    requiere_humano: false
    nota: "Owner-authorized orchestrated fix, 2026-11-10, from funko-tracker evidence: 1206 StopGate runs, 8 green, 15.6 h machine time (max logged 299 s: longer runs were killed by the hook's 300 s timeout and never logged); last-green.json frozen at 2026-10-18 because its only writer was the hook's own full green, which a ~15 min suite cannot reach inside 300 s and which foreign WIP/stale caches kept red; the anchor was HEAD-keyed so every commit (incl. merge-queue landings) invalidated it. merge-queue re-ran ~15 min on identical trees. Retires last-green.json and the rigor/--since Stop scoping (memo 37 F2/D2). Amends DR-063 (at-rest gate), DR-141 (exit-21/unchanged-tree recheck satisfied by the certified-tree stamp), BL-0044 fast path. A worktree whose bootstrap overrides tracked files with skip-worktree cannot pre-certify the queue; the queue's own green then certifies its retries. Known limits (accepted, review 2026-11-10): the stamp does not bind ignored files (.env*, node_modules, caches), bounded only by its 12 h age; an owner-ordered retry after exit 21 lands on a stamp up to 12 h old without a fresh gate; worktrees whose bootstrap sets skip-worktree overrides (BL-0288 ports) can never pre-certify, by design, so there the skip only serves queue retries; the hook never runs the full gate itself (its 300 s timeout cannot hold a real suite). Addendum 8.119.1 (BL-0306): a gate verdict must not depend on output size; under pipefail no gate script pipes a byte-unbounded producer into an early-exiting reader (`| grep -q`, `| head`): use a here-string or capture first (canary spec discovery misreported a found spec when `playwright --list` exceeded the 64 KB pipe buffer)."
  - id: DR-147
    patron: "a change-queue card stays `ready` after its work shipped or was superseded, because only the build engine's own drain ever closed a card and nothing links work landed through another door (direct chat, a launch plan's WOs, an owner decision) back to the card"
    default: "THE QUEUE EQUALS REALITY, WHATEVER THE DOOR; CLOSE ONLY ON A LINK, FLAG ON A DOUBT. (1) LINKS, written by whoever lands the work: a commit implementing a card ends with the trailer `Change: <slug>`; a commit recording an owner decision that makes a card moot ends with `Supersedes-Change: <slug>`; a work order created because of a card lists it in `source_change: [<slug>]` (work-orders/iterate stamp it; spec, new-version and launch plans that answer a card too). (2) RECONCILER: `.pandacorp/change-reconcile.mjs` (overlay, deterministic, no deps) reads the default branch's history and the WOs. STRONG evidence is applied: a `Change:` trailer → card stamped done (`shipped_sha`, `closed_by`, `closed_evidence`) and MOVED to done/; `Supersedes-Change:` → `status: discarded` in place; every `source_change` WO VERIFIED → done. WEAK evidence only flags (`stale_suspect`, never a status change): the slug named in a commit message or docs/decision-log.md, or every WO of the card's FRDs VERIFIED with at least one planned on/after the card's date. A HINT (`stale_hint`, card stays visible) marks a card whose FRD contract changed after it was filed. Only ready/draft cards; building/closing stay engine/sync-owned. Owner resolution: `--confirm-done <slug> --evidence`, `--supersede <slug> --reason`, `--dismiss <slug>` (fingerprinted: re-flags only on new evidence). Never deletes; refuses to write during a live build unless the engine itself calls it (`--in-build`). (3) WIRING: merge-queue.sh runs it on the main checkout after every landing; the CLI fixes run scope from an explicit target and never drains the queue; a stale_suspect card requires resolution before becoming that target; sync close-out commits carry the trailer and warm/cold sync reconciles the queue; the CLI landing metadata commit carries the trailer when it completes the targeted card; decide supersedes the cards its answer makes moot; upgrade installs it and shows a report before the first --apply. (4) MISSION CONTROL shows `stale_suspect` cards in their own '¿Ya hecho? Revisar' group, never under 'Listos para construir' nor in any pending count, and marks hinted cards."
    requiere_humano: false
    nota: "Owner request 2026-11-10 (from funko-tracker: 9 cards shown 'Listos para construir', 8 stale — 2 built directly in chat, 4 built as launch-plan FRDs/WOs, 2 superseded by owner decisions). Owner rule: however the work is done, the change list must show only what is really pending. Replay on a clone of funko-tracker's pre-audit queue: the 3 launch cards with VERIFIED FRDs flag as suspect; the direct-chat, superseded and FRD-12 (WO still IN_REVIEW) cards get a hint only, because no durable link existed then; the contract-moved rule alone would also have hidden 3 genuinely pending cards, so it is a hint, never a flag. Extends DR-069 §7 (completion = verify-then-archive) to every landing door; complements DR-097 (WO state honesty). BL-0307."

  - id: DR-148
    patron: "a skill or agent puts a decision to the owner (a choice between alternatives, or one with a cost, risk or irreversibility the owner has not been shown)"
    default: "DECISION CARD, IN THE CHAT, ALWAYS (standard CONV-20, factory/standards/conventions.md; not restated here). The decision is presented as chat text, never only in an artifact, document, widget, file or AskUserQuestion picker (those may duplicate it). Three parts in Spanish: Contexto as ONE punctual paragraph written for a reader who knows nothing (what the piece is, how it works today, why now, what happens if undecided, terms explained, figures labelled measured or projected), Opciones lettered A, B, C, D (what is done, gain, risk or cost; an option may carry its own context) and Recomendada: <letter> (exactly one) with why and what would change it, well formatted (bold title, one bullet per option; canonical example in CONV-20). Several decisions: a one-line summary list first, then one self-contained card per decision ordered by urgency; never a bundled approval. Persisted copies (decisions inbox, decision brief, ADR) carry the same three parts. Not covered: a bare go-ahead for one action already requested, browsing a list the owner asked to see (discover teasers), product copy, subagent traffic."
    requiere_humano: false
    nota: "Owner order 2026-11-10: whenever the factory has to make decisions it must be in this format. Severity MUST from the start (owner said 'siempre'); safe to introduce as MUST because it is agent conversation behaviour and no gate, build or in-flight project can fail on it. Review-only enforcement: a property of a conversation cannot be machine-checked, so the rule registry marks it manual with a named step (agent self-check, owner spot-check, reviewer check of skill question templates). Supersedes: the 'chat message is the summary table plus the link, never the whole brief' line of architecture decision-round.md section 4 and its AskUserQuestion-first asking; decide's AskUserQuestion carrying the full prose in its description (BL-0114 trial). Operative form: AGENTS.md.tpl Language & interaction (overlay 8.121.0), decide, architecture decision round, worktrees, adopt, design visual gate, release production gate, learn and memory one-liners. Extends CONV-11 (concise by default now has this exception); DR-131 (decision round) keeps its triggers and ADR locking. Addendum 2026-11-12 (owner-stated, same DR amended, not a new one): context is ONE punctual paragraph for a novice (was an unbounded block), the alternatives become lettered options A, B, C, D each allowed its own context, and the recommendation names its letter (Recomendada: <letter>) so the owner can answer with one letter; a canonical example card now lives in CONV-20. Completeness requirements are unchanged. Overlay 8.123.0, plugin 9.156.0."

  - id: DR-149
    patron: "a script or agent calls `neonctl` (branch create/delete, backups, ingest) on an account that belongs to more than one Neon organization, and neonctl opens its interactive organization picker, hanging the run or breaking its JSON parsing"
    default: "EVERY NEON PROJECT DECLARES NEON_PROJECT_ID (standard EXT-8, factory/standards/external-services.md; not restated here). Empty placeholder with its own comment in the local-only block of tracked .env.example, real value in .env.local, never in .env.production or any runtime. Every scripted/agent neonctl call passes --project-id \"$NEON_PROJECT_ID\" and fails loud when it is empty. The versioned record of the ID stays services.yaml services.neon.shared.project_id (single writer); the dotenv value is its runtime binding. Propagating it to an existing project = adding the two dotenv lines, no other change."
    requiere_humano: false
    nota: "Owner request 2026-11-11 from funko-tracker (LESSON-0668): ingest and backup scripts blocked on neonctl's organization picker; fixed by NEON_PROJECT_ID (spring-sea-58916745). Red-team of where the ID lives: the ID is not secret, but .env.example stays placeholder-only (EXT-7) and services.yaml already owns the versioned ID, so adding the real value to .env.example or a new services.yaml field would create a second tracked copy (DR-115). neonctl 8.x does not read NEON_PROJECT_ID by itself, hence the explicit --project-id. Enforcement: doc-lint.sh advisory finding (never red: introduced on in-flight projects), canary plugin/scripts/test-doc-lint-neon-project-id.sh; architecture environment-delivery.md checklist. Overlay 8.122.0, plugin 9.154.0."

  - id: DR-150
    patron: "how a build is entered and executed: which command builds a change, what the change queue is, and which engine runs the build"
    default: "ONE BUILD ENTRY, ONE RUNTIME-NEUTRAL CLI from plugin 10.0.0. implement builds only the conversed/cited-card or pending-plan scope under BUILD-7..BUILD-15; detection is seven rows, first match wins. The card queue is a durable format with readers, never an automatic drain; capture-only creates a draft validated by card check. Sizes touch/feature/giant use two-FRD tranches. Epoch-fenced lease, frontmatter truth and honest state cache own execution. Every tracked write is a CLI commit on lane/<run_id>/integration; merge-queue with G3 is the sole path to main. Adaptive admission follows DR-156, failure/patch policy DR-073, teardown DR-157. DR-154 owns retirement and recovery."
    requiere_humano: false
    nota: "Owner decision 10 makes Day 1 effective before the first real run; it supersedes the earlier opt-in rollout and archive-folder/BREAKPOINTS design, plus DR-013/069/142 and obsolete executor-specific defaults amended here. F3 calibration and F11 Mission Control changes are shipped; remaining deferred items are listed only in build-engine.md Deferred. Real unattended continuity remains unverified until observed. Decision 6 is documentation-only: never mix plugin versions on a project; update then restart/close all sessions before continuation. No new mixed-version guard is claimed. N17/DEC-14: tracked decisions.md writes stay on integration, with untracked decisions.pending.md mirroring questions and answers for main-checkout readers (test-build-v2-nested.mjs, test-build-v2-answer.mjs)."

  - id: DR-151
    patron: "what a build does when it needs the owner while the owner is away (questions, doubts during the build, risk-zone confirmation)"
    default: "From plugin 10.0.0, all product runs use the shared CLI (DR-150): FRONT-LOADED QUESTIONS, CONSULTED DOUBTS, PARK INSTEAD OF STOP (standard BUILD-12, factory/standards/build-engine.md; not restated here). Every owner question is asked once in the first-minute message, each with the default applied if unanswered; then 'Puedes irte'. No risk-zone or giant 'sí' is awaited, and no unit waits for an owner answer outside the first minute except parked units and human gates (a launched project's landing on main stays a waiting_gate, BUILD-13, and never stops independent work). A mid-build doubt goes sources -> one consult with the other company -> a tie-break consult (caps 3 calls per doubt, 8 doubts per build; the sources step is skipped under drive and in the Codex app); it is decided only within Dentro, reversibly, never widening, reducing or reinterpreting scope, never product scope, money, gates, DRs that require the owner or anything the CLI marks irreversible (the r1 zone, S5 or S8). Otherwise the unit and its dependents park and the rest continues, the question going to the decisions inbox as a CONV-20 card (DR-148); a root block over 50 % with a reversible preferred option is built on an unlanded branch, and the owner's answer decides whether it joins the normal landing. Every autonomous decision is logged 'Decidido sin el owner' with how to revert."
    requiere_humano: false
    nota: "Owner decision N5 (2026-11-11): the owner says 'impleméntalo' and leaves for 2-3 hours, with at most one minute of attention, what the build needs comes first and later doubts are consulted with a model of the other company, asking only when nobody is sure; accepted consequence: a scope misunderstanding can reach main of an unlaunched project (revertable), and a launched main is not touched without the owner's order (DR-138). Design decisions, not owner-decided: the caps 3 and 8, the sources step, the root-block rule, the irreversibility veto computed by the CLI. BL-0312 (2026-11-13, owner option B): an env-infra hand-back judges the environment, not the work, so the coordinator lifts it without the owner after fixing the environment (`unblock`, or `start --resume --unblock` for an ended run): same attempt, no budget, preserved worktree; every other hand-back cause stays the owner's (BUILD-15)."

  - id: DR-152
    patron: "who reviews a build's work and how provider quota changes routing"
    default: "Independent review is mandatory by CONTEXT, not by company or model. Exactly one reviewer receives a fresh bounded context and adversarial evidence, even when it uses the author's model. Routing and capacity follow DR-162 and BUILD-10/11; author model and attempt never escalate ordinary work to Astra. Astra high is reserved for r1 security, money, sensitive data and fail-closed risk. Fable remains disabled. Historical cross-company matrix, N7 exceptions, quota degradation and mandatory deferred re-review are superseded."
    requiere_humano: false
    nota: "Owner decisions N2 (one reviewer, also in the risk zone), N6 (a model of the other company one layer above the author, Astra or Fable only in very particular cases, Fable never automatic) and N7 (when Codex has no quota Opus reviews at the next effort); N3 was left to the designer's judgment. The Astra scope, equal to the owner's N2 list (login, payments, personal data, secrets, deletions), is the designer's reading of N2 and N6 under red-team AA2: the broader zone was 58 % of MC and 75 % of funko classifier hits (an upper bound) and an astra review costs about 9x a sol review (projected). Builder quota switch = other company's column of the same row; a repeated execution raises effort only and never switches company. Terra stays disabled until calibrated. Day 1 NOTA-1: risk-paths.example and upgrade ask the owner to confirm project-specific globs; these may add floor signals and never lower r1. R4-R10 stay retired; the known backtest gaps are not silently expanded into new risk rules (test-build-v2-risk.mjs, test-build-v2-risk-backtest.mjs)."

  - id: DR-153
    patron: "how a build continues when Claude's quota runs out while the owner is away, and how a full-access worker is kept from pushing to production"
    default: "From plugin 10.0.0, all product runs use the shared CLI (DR-150): THE `drive` RELAY AND A GIT PRE-PUSH GUARD (standard BUILD-13 and BUILD-14, factory/standards/build-engine.md; not restated here). `pandacorp-build drive` is armed in standby by `start --run` and `start --resume` whenever `codex login status` is OK and, in a launched project, the pre-push hook is verified; Codex quota is not checked at arming. On a trigger (a session handoff, offered only while the standby is alive, because Claude is at 95 % or hit a usage_limit with a Claude coordinator; a limit envelope in a worker or report output; or a lease not renewed for 30 min with pending work and Claude at 85 % or unknown) it re-reads Codex quota: at 90 % or more it stops at paused-quota, otherwise it takes over the same run by a preauthorized epoch transfer (same run id, no owner confirmation, no quiesce) and continues with Codex only; it never calls Claude. The owner's `start --resume` transfers the run back at once. The engine never lands on its own outside the one path: a v2 run never writes a tracked file in the main checkout, merge-queue (G3) is the only path to main, and in a launched project its exit 21 becomes waiting_gate; the CLI never sets PANDACORP_OWNER_RELEASE_OK. The pre-push hook is an untracked git hook written by `install-pre-push.mjs` (it chains any existing hook and is refused when core.hooksPath is a tracked directory): in a launched project it rejects a push or delete of the default branch without PANDACORP_OWNER_RELEASE_OK=1, for any runtime. It is installed by `start --run` in a launched project before its first v2 run, and by /pandacorp:upgrade in every project from 10.0.0. The variable is a flag, not a secret: it stops an unprompted push, not a deliberate bypass; briefs forbid setting it and only the owner's chat order sets it. `drive` is never armed in a launched project without a verified hook."
    requiere_humano: false
    nota: "Owner decision N4 (2026-11-11): the automatic relay to Codex is built before day 1. The pre-push guard is part of the approved design Z and answers red-team AA1 (a Codex worker with danger-full-access could push to main of a launched project; Codex hooks are certified for 0.144.1 and not verified on codex exec 0.163). Not verified until the first real use: the long-running relay, detached-process survival, sleep and notifications. Known limit: if Codex runs out during a relay the build waits for the owner even if Claude has renewed (automatic return deferred to phase D). Decision 6: do not mix plugin versions. Lock reclaim judges PID plus process start time; live holders are never stolen. Owner-record hash tombs serialize reclaimers; only legacy ownerless locks use age/inode fallback. FIX-MUTEX3 supersedes inode-only tomb descriptions (test-build-v2-lock-stress.mjs)."

  - id: DR-154
    patron: "Day 1 retirement and recovery of the previous product build engine"
    default: "From plugin 10.0.0 only the shared CLI ships. The old product engine and its public change entry, launchers, agents and suites are deleted; upgrade removes the exact two retired overlay engine paths. Recovery is the local git tag archive/engine-dynamic-workflows-v9.157.0 at 1477e9a5 and the explicit path restoration procedure in plugin/docs/engine-v1-reactivation.md, only on the owner order. No archive directory, reactivation script or BREAKPOINTS file is shipped. The factory backlog workflow remains separate."
    requiere_humano: false
    nota: "Owner decision 10 explicitly authorizes tag-and-delete before the first real implement. check-engine-retirement.mjs replaces PLAN-E2 basename greps: keep raw evidence, validate the exact retirement manifest, resolve imports by full path and check live references; narrow historical/negative-test exceptions are tested by test-check-engine-retirement.mjs."

  - id: DR-155
    patron: "One canonical instruction source for every runtime"
    default: "AGENTS.md contains every instruction, including the Claude Code section; CLAUDE.md is exactly @AGENTS.md plus a newline, never a symlink or second manual. Explicit read lists accompany imports for runtimes that do not expand them. upgrade uses migrate-instructions.mjs to preserve project content and refuses CLAUDE.local.md until reconciled. Safety-gate scope recognizes the shim and canonical instructions."
    requiere_humano: false
    nota: "Owner decision 9 delegates DEC-13. Migration preserves Markdown and literal content, fails closed on errors and does not silently drop project prose. Verification: test-migrate-instructions.mjs, test-block-dangerous.sh and test-codex-enforcement.mjs; agent-portability.md Maintenance is canonical."

  - id: DR-156
    patron: "Adaptive concurrency and learning from each implementation run"
    default: "BUILD-9 is the single source for adaptive admission: steps [1,2,3,5,8], start 5 absent history, critical memory pressure or malformed signals use step 1, never zero solely due to memory. Sustained swapout growth or 512 MB swap growth lowers a step; calm readings and 120 s cooldown allow recovery. Step 8 requires sustained journal evidence. RAM reservations constrain heavy jobs, not an extra builder veto; quotas, disk, dependencies and human gates remain binding. Each run records bounded performance samples and one host-local perf/journal.jsonl record outside repositories, used for the next start recommendation. Machine facts belong in the personal profile, never committed policy."
    requiere_humano: false
    nota: "Owner decisions 3/11 and DEC-15/18 supersede DEC-1 pause/veto and fixed 2/2 admission. Verification: test-build-v2-admission.mjs, test-build-v2-perf.mjs, test-build-v2-next.mjs and test-build-v2-telemetry.mjs. Host journal defaults to ~/.pandacorp/host/perf/journal.jsonl; performance writes run outside the lease mutex."

  - id: DR-157
    patron: "Disk-aware admission, safe worktree lifecycle and checkout cost"
    default: "BUILD-9/15 and BUILD-5 own disk and teardown. A new worktree reserves 1.5 GiB and must leave at least 15 GiB free; existing copies may continue. Bootstrap requires 15360 + 1500 MiB and exit 4 means wait/disk, G2 reserved exit 76, never a patch or code verdict. Reclaim eligible checkouts at landing/retry/close, keeping branches and non-worktree evidence; waiting_gate retains integration. Shared predicates prove run/branch/exact path, worker termination and dirty/hidden-change safety; unknown signals retain the copy. gc/archive and terminal cleanup reserve the lease mutex and revalidate authority through final writes. Sparse docs is limited to build/patch/tests, with full fallback on any error. Use pnpm shared-store clones, never a node_modules symlink; offline/frozen then prefer-offline/frozen install, plain only on lock divergence. G3 releases the heavy slot before clearing generated .next/.next-fidelity/test-results on green or red."
    requiere_humano: false
    nota: "Owner disk requirement plus DEC-17, DFIX and FIX2. DR-145/CONV-21 exceptions never permit deleting protected state parents. Verification: test-build-v2-disk.mjs, test-worktree-sweep.mjs, test-session-cleanup.mjs, test-session-cleanup-adversarial.mjs, test-worktree-bootstrap.sh and merge-queue lifecycle suites. Bootstrap provenance is identity/hash bound; later owner edits invalidate it."

  - id: DR-158
    patron: "Verify speed: fail-fast, single gate owner, prod-build browser gates, mobile allowlist, parallel-safe workers, affected iteration"
    default: "Keep full G3 certification before main. Certification uses Vitest bail=1 and Playwright maxFailures=1; --no-bail or PANDACORP_VERIFY_NO_BAIL=1 accumulates failures without changing DR-146 shuffled seeds. One kernel lock per checkout owns reports, stamps and browser resources; contention exits 75 before mutation, never reuses a foreign server. Green-stamp v2 binds tree, gate, dependency lock/installed graph metadata, Node, all ambient environment inputs except declared invocation/shell controls, lane.env and physical e2e fixtures at start and end; any doubt runs full. Browser gates share one production build and one owned server, legacy mobile coverage unless a reviewed inventory explicitly excludes named duplicates (unknown specs stay mobile), and reviewed parallel-safe projects before serial complements; visual and shared-state writers remain serial. Combined --no-bail diagnostics use one global worker and no success dependencies, so red projects cannot suppress later projects; certification retains the ordered 3-worker safe tier and fail-fast dependencies. --affected is iteration only, always partial and never certification: omit browser only for proven query/worker data-only changes, retaining global static/unit gates and the browser on unknown UI/dependencies/Git signals."
    requiere_humano: false
    nota: "Owner chose option B of verify-research.md. Extends DR-143/146, preserves DR-055/056/059/074/075 and closes BL-0300's checkout contention mechanism. Template-first, Mission Control first adopter. Verification: test-verify-gate-report.sh, test-verify-before-stop.sh, test-e2e-tiers.mjs, test-e2e-diagnostic-phases.mjs (real scheduler, no browser/server) and test-merge-queue-*.sh. Installed graph metadata does not hash arbitrary edits inside node_modules; externally changed fixture roots and environment inputs outside the declared inputs require invalidation. Timing claims require unrestricted browser measurements."

  - id: DR-159
    patron: "keeping DR-158 verification speed as project test suites grow"
    default: "DURABLE GATE COST: Stack A warns on unclassified e2e specs when the project opts into inventories. Missing classifications retain serial and both-platform coverage. Every added/changed spec updates the parallel/serial and mobile inventories with reviewed reasons. The managed vitest-policy.ts helper supplies isolated Node-default/explicit-DOM projects, DOM-only setup and a validated PANDACORP_VITEST_MAX_WORKERS override; absent override preserves runner/project worker behavior and DR-146 order/seed. Upgrade never overwrites project Vitest config. Full gate reports compare stage durations to a reviewed project-owned gate-budget.json baseline and margin; warnings never fail, certify, omit tests or auto-raise the baseline."
    requiere_humano: false
    nota: "Owner DUR request, 2026-11-13. Plugin 10.2.0, overlay 9.2.0. Canonical quality.md and build-orchestration.md; machinery tests test-verify-gate-report.sh and test-vitest-policy.mjs. Fixture-template reuse is documentation only, keyed by migration/toolchain fingerprint with fresh isolated clones and zero-residue checks."

  - id: DR-160
    patron: "PostHog organization/project provisioning for an app with analytics explicitly selected for the current version"
    default: "ONE ORGANIZATION PER APP under the existing shared PostHog login, free plan without a card, exactly one project per organization. Treat each app as a separate company. Create the organization with the app name, choose US/EU at creation, record organization name/ID, project ID and region in the project's .pandacorp/accounts/services.yaml, and never reuse another app's key. Reconcile existing app IDs before create/retry; no automatic migration. Stop and escalate if a card is requested. Reevaluate with the owner upon any PostHog notice, email or alert. Fallback requires owner approval: one organization with a card and $0 billing limits, one project per app, up to 6 projects on pay-as-you-go; Boost USD 250/month for unlimited projects. The general prohibition on proliferating accounts for other providers remains."
    requiere_humano: false
    nota: "Owner-stated decision 2026-11-13: separate app/company boundaries under one existing login, without card or spend. The owner consciously accepts Terms section 2.1(d) risk (updated 2026-06-29, https://posthog.com/terms): intended circumvention of subscription/account/usage limits is prohibited. Multiple organizations are a normal documented feature (https://posthog.com/docs/settings/organizations), with no literal blanket prohibition; this is not a provider waiver or assurance of compliance. Verified 2026-11-13: Free 1 project/org, pay-as-you-go 6, Boost USD 250/month unlimited projects; analytics 1M events/month per organization shared across projects (https://posthog.com/pricing, https://posthog.com/docs/billing/common-questions). Region US/EU is chosen at organization creation. Owner reports precedent funko-tracker ADR-0026, same login, no card; native IDs and personal account identity stay in private metadata. Supersedes only the PostHog restriction in DR-036/134. Canonical recipe: factory/services/catalog.yaml; operative standard: external-services.md. Plugin 10.4.0, overlay 9.3.0."

  - id: DR-161
    patron: "a company has less than 15 % of its subscription quota left while a build would route reviews (or deferred re-reviews, or the audit) to it"
    default: "Threshold/conserve routing SUPERSEDED by DR-162. Historical policy: QUOTA CONSERVE. A provider whose known reading (5-hour or weekly) is at or above model-tiers.json thresholds.quota_conserve (85) and below quota_stop (90) is conserved. Builds keep the run label's company (a conserved label company still takes its own units). Reviews of the other company's work stay in the author's company with a DIFFERENT model (Codex Sol/Luna-built -> Astra high, Astra-built -> Sol high, r1 Sol xhigh; Claude-built -> the existing quota fallback cell), recorded degraded: conserve. No cross-company deferred re-review is queued for it (at most a note: review-record output deferred_skipped), pending deferred entries are not scheduled while their company is conserved, the Claude-pinned audit waits in the deferred ledger, and landing is never blocked by any of this. Above 15 % left BUILD-10 cross-company review is unchanged; at 90 % BUILD-11 and N7 apply as before. An unknown reading is never conserved. Amended 2026-11-13 (BL-0321): less than 15 % left includes a company out of quota (>= 90 %), so a review routed while the other company is out also uses the different-model on_conserve cell (never park, never same-model when another model exists) and queues no deferred re-review; builds still follow BUILD-11 (no new units for an out-of-quota company). Unreachable is unchanged. Amended again 2026-11-13 (BL-0322): when every author model of one company authored the reviewed diff, the strongest author's cell reviews (same_model, no deferred, never parked), and a Claude reading at or above 85 % stays known until its window resets. Canonical: BUILD-10/BUILD-11 in factory/standards/build-engine.md."
    requiere_humano: false
    nota: "Owner decision 2026-11-13 in this session (owner's words: 'si, vamos por la opcion A'), after funko-tracker run br-2026-11-14-01 with Claude nearly out of quota. Amends DR-152 and BUILD-10/11 (N7 stays the only same-MODEL exception; conserve is same-company, different-model). The relay of the request by a peer session was not taken as approval; the owner answered the decision card directly. BL-0320, plugin 10.5.0. Tests: test-build-v2-conserve.mjs, test-build-v2-review.mjs."


  - id: DR-162
    patron: "never-stop shared capacity allocator"
    default: "Never stop for a single tool's quota: every new unit and review uses plugin/runtime/capacity.mjs decide() and falls back to the other qualified tool. Only when neither tool fits does capacity park the run at a safe point with resumeAt persisted in state and journal; never ask the owner about quota. Selection is fixed during an execution. Images require Codex and return wait/resumeAt when unavailable. Account snapshots live in ~/.pandacorp/host/capacity/ (PANDACORP_CAPACITY_DIR in tests), atomically replaced with mode 0600. Claude get_usage is ingested by the lead at startup and before every wave; Codex is read passively from rollouts, never by launching a quota probe model. Decisions are logged per run or at account scope. Role and risk select the model: ordinary Codex Sol low, delicate Sol medium, design Sol high, Astra high only for critical risk; Claude fallback preserves the risk floor. Review independence is context independence. No author/attempt escalation, threshold veto, conserve-specific fallback or required cross-company re-review. Phase 3: a certified subscription limit suspends the same worktree, dirty files, branch, worker thread/session, report token, pin and attempt. 429/529 are transient same-cell retries with 60/120/240/480/900 seconds backoff and Retry-After capped at 900 seconds; a mere quota citation is not exhaustion. All-waiting runs retain the lease and minimum resumeAt. Drive sleeps to resumeAt+60s and rereads both account sources; the open Claude lead uses ScheduleWakeup, re-ingests get_usage and calls start --resume --wake-generation N. One conditional waiting-to-resuming claim under the lease mutex fences drive, lead and manual wake; dead/failed claims are recoverable. Unknown or expired observations never confirm renewal and reread with capped backoff. Every suspension, wait, wake and resume logs its reason, cell and resumeAt. Reversible technical doubts become accepted engine assumptions with reason and reversal, including lone units; they do not block integration. Unauthorized production, money, deletion and external communication remain human gates. Concurrent-account reservation remains a later phase."
    requiere_humano: false
    nota: "Owner instruction 2026-11-14, phases 2a and 3. Supersedes the threshold/conserve part of DR-161 and the provider-independence/90-95 threshold portions of DR-152; preserves human gates and deterministic risk. Canonical: factory/standards/build-engine.md BUILD-10/11 and plugin/docs/capacity.md. Passive account ingestion, dispatch adapters and resumeAt persistence are covered by plugin capacity/build suites; phase-3 fake-provider suites verify continuation and wake races; a real reset/native timer remains phase-4 qualification."
