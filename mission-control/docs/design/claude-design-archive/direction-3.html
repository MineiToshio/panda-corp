<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Pandacorp · Dirección 3 — Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
/* ============ DIRECCIÓN 3 — ATELIER ============ */
:root{
  --canvas:oklch(0.975 0.005 85); --panel:oklch(0.995 0.004 90); --card:oklch(1 0 0);
  --t1:oklch(0.25 0.012 75); --t2:oklch(0.46 0.012 75); --t3:oklch(0.54 0.012 75);
  --bd:oklch(0.90 0.006 80); --bd2:oklch(0.80 0.01 80);
  --accent:oklch(0.52 0.11 215); --accent-text:oklch(0.45 0.11 215); --accent-bg:oklch(0.95 0.035 215); --on-accent:oklch(0.99 0.01 90);
  --ok:oklch(0.52 0.12 155); --ok-bg:oklch(0.96 0.04 155); --warn:oklch(0.58 0.11 70); --warn-bg:oklch(0.96 0.05 75);
  --danger:oklch(0.53 0.18 28); --danger-bg:oklch(0.96 0.04 28); --info:oklch(0.52 0.10 235); --info-bg:oklch(0.96 0.03 235);
  --shadow:0 1px 2px oklch(0.3 0.02 220 / .05), 0 8px 24px oklch(0.3 0.02 220 / .07);
  --shadow-pop:0 16px 48px oklch(0.3 0.02 220 / .18);
  --rsm:8px; --rmd:12px; --rlg:16px; --rpill:999px;
  --display:"Space Grotesk",system-ui,sans-serif; --body:"Hanken Grotesk",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --ag-researcher:oklch(0.55 0.12 145); --ag-researcher-text:oklch(0.45 0.12 145); --ag-researcher-bg:oklch(0.95 0.04 145); --ag-researcher-bd:oklch(0.78 0.09 145);
  --ag-product-manager:oklch(0.52 0.16 300); --ag-product-manager-text:oklch(0.45 0.16 300); --ag-product-manager-bg:oklch(0.95 0.04 300); --ag-product-manager-bd:oklch(0.76 0.11 300);
  --ag-designer:oklch(0.56 0.18 355); --ag-designer-text:oklch(0.47 0.18 355); --ag-designer-bg:oklch(0.95 0.04 355); --ag-designer-bd:oklch(0.78 0.12 355);
  --ag-architect:oklch(0.52 0.15 250); --ag-architect-text:oklch(0.45 0.15 250); --ag-architect-bg:oklch(0.95 0.04 250); --ag-architect-bd:oklch(0.76 0.10 250);
  --ag-backend-dev:oklch(0.54 0.10 195); --ag-backend-dev-text:oklch(0.44 0.09 195); --ag-backend-dev-bg:oklch(0.95 0.04 195); --ag-backend-dev-bd:oklch(0.77 0.08 195);
  --ag-frontend-dev:oklch(0.58 0.14 232); --ag-frontend-dev-text:oklch(0.47 0.14 232); --ag-frontend-dev-bg:oklch(0.95 0.04 232); --ag-frontend-dev-bd:oklch(0.79 0.09 232);
  --ag-test-writer:oklch(0.62 0.13 65); --ag-test-writer-text:oklch(0.48 0.11 65); --ag-test-writer-bg:oklch(0.95 0.05 65); --ag-test-writer-bd:oklch(0.80 0.10 65);
  --ag-reviewer:oklch(0.55 0.11 165); --ag-reviewer-text:oklch(0.44 0.10 165); --ag-reviewer-bg:oklch(0.95 0.04 165); --ag-reviewer-bd:oklch(0.78 0.08 165);
  --ag-security-auditor:oklch(0.56 0.18 28); --ag-security-auditor-text:oklch(0.47 0.18 28); --ag-security-auditor-bg:oklch(0.95 0.04 28); --ag-security-auditor-bd:oklch(0.78 0.13 28);
  --tier0:oklch(0.58 0.012 250); --tier1:oklch(0.55 0.14 150); --tier2:oklch(0.52 0.15 245); --tier3:oklch(0.50 0.18 305); --tier4:oklch(0.60 0.15 55);
}
[data-theme="dark"]{
  --canvas:oklch(0.19 0.01 225); --panel:oklch(0.24 0.012 222); --card:oklch(0.28 0.013 220);
  --t1:oklch(0.94 0.006 90); --t2:oklch(0.78 0.01 88); --t3:oklch(0.69 0.01 85);
  --bd:oklch(0.33 0.012 220); --bd2:oklch(0.46 0.015 215);
  --accent:oklch(0.72 0.115 215); --accent-text:oklch(0.80 0.105 215); --accent-bg:oklch(0.30 0.06 218); --on-accent:oklch(0.18 0.02 225);
  --ok:oklch(0.74 0.13 155); --ok-bg:oklch(0.30 0.06 155); --warn:oklch(0.80 0.12 75); --warn-bg:oklch(0.31 0.06 78);
  --danger:oklch(0.68 0.18 28); --danger-bg:oklch(0.31 0.08 28); --info:oklch(0.74 0.11 235); --info-bg:oklch(0.30 0.05 235);
  --shadow:0 1px 2px oklch(0 0 0 / .3), 0 8px 28px oklch(0 0 0 / .35); --shadow-pop:0 18px 50px oklch(0 0 0 / .5);
  --ag-researcher:oklch(0.68 0.13 145); --ag-researcher-text:oklch(0.80 0.12 145); --ag-researcher-bg:oklch(0.30 0.06 145); --ag-researcher-bd:oklch(0.52 0.10 145);
  --ag-product-manager:oklch(0.66 0.16 300); --ag-product-manager-text:oklch(0.80 0.13 300); --ag-product-manager-bg:oklch(0.30 0.07 300); --ag-product-manager-bd:oklch(0.52 0.12 300);
  --ag-designer:oklch(0.68 0.18 355); --ag-designer-text:oklch(0.81 0.13 355); --ag-designer-bg:oklch(0.31 0.08 355); --ag-designer-bd:oklch(0.54 0.14 355);
  --ag-architect:oklch(0.66 0.15 250); --ag-architect-text:oklch(0.81 0.12 250); --ag-architect-bg:oklch(0.30 0.07 250); --ag-architect-bd:oklch(0.52 0.12 250);
  --ag-backend-dev:oklch(0.70 0.11 195); --ag-backend-dev-text:oklch(0.82 0.10 195); --ag-backend-dev-bg:oklch(0.30 0.05 195); --ag-backend-dev-bd:oklch(0.52 0.09 195);
  --ag-frontend-dev:oklch(0.72 0.13 232); --ag-frontend-dev-text:oklch(0.84 0.11 232); --ag-frontend-dev-bg:oklch(0.31 0.06 232); --ag-frontend-dev-bd:oklch(0.54 0.11 232);
  --ag-test-writer:oklch(0.74 0.13 65); --ag-test-writer-text:oklch(0.84 0.11 65); --ag-test-writer-bg:oklch(0.31 0.06 65); --ag-test-writer-bd:oklch(0.56 0.11 65);
  --ag-reviewer:oklch(0.70 0.12 165); --ag-reviewer-text:oklch(0.82 0.11 165); --ag-reviewer-bg:oklch(0.30 0.05 165); --ag-reviewer-bd:oklch(0.52 0.10 165);
  --ag-security-auditor:oklch(0.66 0.18 28); --ag-security-auditor-text:oklch(0.80 0.14 28); --ag-security-auditor-bg:oklch(0.31 0.08 28); --ag-security-auditor-bd:oklch(0.54 0.15 28);
  --tier0:oklch(0.70 0.015 250); --tier1:oklch(0.72 0.15 150); --tier2:oklch(0.68 0.15 245); --tier3:oklch(0.68 0.19 305); --tier4:oklch(0.74 0.16 55);
}
[data-hc="on"]{ --t1:oklch(0.16 0.012 75); --bd:oklch(0.70 0.01 80); --bd2:oklch(0.45 0.012 80); --accent-text:oklch(0.40 0.12 215); }
[data-theme="dark"][data-hc="on"]{ --t1:oklch(0.98 0.005 90); --bd:oklch(0.52 0.015 220); --canvas:oklch(0.15 0.01 225); }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--canvas);color:var(--t1);font-family:var(--body);font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.num,.mono{font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:var(--display);font-weight:600;line-height:1.2;letter-spacing:-.01em}
img{display:block}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:var(--rsm)}
::selection{background:var(--accent-bg)}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px 80px}

/* ---- topbar / guild ---- */
.guild{position:sticky;top:0;z-index:30;background:color-mix(in oklch, var(--panel) 90%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.guild-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:18px}
.brand .mk{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:18px;box-shadow:var(--shadow)}
.lvl{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--t2)}
.lvl .plate{background:var(--accent-bg);color:var(--accent-text);font-weight:600;border-radius:var(--rsm);padding:2px 8px;border:1px solid var(--accent-bd,transparent)}
.xpbar{width:108px;height:8px;background:color-mix(in oklch,var(--canvas) 70%,var(--bd));border:1px solid var(--bd);border-radius:var(--rpill);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:var(--rpill)}
.gright{margin-left:auto;display:flex;align-items:center;gap:6px}
.iconbtn{width:38px;height:38px;border-radius:var(--rmd);border:1px solid var(--bd);background:var(--card);color:var(--t2);display:grid;place-items:center;font-size:18px}
.iconbtn:hover{color:var(--t1);border-color:var(--bd2)}
.iconbtn.on{background:var(--accent-bg);color:var(--accent-text);border-color:transparent}
.tabs{display:flex;gap:3px;flex-wrap:wrap;padding:8px 0 2px}
.tab{padding:8px 13px;border-radius:var(--rmd);font-size:13.5px;font-weight:500;color:var(--t2);border:1px solid transparent;display:flex;align-items:center;gap:7px;background:transparent}
.tab:hover{background:var(--panel);color:var(--t1)}
.tab.on{background:var(--accent-bg);color:var(--accent-text);font-weight:600}
.tab .ti{font-size:16px}

/* ---- KPI strip ---- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--rmd);padding:11px 13px;box-shadow:var(--shadow)}
.kpi .k{font-size:11.5px;color:var(--t3);display:flex;align-items:center;gap:5px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:600;margin-top:3px}
.kpi .s{font-size:11px;color:var(--t3)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
body:not(.rm) .live.on .dot{animation:pulse 1.6s ease-in-out infinite}
.live.off{color:var(--t3)} .live.off .dot{background:var(--t3)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* ---- panels / cards ---- */
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:var(--rlg);padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rmd);box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:9px;margin:6px 2px 12px}
.sec-h .ti{font-size:20px;color:var(--accent-text)}
.sec-h h2{font-size:19px;margin:0}
.sec-h .sub{font-size:12.5px;color:var(--t3);margin:1px 0 0}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--rpill);display:inline-flex;align-items:center;gap:4px}
.btn{font-family:var(--body);font-size:13px;font-weight:500;border:1px solid var(--bd2);background:var(--card);color:var(--t1);border-radius:var(--rmd);padding:8px 13px;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--panel)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;box-shadow:var(--shadow)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.muted{color:var(--t3)}

/* ---- tablero / kanban ---- */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.col{flex:0 0 232px;background:var(--panel);border:1px solid var(--bd);border-radius:var(--rlg);padding:10px}
.col-h{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--t2);margin-bottom:9px;padding:0 2px}
.col-h .cnt{background:var(--card);border:1px solid var(--bd);border-radius:var(--rpill);min-width:20px;text-align:center;font-size:11px;padding:0 5px}
.kcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--rmd);padding:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--bd2);transform:translateY(-1px)}
body:not(.rm) .kcard{transition:transform var(--du,.18s) ease, border-color .18s ease}
.kcard .tt{font-size:13.5px;font-weight:600;margin-bottom:8px}
.kcard .meta{display:flex;align-items:center;justify-content:space-between;gap:6px}
.score{font-size:11px;color:var(--t3);font-weight:600}
.run{color:var(--ok);font-size:12px}
.searchbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.field{position:relative;flex:1;min-width:180px}
.field .ti{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:16px}
.field input,select.sel{font-family:var(--body);font-size:13px;background:var(--card);border:1px solid var(--bd2);border-radius:var(--rmd);color:var(--t1);padding:9px 11px}
.field input{width:100%;padding-left:34px}
select.sel{padding:9px 11px}

/* ---- mission control ---- */
.mc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--bd);border-radius:var(--rmd);padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:500;border:0;background:transparent;color:var(--t2);border-radius:var(--rsm);padding:6px 11px;display:flex;align-items:center;gap:6px}
.seg button.on{background:var(--accent-bg);color:var(--accent-text);font-weight:600}
.mc-counts{display:flex;gap:6px;flex-wrap:wrap}
.mc-counts .pc{font-size:12px;font-weight:600;border:1px solid var(--bd);border-radius:var(--rpill);padding:3px 10px;display:flex;align-items:center;gap:6px;background:var(--card)}
.mc-grid{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.scene-wrap{background:var(--panel);border:1px solid var(--bd);border-radius:var(--rlg);padding:12px;position:relative;overflow:hidden}
#mc-scene{position:relative;width:100%;height:540px;border-radius:var(--rmd);overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 12%, color-mix(in oklch,var(--accent) 7%, transparent), transparent 60%),
    repeating-linear-gradient(0deg, color-mix(in oklch,var(--bd) 55%,transparent) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, color-mix(in oklch,var(--bd) 55%,transparent) 0 1px, transparent 1px 34px),
    var(--canvas);
  image-rendering:pixelated}
.station{position:absolute;width:158px;height:116px;border-radius:var(--rmd);overflow:hidden;border:2px solid var(--st,var(--bd2));transform:translate(-50%,-50%);box-shadow:var(--shadow)}
.station .bg{position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated;transition:filter .45s ease,opacity .45s ease}
.station.dim .bg{filter:grayscale(.85) brightness(.82);opacity:.55}
.station.hot{box-shadow:0 0 0 3px color-mix(in oklch,var(--st) 60%,transparent),var(--shadow-pop)}
.station .tint{position:absolute;inset:0;background:var(--st);opacity:.18}
.station .sign{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--bd);border-radius:var(--rsm);padding:1px 7px;white-space:nowrap;color:var(--t1);box-shadow:var(--shadow)}
.station .sign .ti{font-size:13px;color:var(--st)}
.agent{position:absolute;width:74px;height:74px;transform:translate(-50%,-50%);z-index:5;will-change:transform}
body:not(.rm) .agent{transition:left 1.15s cubic-bezier(.2,0,0,1), top 1.15s cubic-bezier(.2,0,0,1)}
.agent .spr{width:74px;height:74px;image-rendering:pixelated;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 3px 2px oklch(0 0 0 /.28))}
.agent.s-idle .spr{opacity:.5;filter:grayscale(.5)}
.agent.s-fail .spr{transform:rotate(-10deg) translateY(4px);filter:grayscale(.6) brightness(.85)}
.agent .halo{position:absolute;left:50%;bottom:8px;width:48px;height:15px;border-radius:50%;background:var(--st);transform:translateX(-50%) scale(.8);opacity:0;z-index:1}
.agent.s-work .halo,.agent.s-review .halo,.agent.s-blocked .halo{opacity:.55}
body:not(.rm) .agent.s-work .halo,body:not(.rm) .agent.s-review .halo,body:not(.rm) .agent.s-blocked .halo{animation:halo 1.7s ease-in-out infinite}
.agent.s-blocked .halo{background:var(--danger)} .agent.s-review .halo{background:var(--warn)}
@keyframes halo{0%,100%{transform:translateX(-50%) scale(.78);opacity:.32}50%{transform:translateX(-50%) scale(1.15);opacity:.58}}
.agent .prog{position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:46px;height:6px;border-radius:var(--rpill);background:color-mix(in oklch,var(--canvas) 60%,var(--bd2));border:1px solid var(--bd);overflow:hidden;opacity:0;z-index:6}
.agent.s-work .prog{opacity:1}
.agent .prog i{display:block;height:100%;width:0;background:var(--st);border-radius:var(--rpill);transition:width .4s linear}
.agent .emote{position:absolute;top:-26px;left:50%;transform:translateX(-50%);min-width:24px;height:24px;padding:0 6px;border-radius:9px;background:var(--card);border:1px solid var(--bd2);display:none;align-items:center;justify-content:center;font-size:14px;font-weight:700;z-index:7;box-shadow:var(--shadow)}
.agent.has-emote .emote{display:flex}
body:not(.rm) .agent.has-emote .emote{animation:bob 1.5s ease-in-out infinite}
.agent.s-blocked .emote{color:var(--danger);border-color:var(--danger)} .agent.s-review .emote{color:var(--warn)}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.agent .badge{position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;letter-spacing:.02em;background:var(--st);color:#fff;border-radius:var(--rpill);padding:1px 7px;white-space:nowrap;z-index:6;box-shadow:var(--shadow)}
.agent.s-fail .badge{background:var(--danger)} .agent.s-idle .badge{background:var(--t3)}
.agent .pkt{position:absolute;top:18px;right:6px;width:20px;height:20px;border-radius:var(--rsm);background:var(--warn-bg);border:1px solid var(--warn);display:none;align-items:center;justify-content:center;z-index:6}
.agent.carry .pkt{display:flex}.agent .pkt .ti{font-size:12px;color:var(--warn)}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:8}
body:not(.rm) .particle{animation:burst .7s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--px),var(--py)) scale(.3)}}
.rm-note{position:absolute;top:12px;left:12px;font-size:11.5px;color:var(--t2);background:var(--card);border:1px solid var(--bd);border-radius:var(--rsm);padding:4px 9px;display:none}
body.rm .rm-note{display:flex;align-items:center;gap:6px}

/* ---- feed ---- */
.feed{background:var(--panel);border:1px solid var(--bd);border-radius:var(--rlg);padding:12px;display:flex;flex-direction:column;height:564px}
.feed-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.feed-h .tt{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.feed-list{overflow-y:auto;display:flex;flex-direction:column;gap:1px;flex:1}
.fe{display:flex;gap:9px;padding:7px 6px;border-radius:var(--rsm);font-size:12.5px;align-items:flex-start}
.fe:hover{background:var(--card)}
.fe .ic{width:24px;height:24px;border-radius:var(--rsm);display:grid;place-items:center;font-size:14px;flex:0 0 auto;background:var(--st-bg,var(--accent-bg));color:var(--st-tx,var(--accent-text));border:1px solid var(--st-bd,transparent)}
.fe .bd{flex:1;min-width:0}
.fe .who{font-weight:600;color:var(--st-tx,var(--t1))}
.fe .tm{font-size:10.5px;color:var(--t3);white-space:nowrap}
body:not(.rm) .fe.new{animation:slidein .26s ease}
@keyframes slidein{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

/* ---- DAG / timeline ---- */
.dag{background:var(--panel);border:1px solid var(--bd);border-radius:var(--rlg);padding:16px;min-height:540px}
.dag-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.node{border:1px solid var(--bd2);background:var(--card);border-radius:var(--rmd);padding:8px 11px;font-size:12.5px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);position:relative}
.node.dim{opacity:.45} .node.focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.node.fail{border-color:var(--danger)} .node.done{border-color:var(--ok)}
.node .st-dot{width:9px;height:9px;border-radius:50%}
.arrow{color:var(--t3);font-size:16px}

/* ---- logros ---- */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--rmd);padding:11px 13px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px}
.stat .v{font-family:var(--display);font-size:25px;font-weight:600;margin-top:2px}
.chains{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.chain{background:var(--card);border:1px solid var(--bd);border-radius:var(--rlg);padding:13px;box-shadow:var(--shadow)}
.chain-h{display:flex;align-items:center;gap:10px}
.chain-ic{width:42px;height:42px;border-radius:var(--rmd);display:grid;place-items:center;font-size:21px;background:var(--warn-bg);color:var(--tier,var(--t3))}
.tierbadge{font-size:10px;font-weight:700;color:#fff;border-radius:var(--rsm);padding:2px 7px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;flex:0 0 auto}
[data-theme="dark"] .tierbadge{color:oklch(0.16 0.012 230)}
.pips{display:flex;gap:3px}
.pip{width:9px;height:9px;border-radius:50%;background:var(--bd)}
.bar{height:8px;background:color-mix(in oklch,var(--canvas) 65%,var(--bd));border:1px solid var(--bd);border-radius:var(--rpill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--rpill)}
.ach{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:var(--rmd);padding:11px 13px}
.ach.locked{background:var(--panel);border-style:dashed;opacity:.72}
.ach .ai{width:38px;height:38px;border-radius:var(--rmd);display:grid;place-items:center;font-size:19px;background:var(--warn-bg);color:var(--warn);flex:0 0 auto}
.ach.locked .ai{background:var(--panel);color:var(--t3)}
.grid-ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:9px;margin-bottom:14px}

/* ---- config ---- */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:18px}
.mode{background:var(--card);border:1px solid var(--bd);border-radius:var(--rlg);padding:13px;box-shadow:var(--shadow);position:relative}
.mode.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg),var(--shadow)}
.mode .mt{font-family:var(--display);font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.rcard{display:flex;gap:11px;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--st);border-radius:var(--rmd);padding:11px;box-shadow:var(--shadow)}

/* avatars / sprites framed */
.av{position:relative;flex:0 0 auto;border-radius:var(--rmd);overflow:hidden;background:var(--st-bg);border:1px solid var(--st-bd)}
.av img{width:100%;height:100%;image-rendering:pixelated;object-fit:cover;object-position:center top}

/* docs */
.docs-grid{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.docnav .it{padding:8px 11px;border-radius:var(--rmd);font-size:13px;color:var(--t2);display:flex;gap:8px;align-items:center;border:1px solid transparent}
.docnav .it.on{background:var(--accent-bg);color:var(--accent-text);font-weight:600}
.docnav .it:hover{background:var(--panel)}
.doc h1{font-size:23px;margin:0 0 8px}.doc h2{font-size:17px;margin:18px 0 6px}.doc h3{font-size:14px;margin:14px 0 4px}
.doc p{margin:7px 0;color:var(--t1)}.doc ul{margin:7px 0;padding-left:20px}.doc li{margin:4px 0}
.doc code{font-family:var(--mono);background:var(--panel);border:1px solid var(--bd);padding:1px 5px;border-radius:4px;font-size:12.5px}

/* workspace */
.cmd{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--bd);border-radius:var(--rmd);padding:9px 11px;margin-top:8px}
.cmd .t{font-family:var(--mono);font-size:12.5px;flex:1;color:var(--t1);overflow-wrap:anywhere}
.cmd .when{font-size:10.5px;color:var(--t3);max-width:200px;text-align:right}
.decision{background:var(--warn-bg);border:1px solid var(--warn);border-radius:var(--rmd);padding:11px 13px;margin-top:9px}
.keypoints li{margin:5px 0}

/* overlay celebrations */
#overlay{position:fixed;inset:0;z-index:80;pointer-events:none}
.toast{position:fixed;right:18px;bottom:18px;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ok);border-radius:var(--rmd);box-shadow:var(--shadow-pop);padding:12px 14px;display:flex;gap:10px;align-items:center;max-width:330px;pointer-events:auto}
body:not(.rm) .toast{animation:toastin .3s cubic-bezier(.34,1.4,.64,1)}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.celebrate{position:fixed;inset:0;display:grid;place-items:center;background:oklch(0.2 0.02 60 / .55);backdrop-filter:blur(3px);pointer-events:auto}
.cel-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rlg);padding:30px 34px;text-align:center;box-shadow:var(--shadow-pop);max-width:420px}
body:not(.rm) .cel-card{animation:celin .34s cubic-bezier(.34,1.4,.64,1)}
@keyframes celin{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.cel-card .big{font-family:var(--display);font-size:30px;font-weight:700;margin:8px 0 4px}
.cel-ring{width:96px;height:96px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:46px;background:var(--accent-bg);color:var(--accent-text);border:3px solid var(--accent)}
.confetti{position:fixed;width:9px;height:13px;top:-20px;z-index:90}
body:not(.rm) .confetti{animation:fall linear forwards}
@keyframes fall{to{transform:translateY(104vh) rotate(620deg);opacity:.2}}

/* demo dock */
.dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:70;background:var(--card);border:1px solid var(--bd2);border-radius:var(--rpill);box-shadow:var(--shadow-pop);padding:6px;display:flex;gap:4px;align-items:center;flex-wrap:wrap;max-width:96vw}
.dock .lbl{font-size:11px;color:var(--t3);padding:0 8px;font-weight:600}
.dock button{font-size:12px;border:1px solid var(--bd);background:var(--panel);color:var(--t1);border-radius:var(--rpill);padding:6px 11px;display:flex;align-items:center;gap:5px}
.dock button:hover{background:var(--accent-bg);color:var(--accent-text)}

.empty{text-align:center;color:var(--t3);padding:40px 20px}
.empty .ti{font-size:40px;opacity:.5}
.skel{background:linear-gradient(90deg,var(--panel),var(--card),var(--panel));background-size:200% 100%;border-radius:var(--rmd)}
body:not(.rm) .skel{animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

 if(/^### /.test(l)){if(ul){o+="</ul>";ul=false;}o+="<h3>"+h(l.slice(4))+"</h3>";}

function chainState(ch){var v=STATS[ch.s],lo=ch.lower,ci=-1;for(var t=0;t<ch.t.length;t++){var th=ch.t[t][0];if(lo?v<=th:v>=th)ci=t;}var nx=ch.t[ci+1]||null,pct;if(!nx)pct=100;else if(lo){var pv=ci>=0?ch.t[ci][0]:v;pct=Math.max(0,Math.min(100,Math.round((pv-v)/(pv-nx[0])*100)));}else{var pv2=ci>=0?ch.t[ci][0]:0;pct=Math.max(0,Math.min(100,Math.round((v-pv2)/(nx[0]-pv2)*100)));}return {ci:ci,v:v,next:nx,pct:pct};}
function tierVar(ci){return ci>=0?'var(--tier'+Math.min(ci,4)+')':'var(--t3)';}

 var chains='<div class="chains" style="margin-bottom:20px">'+CHAINS.map(chainCard).join("")+'</div>';

 var ones=cats.map(function(c){var items=ONETIME.filter(function(a){return a.cat===c;});if(!items.length)return"";return '<div style="font-size:12.5px;font-weight:600;color:var(--t2);margin:0 0 7px">'+c+'</div><div class="grid-ach">'+items.map(oneCard).join("")+'</div>';}).join("");

 +'<div style="font-size:14px;font-weight:600;margin:0 0 9px;font-family:var(--display)"><i class="ti ti-stairs-up"></i> Cadenas de logros</div>'+chains

}

/* =================== MISSION CONTROL ENGINE =================== */
var MC={running:true,runId:0,agents:[],lastEvent:null,feed:[],sceneSize:[0,0]};
function mcWorkingCount(){return MC.agents.filter(function(a){return a.state==="work";}).length||(ST.view==="mc"?0:2);}
var EMOTE={work:"",walk:"",idle:"z",blocked:"!",review:"?"};
function mcStateLabel(s){return {work:"Trabajando",walk:"En tránsito",idle:"En espera",blocked:"Bloqueado",review:"Revisando",fail:"Falló",done:"Completado"}[s]||s;}
function mountScene(tries){
 tries=tries||0;
 var scene=document.getElementById("mc-scene"); if(!scene)return;
 if(scene.getBoundingClientRect().width<40 && tries<40){ setTimeout(function(){mountScene(tries+1);},50); return; }
 buildScene();
}
function buildScene(){
 var scene=document.getElementById("mc-scene");if(!scene)return;
 var ros=MODES[ST.mode].roster.slice();
 MC.runId++; var myId=MC.runId; MC.agents=[];
 scene.innerHTML="";
 var n=ros.length;
 var rect=scene.getBoundingClientRect();
 MC.sceneSize=[rect.width||532,rect.height||540];
 ros.forEach(function(role,i){
  var ang=-Math.PI/2 + i*2*Math.PI/n;
  var cx=50+36*Math.cos(ang), cy=50+40*Math.sin(ang);
  var hasZone=!!ZONE[role];
  var st=document.createElement("div");
  st.className="station dim"; st.style.cssText="left:"+cx+"%;top:"+cy+"%;"+agStyle(role);
  st.innerHTML=(hasZone?'<div class="bg" style="background-image:url('+ZONE[role]+')"></div>':'<div class="tint"></div>')
   +'<div class="sign"><i class="ti '+ROLE_IC[role]+'"></i> '+ROLE_ES[role]+'</div>';
  scene.appendChild(st);
  var ag=document.createElement("div");
  ag.className="agent s-idle"; ag.style.cssText="left:"+cx+"%;top:"+cy+"%;"+agStyle(role);
  ag.innerHTML='<div class="halo"></div><div class="prog"><i></i></div><div class="emote"></div>'
   +'<img class="spr" src="'+IMG[role]+'" alt="'+ROLE_ES[role]+'" onerror="this.style.opacity=0">'
   +'<span class="pkt"><i class="ti ti-package"></i></span><span class="badge">En espera</span>';
  scene.appendChild(ag);
  MC.agents.push({role:role,el:ag,station:st,state:"idle",home:[cx,cy],prog:0});
 });
 // initial snapshot
 var rm=document.body.classList.contains("rm")||window.matchMedia("(prefers-reduced-motion:reduce)").matches;
 if(rm){ snapshotStatic(); }
 else { MC.agents.forEach(function(a,i){ setState(a, i===0?"work":i===1?"review":i===n-1?"blocked":"idle"); }); mcLoop(myId); }
 updateCounts();
}
function snapshotStatic(){
 var n=MC.agents.length;
 MC.agents.forEach(function(a,i){ setState(a, i===0?"work":i===1?"work":i===2?"review":i===n-1?"blocked":"idle"); });
 if(MC.agents[0]) setProg(MC.agents[0],62);
 updateCounts();
 if(!MC.feed.length){ ["start|backend-dev","read|backend-dev","write|frontend-dev","testfail|reviewer","review|reviewer","block|test-writer"].forEach(function(p){var x=p.split("|");pushFeed(x[1],x[0],true);}); renderFeed(); }
}
function setState(a,s){
 a.state=s; a.el.className="agent s-"+s+(s==="idle"||s==="blocked"||s==="review"?" has-emote":"");
 if(s==="fail"){a.el.classList.add("s-fail");}
 a.el.querySelector(".emote").textContent=EMOTE[s]||"";
 a.el.querySelector(".badge").textContent=mcStateLabel(s);
 a.station.className="station "+((s==="work")?"hot":"dim");
 if(s==="work"){a.prog=8;setProg(a,8);} else {setProg(a,0);}
}
function setProg(a,p){a.prog=p;var bar=a.el.querySelector(".prog i");if(bar)bar.style.width=p+"%";}
function px(a){return [a.home[0]/100*MC.sceneSize[0], a.home[1]/100*MC.sceneSize[1]];}
function mcLoop(myId){
 if(myId!==MC.runId)return;
 if(!MC.running){ setTimeout(function(){mcLoop(myId);},400); return; }
 // advance progress of workers
 MC.agents.forEach(function(a){ if(a.state==="work"){ a.prog+=Math.random()*16+6; if(a.prog>=100){ a.prog=100; setProg(a,100); completeWO(a); } else setProg(a,a.prog); } });
 // occasional events
 if(Math.random()<0.5){ maybeEvent(); }
 updateCounts();
 setTimeout(function(){mcLoop(myId);}, 1400);
}
function completeWO(a){
 pushFeed(a.role,"done"); pushFeed(a.role,"commit");
 burst(a);
 // handoff to a random other
 var others=MC.agents.filter(function(x){return x!==a;});
 var tgt=others[Math.floor(Math.random()*others.length)];
 if(tgt && !document.body.classList.contains("rm")){ doHandoff(a,tgt); }
 else { setState(a,"idle"); promoteIdle(); }
}
function doHandoff(a,tgt){
 var myId=MC.runId;
 a.el.classList.add("carry"); setState(a,"walk"); a.el.classList.add("carry");
 var center=[MC.sceneSize[0]*0.5, MC.sceneSize[1]*0.5];
 var home=px(a), thome=px(tgt);
 // move to center
 a.el.style.transform="translate(-50%,-50%) translate("+(center[0]-home[0])+"px,"+(center[1]-home[1])+"px)";
 setTimeout(function(){ if(myId!==MC.runId)return;
  a.el.style.transform="translate(-50%,-50%) translate("+(thome[0]-home[0])+"px,"+(thome[1]-home[1])+"px)";
 },650);
 setTimeout(function(){ if(myId!==MC.runId)return;
  pushFeed(a.role,"handoff",false,ROLE_ES[tgt.role]); burst(tgt);
  a.el.classList.remove("carry");
  setState(tgt,"work");
  // return home
  a.el.style.transform="translate(-50%,-50%) translate(0,0)";
  setState(a,"idle");
  setTimeout(function(){ if(myId!==MC.runId)return; if(Math.random()<0.6) setState(a, "review"); },500);
  updateCounts();
 },1450);
}
function promoteIdle(){ var idle=MC.agents.filter(function(a){return a.state==="idle";}); if(idle.length){ setState(idle[Math.floor(Math.random()*idle.length)],"work"); } }
function maybeEvent(){
 var a=MC.agents[Math.floor(Math.random()*MC.agents.length)];
 var roll=Math.random();
 if(a.state==="idle"){ if(roll<0.5){setState(a,"work");pushFeed(a.role,"start");} else if(roll<0.7){setState(a,"review");} }
 else if(a.state==="review"){ if(roll<0.4){setState(a,"work");pushFeed(a.role, Math.random()<0.5?"testok":"read");} }
 else if(a.state==="work"){ var k=["read","write","edit","testok"][Math.floor(Math.random()*4)]; if(roll<0.4)pushFeed(a.role,k); }
 else if(a.state==="blocked"){ if(roll<0.3){setState(a,"idle");} }
 // ensure at least one worker
 if(!MC.agents.some(function(x){return x.state==="work";})) promoteIdle();
}
function burst(a){
 if(document.body.classList.contains("rm"))return;
 var scene=document.getElementById("mc-scene");if(!scene)return;
 var p=px(a); var col=getComputedStyle(a.el).getPropertyValue("--st");
 for(var i=0;i<7;i++){ var d=document.createElement("div"); d.className="particle";
  var ang=Math.random()*6.28, dist=20+Math.random()*26;
  d.style.cssText="left:"+p[0]+"px;top:"+(p[1]-6)+"px;background:"+col+";--px:"+(Math.cos(ang)*dist)+"px;--py:"+(Math.sin(ang)*dist-10)+"px";
  scene.appendChild(d); setTimeout(function(el){return function(){el.remove();};}(d),720);
 }
}
function updateCounts(){
 var c={work:0,walk:0,idle:0,blocked:0,review:0};
 MC.agents.forEach(function(a){c[a.state]=(c[a.state]||0)+1;});
 var el=document.getElementById("mc-counts"); if(el){
  el.innerHTML=[
   ['work','ti-tool','var(--accent-text)',c.work,'trabajando'],
   ['walk','ti-package','var(--info)',c.walk,'en tránsito'],
   ['review','ti-eye','var(--warn)',c.review,'revisando'],
   ['blocked','ti-alert-triangle','var(--danger)',c.blocked,'bloqueado'],
   ['idle','ti-zzz','var(--t3)',c.idle,'en espera']
  ].map(function(x){return '<span class="pc"><i class="ti '+x[1]+'" style="color:'+x[2]+'"></i> <span class="num">'+x[3]+'</span> '+x[4]+'</span>';}).join("");
 }
 var kp=document.getElementById("kpi-stamp"); if(kp){kp.textContent=lastStamp();}
}
function pushFeed(role,kind,silent,extra){
 var k=FEED_KINDS[kind]||["evento","ti-point"];
 MC.lastEvent="ahora"; MC.feedTick=Date.now();
 var line={role:role,kind:kind,extra:extra||"",t:Date.now()};
 MC.feed.unshift(line); if(MC.feed.length>60)MC.feed.pop();
 if(!silent)renderFeed(true);
}
function renderFeed(animateFirst){
 var list=document.getElementById("feed-list"); if(!list)return;
 list.innerHTML=MC.feed.map(function(f,ix){
  var k=FEED_KINDS[f.kind]||["evento","ti-point"];
  var ago=Math.max(0,Math.round((Date.now()-f.t)/1000));
  var tm=ago<3?"ahora":(ago<60?("hace "+ago+"s"):("hace "+Math.round(ago/60)+"m"));
  var verb=k[0]+(f.extra?(" "+f.extra):"");
  var failcol=f.kind==="testfail"?";color:var(--danger)":(f.kind==="testok"||f.kind==="done"||f.kind==="commit"?";color:var(--ok)":"");
  return '<div class="fe '+(animateFirst&&ix===0?"new":"")+'" style="'+agStyle(f.role)+'"><span class="ic"><i class="ti '+k[1]+'"'+(failcol?' style="'+failcol.replace(/^;/,'')+'"':'')+'></i></span><div class="bd"><span class="who">'+ROLE_ES[f.role]+'</span> <span class="muted">'+h(verb)+'</span></div><span class="tm num">'+tm+'</span></div>';
 }).join("");
}

 renderTabs();
 var showKpis=(ST.view!=="detalle"&&ST.view!=="workspace");
 var v;
 switch(ST.view){
  case "mc":v=viewMc();break;
  case "tablero":v=viewTablero();break;
  case "portfolio":v=viewPortfolio();break;
  case "detalle":case "workspace":v=viewDetalle();break;
  case "logros":v=viewLogros();break;
  case "config":v=viewConfig();break;
  case "docs":v=viewDocs();break;
  default:v=viewMc();
 }
 app.innerHTML=(showKpis?kpis():"")+v;
 if(ST.view==="mc"&&ST.mcView==="rpg"){ mountScene(); renderFeed(); }

function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("pc-d3-theme",t);}catch(e){}var ic=document.querySelector('[data-act="theme"] i');if(ic)ic.className="ti "+(t==="dark"?"ti-sun":"ti-moon");}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-act]"); if(!t)return; var a=t.dataset.act;
 if(a==="tab"){ ST.view=t.dataset.tab; if(ST.view==="mc")MC.running=true; render(); }
 else if(a==="open"){ ST.openSlug=t.dataset.slug; ST.openDoc=0; ST.view=(get(t.dataset.slug).estado==="lanzada"||get(t.dataset.slug).estado==="arquitectura"||get(t.dataset.slug).estado==="en-construccion")&&ST.view==="portfolio"?"workspace":"detalle"; render(); }
 else if(a==="back"){ ST.view=(ST.lastList||"tablero"); render(); }
 else if(a==="doc"){ ST.openSlug=t.dataset.slug; ST.openDoc=+t.dataset.doc; render(); }
 else if(a==="docpage"){ ST.docPage=+t.dataset.page; render(); }
 else if(a==="mode"){ ST.mode=t.dataset.mode; render(); }
 else if(a==="mcview"){ ST.mcView=t.dataset.v; render(); }
 else if(a==="mcpause"){ MC.running=!MC.running; document.getElementById("pauseic").className="ti "+(MC.running?"ti-player-pause":"ti-player-play"); document.getElementById("pausetx").textContent=MC.running?"Pausar":"Reanudar"; var fl=document.getElementById("feedlive"); if(fl){fl.className="live "+(MC.running?"on":"off");fl.innerHTML='<span class="dot"></span>'+(MC.running?"En vivo":"Detenido");} }
 else if(a==="theme"){ setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"); if(ST.view==="mc"&&ST.mcView==="rpg")buildScene(); }
 else if(a==="hc"){ var on=document.documentElement.getAttribute("data-hc")==="on"; document.documentElement.setAttribute("data-hc",on?"off":"on"); t.classList.toggle("on",!on); }
 else if(a==="copy"){ var cmd=t.dataset.cmd; navigator.clipboard&&navigator.clipboard.writeText(cmd); var old=t.innerHTML; t.innerHTML='<i class="ti ti-check"></i> Copiado'; setTimeout(function(){t.innerHTML=old;},1200); }
 else if(a==="toast"){ toast(); }
 else if(a==="phase"){ celebrate("phase"); }
 else if(a==="release"){ celebrate("release"); }
 else if(a==="levelup"){ levelup(); }
 else if(a==="closecel"){ clearOverlay(); }
 else if(a==="rm"){ var rm=document.body.classList.toggle("rm"); document.getElementById("rmbtn").classList.toggle("on",rm); if(ST.view==="mc"&&ST.mcView==="rpg")buildScene(); var fl=document.getElementById("feedlive"); }
});
document.addEventListener("keydown",function(e){
 if(e.key==="Enter"||e.key===" "){ var t=document.activeElement; if(t&&t.dataset&&(t.dataset.act==="open"||t.dataset.act==="doc"||t.dataset.act==="mode"||t.dataset.act==="docpage")){ e.preventDefault(); t.click(); } }
});
// keep "lastList" so Volver works from tablero/portfolio
(function(){var _r=render;render=function(){ if(ST.view==="tablero"||ST.view==="portfolio")ST.lastList=ST.view; _r(); };})();
// init theme
(function(){var t="dark";try{t=localStorage.getItem("pc-d3-theme")||(window.matchMedia("(prefers-color-scheme:light)").matches?"light":"dark");}catch(e){}setTheme(t);})();
// refresh feed timestamps
setInterval(function(){ if(ST.view==="mc"&&ST.mcView==="rpg")renderFeed(); },5000);
render();
</script>
</body>
</html>
