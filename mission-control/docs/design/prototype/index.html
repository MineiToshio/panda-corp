.digest { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.dhero { display: grid; gap: 10px; padding: var(--s4) 0 var(--s6); }
.dhero .eyebrow { font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; color: var(--teal); }
.dhero h2 { font-size: var(--fs-h1); letter-spacing: -.02em; }
.dhero-lead, .dhero-lead p { font-size: var(--fs-lg); color: var(--text-2); max-width: 72ch; line-height: 1.55; margin: 0; }
.dhero-stack { color: var(--text) !important; font-weight: 600; }
.dhero .chip { font-weight: 600; }
.band { margin-inline: calc(-1 * var(--gutter)); padding: var(--s6) var(--gutter); background: color-mix(in srgb, var(--tone) 6%, var(--bg)); border-top: var(--hairline) solid var(--line); min-width: 0; }
.band-note { margin-bottom: var(--s3); }
.band-sub { margin: var(--s5) 0 var(--s3); font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.brow { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: var(--s6); padding: var(--s3) 0; border-top: var(--hairline) dashed var(--line-strong); }
.brow:first-of-type, .band-head + .brow { border-top: 0; }
.brow-label { font: 700 var(--fs-xs)/1.5 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--tone, var(--slate)) 65%, var(--text-2)); padding-top: 3px; }
.brow-body { min-width: 0; display: grid; gap: var(--s3); font-size: var(--fs-base); line-height: 1.65; color: var(--text); }
.brow-body .md { font-size: var(--fs-base); line-height: 1.65; }
.brow-body .md p:last-child { margin-bottom: 0; }
.pquote { margin: 0; padding: 12px 16px; border: var(--hairline) solid color-mix(in srgb, var(--teal) 35%, var(--line)); background: var(--surface); border-radius: var(--r); font-style: italic; color: var(--text); }
.pquote p { margin: 0; }
.feats { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--s3); }
.feat { display: grid; gap: 4px; align-content: start; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line); font-size: var(--fs-sm); line-height: 1.5; color: var(--text-2); }
/* Mini-card titles read like every other card title: text colour, one size. */
.feat b { color: var(--text); font-size: var(--fs-md); font-weight: 650; }
.mock { border: var(--hairline) solid var(--line-strong); border-radius: var(--r-lg); background: var(--surface-2); padding: 10px 12px 12px; display: grid; gap: 8px; }
.mock-bar { display: flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); }
.mock-bar span { width: 9px; height: 9px; border-radius: 50%; background: var(--line-strong); }
.mock-bar em { font-style: normal; margin-left: 6px; font-family: var(--font-mono); }
.mock-item { display: flex; gap: 10px; align-items: baseline; padding: 8px 12px; border-radius: var(--r-sm); background: var(--surface); border: var(--hairline) solid var(--line); font: var(--fs-sm)/1.4 var(--font-mono); color: var(--text); }
.mock-item > span { color: var(--tone); font-weight: 800; }
.pbox { padding: 12px 16px; border-radius: var(--r); background: color-mix(in srgb, var(--tone) var(--tint), var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--tone) 45%, transparent); }
.pbox .md > :last-child { margin-bottom: 0; }
.risks { display: grid; gap: var(--s2); }
.risk { display: grid; grid-template-columns: 1fr 1fr; border-radius: var(--r); overflow: hidden; }
.risk > div { padding: 10px 14px; font-size: var(--fs-sm); background: color-mix(in srgb, var(--tone) var(--tint-strong), var(--surface)); }
.risk > div p { margin: 0 0 4px; }
.risk > div b, .risk > div strong { color: var(--tone); }
.md.legal strong:first-child { color: var(--green); }
.board-panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--s3); }
.score { display: grid; grid-template-columns: 100px minmax(60px, 1fr) minmax(0, 1.3fr); gap: 10px; align-items: center; font-size: var(--fs-xs); }
.score .mono { color: var(--text-2); }
.score-bar { height: 8px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.score-bar i { display: block; height: 100%; border-radius: inherit; background: var(--tone); }
.effort { width: 100%; height: auto; }
.effort .sweet { fill: color-mix(in srgb, var(--green) 14%, transparent); }
.effort .sweet-t { fill: var(--green); font: 600 12px var(--font-body); }
.effort .axis { stroke: var(--line-strong); stroke-width: 1.5; }
.effort .dot { fill: var(--teal); }
.effort .dot-t { fill: var(--text); font: 600 13px var(--font-body); }
.effort .tick { fill: var(--text-3); font: 600 12px var(--font-mono); }
.effort .cap { fill: var(--teal); font: 600 12px var(--font-mono); text-anchor: middle; }
.evidence { margin-top: var(--s3); padding: 10px 14px; border: var(--hairline) solid var(--line); border-radius: var(--r); background: var(--surface); }
.sbul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; }
.sbul li::marker { color: var(--tone, var(--text-3)); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px 20px; font-size: var(--fs-sm); line-height: 1.5; }
.checks li { position: relative; padding-left: 20px; }
.checks li::before { content: "✓"; position: absolute; left: 0; color: var(--green); font-weight: 800; }
.muted-pill { display: inline-block; padding: 5px 10px; border-radius: var(--r-pill); background: var(--surface); border: var(--hairline) solid var(--line); font-size: var(--fs-sm); color: var(--text-2); }
.decs { list-style: none; margin: 0; padding: 0; display: grid; }
.decs li { position: relative; padding: 8px 0 8px 22px; border-top: var(--hairline) dashed color-mix(in srgb, var(--amber) 35%, transparent); font-size: var(--fs-sm); }
.decs li:first-child { border-top: 0; }
.decs li::before { content: "◆"; position: absolute; left: 2px; color: var(--amber); }
.frd-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--s3); }
.frdc { position: relative; display: grid; gap: 8px; align-content: start; padding: 14px; border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line); transition: border-color var(--dur), transform var(--dur), box-shadow var(--dur); }
.frdc-open { padding: 0; border: 0; background: none; color: var(--text); text-align: left; font: 700 var(--fs-md)/1.3 var(--font-display); cursor: pointer; }
.frdc-open::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.frdc-open:focus-visible { outline: none; }
.frdc:has(.frdc-open:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.frdc .frdc-go { color: var(--tone); }
@media (hover: hover) { .frdc:hover { border-color: color-mix(in srgb, var(--tone) 45%, var(--line)); transform: translateY(-1px); box-shadow: var(--shadow-sm); } }
.frdc b { font: 700 var(--fs-md)/1.3 var(--font-display); }
.adrs { list-style: none; margin: 0; padding: 0; display: grid; }
.adr-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 0; border: 0; border-top: var(--hairline) dashed var(--line-strong); background: transparent; color: inherit; text-align: left; min-height: 48px; }
.adrs li:first-child .adr-row { border-top: 0; }
.adr-row b { display: block; font-size: var(--fs-md); }
.adr-row .xs { display: -webkit-box; }
/* Board "Documentos": curated rail + reader */
.idocs { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: var(--s4); align-items: start; padding-top: var(--s4); }
.idocs-rail { position: sticky; top: 16px; display: grid; gap: 2px; padding: 12px; border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid var(--line); max-height: calc(100dvh - 32px); overflow-y: auto; }
.idocs-sec { display: flex; align-items: center; gap: 6px; margin: 12px 6px 4px; font: 700 var(--fs-xs)/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--tone, var(--text-3)); overflow-wrap: anywhere; }
.idocs-sec::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 2px; background: var(--tone); }
.idocs-sec:first-child { margin-top: 0; }
.idocs-item { display: flex; align-items: flex-start; gap: 8px; width: 100%; min-height: 34px; padding: 6px 8px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font-size: var(--fs-sm); text-align: left; }
.idocs-item .i { margin-top: 2px; color: var(--tone, var(--text-3)); }
.idocs-item[aria-current="page"] { background: color-mix(in srgb, var(--tone, var(--teal)) var(--tint-strong), var(--surface)); color: var(--text); font-weight: 600; }
@media (hover: hover) { .idocs-item:hover { background: var(--surface-2); color: var(--text); } }
.idocs-paper { padding: var(--s6) var(--s8); border-radius: var(--r-lg); min-width: 0; }
/* Campaña: journey map + phase sheet */
.camp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: var(--s4) 0 var(--s3); font-size: var(--fs-sm); color: var(--text-2); }
.camp-head b { font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); }
.camp-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3) var(--s6); flex-wrap: wrap; margin: var(--s4) 0 var(--s3); }
.camp-top .camp-head { margin: 0; }
.camp-prog { gap: var(--s3); }
.camp-progress { display: grid; grid-template-columns: repeat(6, 28px); gap: 4px; }
.cp-seg { height: 8px; border-radius: var(--r-pill); background: color-mix(in srgb, var(--tone) 18%, var(--surface-2)); }
.cp-seg.is-done { background: var(--tone); }
.cp-seg.is-current { background: linear-gradient(90deg, var(--tone) 50%, color-mix(in srgb, var(--tone) 30%, var(--surface-2)) 50%); box-shadow: 0 0 0 2px color-mix(in srgb, var(--tone) 35%, transparent); }
/* Map: a 5-column snake. Rooms fill the width; corridors between them carry the hand-off artifact. */
.map { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; padding: var(--s5); border-radius: var(--r-xl); background: var(--map-bg); border: var(--hairline) solid var(--line); background-image: radial-gradient(color-mix(in srgb, var(--map-edge) 70%, transparent) 1px, transparent 1px); background-size: 18px 18px; }
.room { position: relative; aspect-ratio: 6 / 5; width: 100%; padding: 0; border-radius: var(--r); overflow: hidden; border: 2px solid var(--map-edge); background: var(--map-room); cursor: pointer; transition: transform var(--dur), border-color var(--dur); }
@media (hover: hover) { .room:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--tone) 70%, var(--map-edge)); } }
.room img { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
.room.is-locked img { filter: grayscale(.85) brightness(.55); }
.room.is-done { border-color: color-mix(in srgb, var(--tone) 45%, var(--map-edge)); }
.room.is-sel { border-color: var(--tone); box-shadow: 0 0 0 3px color-mix(in srgb, var(--tone) 45%, transparent), 0 0 28px color-mix(in srgb, var(--tone) 40%, transparent); }
.room-name { position: absolute; left: 8px; top: 8px; max-width: calc(100% - 16px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; padding: 3px 8px; border-radius: var(--r-xs); background: var(--map-label-bg); color: var(--map-label-fg); font: 600 var(--fs-xs)/1.3 var(--font-mono); }
.room-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 2px; background: var(--tone); vertical-align: 1px; }
.room-state { position: absolute; right: 8px; bottom: 8px; background: var(--map-label-bg); border-color: transparent; color: var(--map-label-fg); }
.room-state .i { color: color-mix(in srgb, var(--tone) 55%, var(--map-label-fg)); }
.corridor { position: relative; display: grid; place-items: center; align-self: stretch; min-width: 40px; padding: 0 2px; }
.corridor::before { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; border-top: 3px dashed color-mix(in srgb, var(--map-label-fg) 28%, var(--map-edge)); }
.corridor.is-done::before { border-top-style: solid; border-color: color-mix(in srgb, var(--green) 70%, var(--map-edge)); }
.corridor[data-dir="d"] { grid-column: 5; justify-self: center; align-self: auto; min-height: 56px; padding: 8px 0; }
.corridor[data-dir="d"]::before { left: 50%; right: auto; top: -2px; bottom: -2px; border-top: 0; border-left: 3px dashed color-mix(in srgb, var(--map-label-fg) 28%, var(--map-edge)); }
.corridor[data-dir="d"].is-done::before { border-left-style: solid; border-color: color-mix(in srgb, var(--green) 70%, var(--map-edge)); }
.handoff { position: relative; max-width: 9.5em; padding: 4px 8px; border-radius: var(--r-xs); background: var(--map-handoff-bg); color: var(--map-handoff-fg); font: 600 var(--fs-xs)/1.25 var(--font-body); text-align: center; text-wrap: balance; }
/* Phase sheet: tinted head, then the same label | content rows as the other tabs. */
.phase-sheet { margin-top: var(--s4); padding: 0 var(--s6) var(--s5); border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid var(--line); overflow: hidden; }
.ps-head { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin: 0 calc(-1 * var(--s6)) var(--s3); padding: var(--s4) var(--s6); background: color-mix(in srgb, var(--tone) var(--tint), var(--surface)); border-bottom: var(--hairline) solid color-mix(in srgb, var(--tone) 30%, var(--line)); }
.ps-num { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r); background: var(--tone); color: var(--primary-fg); font: 800 var(--fs-xl)/1 var(--font-display); }
.ps-kicker { margin: 0; font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--tone); }
.ps-head h3 { margin: 2px 0 0; font-size: var(--fs-h2); }
.ps-nav { gap: var(--s1); }
.ps-step-gap { width: 40px; }
.ps-flow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--s3); align-items: stretch; }
.ps-io { display: grid; gap: 6px; align-content: start; padding: var(--s3) var(--s4); border-radius: var(--r); background: color-mix(in srgb, var(--tone) var(--tint), var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--tone) 30%, var(--line)); }
.ps-io p { margin: 0; font-size: var(--fs-md); line-height: 1.55; }
.ps-io-l { display: inline-flex; align-items: center; gap: 6px; font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--tone) 75%, var(--text-2)); }
.ps-arrow { display: grid; place-items: center; color: var(--text-3); }
.team { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s3); }
.tmember { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); align-items: start; padding: var(--s3); border-radius: var(--r); background: var(--surface-2); border: var(--hairline) solid var(--line); }
.tm-stage { display: grid; place-items: center; width: 64px; height: 64px; border-radius: var(--r); background: radial-gradient(circle at 50% 60%, color-mix(in srgb, var(--tone) 30%, transparent), transparent 70%), var(--map-bg); border: var(--hairline) solid color-mix(in srgb, var(--tone) 35%, var(--line)); }
.tm-stage img { image-rendering: pixelated; }
.tmember b { display: block; font: 700 var(--fs-sm)/1.3 var(--font-display); }
.tm-role { display: block; margin-bottom: 4px; color: color-mix(in srgb, var(--tone) 70%, var(--text-2)); }
.tmember p { margin: 0; }
.ps-next { display: grid; gap: var(--s2); padding: var(--s4); border-radius: var(--r); background: color-mix(in srgb, var(--tone) var(--tint), var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--tone) 40%, var(--line)); }
.ps-next-l { display: inline-flex; align-items: center; gap: 6px; margin: 0; font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--tone) 80%, var(--text-2)); }
.ps-next > b { font: 700 var(--fs-base)/1.35 var(--font-display); }
.ps-sub { margin: var(--s2) 0 0; font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.ps-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--s3) var(--s4); }
.ps-mode { display: grid; gap: 6px; }
@media (max-width: 899px) {
  .idocs { grid-template-columns: minmax(0, 1fr); }
  .idocs-rail { position: static; max-height: 260px; }
  .map { padding: var(--s3); }
  .handoff { display: none; }
  .corridor { min-width: 18px; }
  .corridor[data-dir="d"] { min-height: 18px; padding: 0; }
  .ps-flow { grid-template-columns: minmax(0, 1fr); }
  .ps-arrow { transform: rotate(90deg); }
}
@media (max-width: 759px) {
  .brow { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .risk { grid-template-columns: minmax(0, 1fr); }
  .score { grid-template-columns: 80px minmax(0, 1fr); }
  .score .xs { grid-column: 1 / -1; }
  .dhero h2 { font-size: var(--fs-h1s); }
  .idocs-paper { padding: var(--s4); }
  .map { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .room { order: var(--n); }
  .corridor { display: none; }
  .phase-sheet { padding: 0 var(--s4) var(--s4); }
  .ps-head { margin: 0 calc(-1 * var(--s4)) var(--s3); padding: var(--s3) var(--s4); }
  .ps-num { width: 36px; height: 36px; font-size: var(--fs-lg); }
  .camp-progress { grid-template-columns: repeat(6, 20px); }
}
.band .faint { color: var(--text-2); }
@media (max-width: 759px) { .bottomnav { background: var(--bg-2); backdrop-filter: none; } }
.band-sub { color: var(--text-2); }

/* Campaign cast: idle bob in finished rooms, roaming in the active one, static and dimmed when locked. */
.cast { position: absolute; inset: 0; pointer-events: none; }
.cm { position: absolute; display: grid; justify-items: center; gap: 2px; transform: translate(-50%, -60%); }
.cm img { width: 44px; height: 44px; image-rendering: pixelated; filter: drop-shadow(var(--shadow-drop)); }
.cm i { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--violet); color: var(--primary-fg); font: 700 var(--fs-xs)/1 var(--font-display); font-style: normal; }
.cm em { font: 600 var(--fs-xs)/1.2 var(--font-mono); font-style: normal; color: var(--map-label-fg); background: var(--map-label-bg); padding: 1px 6px; border-radius: var(--r-xs); white-space: nowrap; }
.cm-done img { animation: camp-idle 2.4s ease-in-out infinite; }
.cm-current img { animation: camp-idle 2.4s ease-in-out infinite; }
.cm-current.walking img { animation: camp-walk .45s ease-in-out infinite; }
.cm-locked { opacity: .55; filter: grayscale(.8); }
.cm-locked em { display: none; }
.room.is-current { animation: roompulse 2.2s ease-in-out infinite; }
@keyframes camp-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes camp-walk { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes roompulse { 0%, 100% { box-shadow: 0 0 0 2px var(--tone), 0 0 30px -10px var(--tone); } 50% { box-shadow: 0 0 0 2px var(--tone), 0 0 48px -6px var(--tone); } }
@media (max-width: 759px) { .cm img { width: 30px; height: 30px; } .cm em { display: none; } }
.ps-head > .chip { background: var(--surface); }

/* ---------- Propuestas: summary, lesson flow, backlog by area ---------- */
.pa-card > header { margin-bottom: var(--s4); gap: var(--s3); }
.pa-card h2 { gap: 8px; }
.pa-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s3); }
.pa-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s4); align-items: start; padding: var(--s4); border-radius: var(--r-lg); background: color-mix(in srgb, var(--tone) 6%, var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--tone) 25%, var(--line)); }
.pa-n { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: color-mix(in srgb, var(--tone) var(--tint-strong), var(--surface)); color: var(--tone); font: 800 var(--fs-md)/1 var(--font-display); }
.pa-main { display: grid; gap: 6px; min-width: 0; }
.pa-kind { display: inline-flex; align-items: center; gap: 6px; font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--tone) 80%, var(--text-2)); }
.pa-main strong { font: 700 var(--fs-lg)/1.3 var(--font-display); }
.pa-main p { margin: 0; max-width: 72ch; }
.pa-cmd { display: grid; gap: 4px; margin-top: 4px; max-width: 560px; }
.pa-auto { display: flex; gap: 10px; align-items: flex-start; margin-top: var(--s3); padding: var(--s3) var(--s4); border-radius: var(--r); background: var(--surface-2); color: var(--teal); }
.pa-auto p { margin: 0; color: var(--text); }
.pa-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); margin: var(--s3) 0; }
.pa-facts div { display: grid; gap: 2px; align-content: start; }
.pa-facts dt { font-size: var(--fs-xs); color: var(--text-2); }
.pa-facts dd { margin: 0; font: 750 var(--fs-h2)/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.pa-facts dd.xs { font: 400 var(--fs-xs)/1.3 var(--font-body); }
.sig-group { border-top: var(--hairline) solid var(--line); padding: var(--s3) 0 0; margin-top: var(--s3); }
.sig-group > summary { display: flex; align-items: center; gap: 8px; min-height: 36px; cursor: pointer; list-style: none; color: var(--tone); }
.sig-group > summary::-webkit-details-marker { display: none; }

.sig-group > p { margin: 4px 0 8px; }
.sig-list { margin: 0; padding-left: 1.1em; display: grid; gap: 6px; font-size: var(--fs-sm); color: var(--text-2); }

.sig-list code { font-size: var(--fs-xs); }
.lf { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: var(--s2); margin: var(--s4) 0 var(--s3); }
.lf-step { display: grid; gap: 4px; align-content: start; padding: var(--s3) var(--s4); border-radius: var(--r); background: color-mix(in srgb, var(--tone) var(--tint), var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--tone) 30%, var(--line)); }
.lf-ico { color: var(--tone); }
.lf-step b { font: 750 var(--fs-h1s)/1 var(--font-display); font-variant-numeric: tabular-nums; }

.lf-arrow > span:first-child { font-size: var(--fs-xl); line-height: 1; }
.lf-arrow.is-you { color: var(--green); font-weight: 650; }
.area-bars { display: grid; gap: 4px; }
.area-bar { display: grid; grid-template-columns: minmax(120px, 170px) minmax(0, 1fr) 32px; gap: var(--s3); align-items: center; min-height: 36px; padding: 4px 8px; border: var(--hairline) solid transparent; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font-size: var(--fs-sm); text-align: left; cursor: pointer; }
.area-bar b { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
.area-track { height: 8px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
.area-track > span { display: block; height: 100%; border-radius: inherit; background: var(--blue); }
.area-bar[aria-pressed="true"] { background: color-mix(in srgb, var(--blue) var(--tint), var(--surface)); border-color: color-mix(in srgb, var(--blue) 40%, var(--line)); color: var(--text); }
@media (hover: hover) { .area-bar:hover { background: var(--surface-2); } }
@media (max-width: 1023px) {
  .lf { grid-template-columns: minmax(0, 1fr); }
  .lf-arrow { grid-auto-flow: column; justify-content: start; gap: 8px; min-width: 0; padding-left: var(--s4); }
  .lf-arrow > span:first-child { transform: rotate(90deg); }
}
@media (max-width: 759px) {
  .pa-row { grid-template-columns: minmax(0, 1fr); gap: var(--s3); padding: var(--s3); }
  .pa-n { display: none; }
  .pa-row > .btn { justify-self: start; }
  .pa-facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

}
.lf-step .faint { color: var(--text-2); }

/* ---------- Logros: missions, trophies, statistics, ranks (the app's organization, Órbita tokens) ---------- */
.saga { margin-top: var(--s6); }
/* The one section heading outside cards: display title in text colour, icon in the section hue, hairline, muted note at the right. */
.saga-head { display: flex; align-items: center; gap: 8px; margin: 0 0 var(--s3); font: 700 var(--fs-base)/1.3 var(--font-display); color: var(--text); }
.saga-head > .i { color: var(--tone, var(--gold)); }
.saga-head > .xs { font-family: var(--font-body); font-weight: 500; }
.saga-line { flex: 1; height: var(--hairline); background: var(--line); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--s3); }
.mcard { display: grid; gap: 10px; align-content: start; padding: var(--s4); border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid var(--line); }
.mcard.spot { padding: var(--s5); background: color-mix(in srgb, var(--blue) 5%, var(--surface)); border-color: color-mix(in srgb, var(--blue) 40%, var(--line)); }
.mhead { display: flex; align-items: flex-start; gap: var(--s3); }
.mslot { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: var(--r); background: color-mix(in srgb, var(--gold) var(--tint), var(--surface-2)); border: var(--hairline) solid color-mix(in srgb, var(--gold) 30%, var(--line)); color: var(--gold); }
.mcard.spot .mslot { width: 56px; height: 56px; color: var(--blue); background: color-mix(in srgb, var(--blue) var(--tint), var(--surface-2)); border-color: color-mix(in srgb, var(--blue) 35%, var(--line)); }
.mcard.spot .mslot .i { width: 24px; height: 24px; }
.mtitle { font: 700 var(--fs-md)/1.3 var(--font-display); }
.mcard.spot .mtitle { font-size: var(--fs-h3); }
.mpct { font: 800 var(--fs-h1)/1 var(--font-display); color: var(--gold); font-variant-numeric: tabular-nums; }
.mpct small { font-size: var(--fs-md); }
.nodes { display: flex; align-items: center; }
.node-dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--surface-3); border: 2px solid var(--line-strong); }
.node-dot.on { background: var(--gold); border-color: var(--gold); }
.node-dot.cur { box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 30%, transparent); }
.node-line { flex: 1; height: 2px; background: var(--line); }
.mbar { height: 8px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
.mbar > span { display: block; height: 100%; border-radius: inherit; background: var(--gold); }
.mcard.spot .mbar { height: 10px; }
.mcard.spot .mbar > span { background: var(--gold); }
.mfoot { margin: 0; padding-top: 8px; border-top: var(--hairline) solid var(--line); }
.tprog { display: grid; gap: 10px; padding: var(--s4) var(--s5); }
.seal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: var(--s2); }
.seal { display: flex; gap: 10px; align-items: flex-start; padding: var(--s3); border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line); }
.seal b { display: block; font-size: var(--fs-sm); }
.seal-ico { color: var(--text-3); margin-top: 2px; }
.seal.on { border-color: color-mix(in srgb, var(--gold) 45%, var(--line)); background: color-mix(in srgb, var(--gold) 6%, var(--surface)); }
.seal.on .seal-ico { color: var(--gold); }
.seal-bar { height: 4px; margin-top: 6px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
.seal-bar > span { display: block; height: 100%; background: var(--gold); }
.tgrid { display: grid; gap: var(--s3); }
.tgrid.won { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tgrid.todo { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--s2); }
.tcard { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3); border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line); color: inherit; text-align: left; }
.tcard .grow { display: grid; gap: 3px; min-width: 0; }
.tcard b { font-size: var(--fs-sm); line-height: 1.3; }
.tcard.won { padding: var(--s4); border-color: color-mix(in srgb, var(--gold) 35%, var(--line)); }
.tcard.won b { font: 700 var(--fs-md)/1.3 var(--font-display); }
.tslot { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-3); }
.tcard.won .tslot { width: 42px; height: 42px; color: var(--gold); background: color-mix(in srgb, var(--gold) var(--tint-strong), var(--surface)); }
.tgrid.todo .tcard { background: var(--surface-2); }
.tgrid.todo .tcard b { color: var(--text-2); }
.trar { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); }
.trar .dot { background: var(--tone); }
.tcard .xs .i { vertical-align: -2px; margin-right: 4px; }
@media (hover: hover) { .tcard:hover, .secret:hover { border-color: var(--line-strong); } }
.secret-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s2); }
.secret { display: flex; gap: 10px; align-items: center; min-height: 44px; padding: var(--s2) var(--s3); border-radius: var(--r); background: var(--surface-2); border: var(--hairline) solid var(--line); color: var(--text-2); font-size: var(--fs-sm); font-style: italic; text-align: left; }
.secret > span:first-child { color: var(--violet); font-style: normal; font-weight: 800; }
.secret.on { color: var(--text); font-style: normal; border-color: color-mix(in srgb, var(--violet) 40%, var(--line)); }
.insight { display: flex; gap: 6px; align-items: flex-start; margin: var(--s3) 0 0; font-size: var(--fs-sm); color: var(--text-2); }
.insight .i { margin-top: 2px; color: var(--text-3); }
.verdict { margin: 6px 0 var(--s4); font-size: var(--fs-h3); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); }
.kpi { display: grid; gap: 4px; padding: var(--s3) var(--s4); border-radius: var(--r); background: color-mix(in srgb, var(--tone, var(--slate)) 6%, var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--tone, var(--line)) 25%, var(--line)); }
.kpi-l { font: 700 var(--fs-xs)/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.kpi b { font: 800 var(--fs-h1s)/1.1 var(--font-display); color: var(--tone, var(--text)); font-variant-numeric: tabular-nums; }
.kpi b small { margin-left: 4px; font: 400 var(--fs-xs)/1 var(--font-body); color: var(--text-3); }
.stats-top { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: var(--s3); align-items: stretch; }
.radar-card { display: grid; align-content: start; }
.radar { width: 100%; max-width: 300px; justify-self: center; overflow: visible; }
.r-ring { fill: none; stroke: var(--line); stroke-width: 1; }
.r-axis { stroke: var(--line); stroke-width: 1; }
.r-data { fill: color-mix(in srgb, var(--teal) 30%, transparent); stroke: var(--teal); stroke-width: 2; }
.r-dot { fill: var(--teal); }
.r-label { fill: var(--text-2); font: 600 12px var(--font-body); }
.hstats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.hstat { display: grid; gap: 4px; align-content: start; padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid var(--line); }
.hstat-l { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-2); }
.hstat-l .i { color: var(--gold); }
.hstat b { font: 800 var(--fs-h1)/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.nv { padding: 2px 6px; border-radius: var(--r-xs); font: 700 var(--fs-xs)/1.2 var(--font-body); color: var(--tone); background: color-mix(in srgb, var(--tone) var(--tint-strong), transparent); }
.ledgers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.ledger .eyebrow { color: var(--tone); }
.ledger ul { list-style: none; margin: var(--s2) 0 0; padding: 0; display: grid; }
.ledger li { display: flex; align-items: center; gap: 8px; min-height: 36px; border-top: var(--hairline) solid var(--line); font-size: var(--fs-sm); color: var(--text-2); }
.ledger li:first-child { border-top: 0; }
.ledger li b { min-width: 34px; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
.lg-ico { color: var(--tone); display: inline-grid; }
.lg-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-3); }
.lg-dot.on { background: var(--green); }
.cols { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); align-items: end; gap: var(--s3); height: 160px; padding-top: var(--s3); }
.cols .col { display: grid; grid-template-rows: auto 1fr auto; height: 100%; justify-items: center; gap: 4px; }
.col-v { font-size: var(--fs-xs); font-weight: 700; color: var(--text-2); align-self: end; }
.col-bar { width: 70%; max-width: 44px; align-self: end; border-radius: var(--r-xs) var(--r-xs) 0 0; background: var(--tone); }
.col-k { font-size: var(--fs-xs); color: var(--text-2); }
.linechart { padding-top: var(--s2); }
.linechart svg { display: block; width: 100%; height: 140px; overflow: visible; }
.l-area { fill: color-mix(in srgb, var(--tone) 14%, transparent); stroke: none; }
.l-line { fill: none; stroke: var(--tone); stroke-width: 2.5; vector-effect: non-scaling-stroke; }
.l-dot { fill: var(--surface); stroke: var(--tone); stroke-width: 2; vector-effect: non-scaling-stroke; }
.l-val { fill: var(--text-2); font: 700 12px var(--font-body); }
.l-keys { display: flex; justify-content: space-between; padding: 4px 6px 0; font-size: var(--fs-xs); color: var(--text-2); }
.funnel-x { display: grid; gap: 8px; margin-top: var(--s3); }
.fn-row { display: flex; align-items: center; gap: 10px; }
.fn-bar { height: 22px; border-radius: var(--r-xs); background: var(--tone); }
.trans, .kvlist, .hbars { list-style: none; margin: var(--s2) 0 0; padding: 0; display: grid; }
.trans li { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; min-height: 36px; border-top: var(--hairline) solid var(--line); font-size: var(--fs-sm); }
.trans li:first-child, .kvlist li:first-child, .hbars li:first-child { border-top: 0; }
.tr-p { color: var(--blue); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-f { color: var(--text-2); white-space: nowrap; }
.kvlist li, .hbars li { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; border-top: var(--hairline) solid var(--line); font-size: var(--fs-sm); }
.era-tag { margin: -8px 0 var(--s3); }
.ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.rank { display: flex; align-items: center; gap: var(--s4); padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid var(--line); }
.rank .grow { display: grid; gap: 2px; min-width: 0; }
.rank b { font: 700 var(--fs-md)/1.3 var(--font-display); }
.rank-emblem { position: relative; flex: none; display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; background: var(--map-bg); }
.rank-emblem img { width: 56px; height: 56px; image-rendering: pixelated; }
.rank-grade { position: absolute; right: -4px; bottom: -2px; min-width: 22px; padding: 1px 4px; border-radius: var(--r-xs); background: var(--map-label-bg); color: var(--map-label-fg); font: 800 var(--fs-xs)/1.3 var(--font-mono); text-align: center; }
.rank-state { display: grid; justify-items: end; gap: 4px; flex: none; text-align: right; }
.rank.current { padding: var(--s4); border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); background: color-mix(in srgb, var(--gold) 7%, var(--surface)); }
.rank.locked { background: var(--surface-2); }
.rank.locked .rank-emblem img { filter: grayscale(1) brightness(.75); opacity: .7; }
.rank.locked b { color: var(--text-2); }
.rank-prog { display: grid; gap: 4px; margin-top: 6px; max-width: 520px; }
@media (max-width: 1023px) {
  .trans li { grid-template-columns: 64px minmax(0, 1fr); }
  .trans li .tr-f, .trans li .chip { grid-column: 2; justify-self: start; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats-top { grid-template-columns: minmax(0, 1fr); }
  .ledgers { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 759px) {
  .hstats { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .trans li { grid-template-columns: 56px minmax(0, 1fr); }
  .trans li .tr-f { grid-column: 2; }
  .trans li .chip { grid-column: 2; justify-self: start; }
  .rank { gap: var(--s3); padding: var(--s3); flex-wrap: wrap; }
  .rank-emblem { width: 52px; height: 52px; }
  .rank-emblem img { width: 44px; height: 44px; }
  .rank-state { justify-items: start; text-align: left; width: 100%; padding-left: 64px; grid-auto-flow: column; justify-content: start; gap: 10px; }
  .cols { gap: var(--s2); }
}
.nr { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: var(--s3); margin-bottom: var(--s3); }
.nr-step { display: grid; justify-items: center; gap: 4px; text-align: center; }
.nr-step b { font: 700 var(--fs-sm)/1.3 var(--font-display); }
.nr-step.next .rank-emblem img { filter: grayscale(.6) brightness(.85); }
.nr-arrow { color: var(--gold); }
.sum-radar { display: grid; grid-template-columns: minmax(180px, 230px) minmax(0, 1fr); gap: var(--s4); align-items: center; }
.sum-radar .radar { max-width: 230px; }
.sum-radar > div { display: grid; gap: var(--s2); }
@media (max-width: 1179px) { .sum-radar { grid-template-columns: minmax(0, 1fr); } .sum-radar .radar { justify-self: center; } }
.era.far > summary { cursor: pointer; list-style: none; }
.era.far > summary::-webkit-details-marker { display: none; }
.era.far[open] > summary .i:last-child { transform: rotate(180deg); }
.era.far:not([open]) { margin-top: var(--s3); }
.mcard.idle { background: var(--surface-2); }
.mcard.idle .mslot { color: var(--text-3); background: var(--surface); border-color: var(--line); }
.mcard.idle .mtitle { color: var(--text-2); }
.tgrid.near { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.tcard.near { border-color: color-mix(in srgb, var(--gold) 40%, var(--line)); background: color-mix(in srgb, var(--gold) 5%, var(--surface)); }
.tcard.near .tslot { color: var(--gold); background: color-mix(in srgb, var(--gold) var(--tint), var(--surface)); }
.hstat.nodata b, .ledger li.nodata .grow { color: var(--text-3); }
.ledger li.nodata .lg-ico { color: var(--text-3); }
.last-ach { display: flex; align-items: center; gap: 10px; margin-top: var(--s3); padding: 10px 12px; border-radius: var(--r); background: var(--surface-2); border: var(--hairline) solid var(--line); color: inherit; text-decoration: none; }
.last-ach .grow { display: grid; gap: 1px; min-width: 0; }
.last-ach b { font-size: var(--fs-sm); }
.la-ico { display: grid; place-items: center; flex: none; width: 32px; height: 32px; border-radius: var(--r-sm); color: var(--gold); background: color-mix(in srgb, var(--gold) var(--tint-strong), var(--surface)); }
.last-ach.fresh { border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); background: color-mix(in srgb, var(--gold) 8%, var(--surface)); }
@media (hover: hover) { .last-ach:hover { border-color: var(--line-strong); } }
.ach-toast { position: fixed; right: var(--s5); bottom: var(--s5); z-index: 95; display: flex; align-items: center; gap: var(--s3); width: min(420px, calc(100vw - 32px)); padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid color-mix(in srgb, var(--gold) 55%, var(--line)); box-shadow: var(--shadow-toast); animation: achin 320ms var(--ease); }
.ach-toast .grow { display: grid; gap: 2px; min-width: 0; }
.ach-toast .xs { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
.ach-toast .la-ico { width: 44px; height: 44px; }
@keyframes achin { from { opacity: 0; transform: translateY(12px) scale(.97); } }
@media (max-width: 759px) { .ach-toast { right: var(--s4); bottom: calc(var(--s4) + 64px); } }

/* ---------- Project Resumen (managerial) and Cuentas ---------- */

.notice.upgrade .grow { min-width: 260px; }
.notice.upgrade .pa-cmd { min-width: 260px; }
.notice.upgrade .pa-cmd .xs { color: var(--text-2); }

.env-chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 120px; }

/* ---------- La Fragua (Party): the project's state as a scene, real counts only ---------- */
.fragua { display: grid; gap: var(--s4); padding: var(--s5) var(--s6); border-radius: var(--r-xl); border: var(--hairline) solid var(--line); color: var(--map-label-fg);
  background: linear-gradient(180deg, color-mix(in srgb, var(--map-bg) 55%, transparent), color-mix(in srgb, var(--map-bg) 88%, transparent)), url(assets/zones/build-hall.png) center 40% / cover, var(--map-bg); image-rendering: pixelated; }

.fr-count { font: 800 var(--fs-h1)/1 var(--font-display); color: color-mix(in srgb, var(--tone) 55%, var(--map-label-fg)); font-variant-numeric: tabular-nums; }
.fr-plate .xs { color: color-mix(in srgb, var(--map-label-fg) 75%, transparent); }
.tokens { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; margin-top: 4px; }
.token { display: grid; place-content: center; width: 44px; height: 40px; padding: 0; border: 0; border-radius: 6px; background: var(--tone); color: var(--map-bg); font: 700 12px/1.05 var(--font-mono); cursor: pointer; }

.tokens { min-height: 84px; align-content: flex-start; }
.tokens.is-empty { position: relative; align-content: center; }
.tk-ghost { width: 44px; height: 40px; border-radius: 6px; border: 2px dashed color-mix(in srgb, var(--map-label-fg) 28%, transparent); }
.fr-empty-msg { flex-basis: 100%; display: inline-flex; justify-content: center; align-items: center; gap: 6px; margin: 4px 0 0; font-size: var(--fs-xs); color: color-mix(in srgb, var(--map-label-fg) 80%, transparent); }

.fr-station { grid-template-rows: auto 1fr; }
.fr-plate { align-content: start; }

.tok-tip { position: fixed; z-index: 70; display: grid; gap: 4px; width: min(320px, calc(100vw - 16px)); padding: 10px 12px; border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line-strong); box-shadow: var(--shadow-dialog); pointer-events: none; }

.token-more { display: grid; place-content: center; min-width: 44px; height: 40px; border-radius: 6px; font: 700 var(--fs-xs)/1 var(--font-mono); color: var(--map-label-fg); background: var(--map-label-bg); border: var(--hairline) solid color-mix(in srgb, var(--map-label-fg) 25%, transparent); }

@keyframes fr-work { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(-3deg); } }
@keyframes fr-carry { 0% { left: var(--from); transform: scaleX(1); } 48% { left: var(--to); transform: scaleX(1); } 50% { left: var(--to); transform: scaleX(-1); } 98% { left: var(--from); transform: scaleX(-1); } 100% { left: var(--from); transform: scaleX(1); } }

}
@media (max-width: 759px) { .fragua { padding: var(--s4); } .fr-cast { height: 72px; } .fr-cast img { width: 52px; height: 52px; } }

/* ---------- Collapsible sidebar (desktop), as in PandaTrack: icons only; hover floats it open over the page ---------- */
.side-toggle { display: none; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border: var(--hairline) solid var(--line); border-radius: var(--r-md); background: transparent; color: var(--text-2); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }

  .app[data-sidebar="collapsed"] .sidebar:not([data-float="true"]):not(:has(:focus-visible)) :is(.brand > div, .navlabel span, .navitem .lbl, .navitem .count, .projnav .navitem .meta, .guildcard .gtext, .guildcard .bar, .plugin-pill .lbl, .side-toggle .lbl) { display: none; }
  .app[data-sidebar="collapsed"] .sidebar:not([data-float="true"]):not(:has(:focus-visible)) :is(.brand, .navitem, .plugin-pill, .side-toggle) { justify-content: center; padding-left: 0; padding-right: 0; }
  .app[data-sidebar="collapsed"] .sidebar:not([data-float="true"]):not(:has(:focus-visible)) .navlabel { justify-content: center; padding: var(--s2) 0 var(--s1); }
  .app[data-sidebar="collapsed"] .sidebar:not([data-float="true"]):not(:has(:focus-visible)) .navlabel::after { content: ""; width: 24px; height: var(--hairline); background: var(--line-strong); }
  .app[data-sidebar="collapsed"] .sidebar:not([data-float="true"]):not(:has(:focus-visible)) .guildcard { padding: var(--s2); display: grid; place-items: center; }
  .app[data-sidebar="collapsed"] .sidebar:not([data-float="true"]):not(:has(:focus-visible)) .navitem .raildot { display: block; position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 2px var(--bg-2); }
  .app[data-sidebar="collapsed"] .sidebar :is(.lbl, .meta, .gtext, .count) { white-space: nowrap; }
}

/* ---------- Dependency graph (Observabilidad → Dependencias) ---------- */
.dag-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); align-items: start; }

.dag-edge.dim { opacity: .25; }
.dag-node { position: absolute; display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 6px; width: 176px; height: 46px; padding: 4px 10px; border-radius: var(--r); background: var(--surface); border: var(--hairline) solid color-mix(in srgb, var(--tone) 45%, var(--line)); color: var(--text); text-align: left; cursor: pointer; }

.dag-t { font-size: var(--fs-xs); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dag-node.focus { background: color-mix(in srgb, var(--teal) var(--tint-strong), var(--surface)); border-color: var(--teal); box-shadow: 0 0 0 3px color-mix(in srgb, var(--teal) 30%, transparent); z-index: 1; }
.dag-node.dim { background: var(--bg-2); border-color: var(--line); }
.dag-node.dim > * { opacity: .4; }
.dag-node.out { border-style: dashed; }
@media (hover: hover) { .dag-node:hover { border-color: var(--tone); z-index: 2; } }
.dag-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--s5); align-items: start; }
.dag-focus { display: grid; gap: var(--s2); justify-items: start; }
.dag-side .eyebrow { margin-bottom: var(--s2); }
@media (max-width: 1023px) { .dag-side { grid-template-columns: minmax(0, 1fr); } }
.fr-side { display: grid; justify-items: end; gap: var(--s2); }
.fr-head h2 { font-size: var(--fs-lg); line-height: 1.45; max-width: 70ch; }
.fr-modes { background: var(--map-label-bg); border-color: color-mix(in srgb, var(--map-label-fg) 20%, transparent); }
.fr-modes button { color: color-mix(in srgb, var(--map-label-fg) 80%, transparent); }
.fr-modes button[aria-pressed="true"] { color: var(--map-label-fg); background: color-mix(in srgb, var(--map-label-fg) 18%, transparent); }
.fr-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.fr-foot .chip.plain { background: var(--map-label-bg); color: var(--map-label-fg); }
.token.sim { cursor: default; width: 44px; height: 40px; }
.token.arrive { animation: tok-in .5s var(--ease); }
.token-ghost { position: fixed; z-index: 60; width: 44px; height: 40px; border-radius: 6px; background: var(--tone); box-shadow: 0 0 12px var(--tone); pointer-events: none; transition: transform .85s cubic-bezier(.45, 0, .25, 1); }
@keyframes tok-in { from { transform: scale(.2); opacity: 0; } }
.fragua.is-sim .fr-cast img { animation: fr-work .5s ease-in-out infinite; }
@media (max-width: 759px) { .fr-side { justify-items: start; } }
.fragua .fr-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; }
@media (max-width: 899px) { .fragua .fr-head { grid-template-columns: minmax(0, 1fr); } }

/* FRD-level map: FRD boxes with their work orders; aggregated cross-FRD links */
.fdag-box { position: absolute; border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid color-mix(in srgb, var(--violet) 35%, var(--line)); }
.fdag-head { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 10px; margin-top: 4px; border: 0; background: transparent; color: var(--text); text-align: left; cursor: pointer; }
.fdag-title { flex: 1; min-width: 0; font: 700 var(--fs-sm)/1.2 var(--font-display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) { .fdag-head:hover .fdag-title { text-decoration: underline; text-underline-offset: 3px; } }
.fdag-bar { padding: 0 10px; }
.fdag-bar .stackbar { height: 4px; }
.fdag-link { fill: none; stroke: color-mix(in srgb, var(--violet) 55%, var(--line-strong)); stroke-linecap: round; opacity: .85; }
.fdag-n { fill: var(--text-2); font: 700 12px var(--font-mono); paint-order: stroke; stroke: var(--bg-2); stroke-width: 4px; }
.dag-node.mini { z-index: 2; height: 40px; }

/* Click-to-copy text: on hover the text lights up, a sweep runs across it and a "Copiar" hint appears. */
.copy-text { position: relative; display: inline-block; max-width: 100%; padding: 4px 8px; margin-left: -8px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text); text-align: left; overflow-wrap: anywhere; cursor: copy; transition: color var(--dur) var(--ease), background-color var(--dur) var(--ease); }
.copy-text::after { content: attr(data-hint); position: absolute; left: 50%; bottom: calc(100% + 2px); padding: 2px 8px; border-radius: var(--r-xs); background: var(--primary-bg); color: var(--primary-fg); font: 600 var(--fs-xs)/1.4 var(--font-body); white-space: nowrap; opacity: 0; transform: translate(-50%, 4px); pointer-events: none; transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease); }
.copy-text:focus-visible { color: var(--teal); }
.copy-text:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
@media (hover: hover) {
  .copy-text:hover { color: var(--teal); background-image: linear-gradient(100deg, transparent 20%, color-mix(in srgb, var(--teal) 16%, transparent) 50%, transparent 80%); background-size: 220% 100%; animation: copy-sweep 1.1s var(--ease) 1; background-color: color-mix(in srgb, var(--teal) 8%, transparent); }
  .copy-text:hover::after { opacity: 1; transform: translate(-50%, 0); }
}
@keyframes copy-sweep { from { background-position: 120% 0; } to { background-position: -20% 0; } }

/* ---------- Configuración hub and catalogs ---------- */
.cfg-tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); }
.cfg-tile { display: grid; gap: 4px; align-content: start; padding: var(--s4); border-radius: var(--r-lg); background: color-mix(in srgb, var(--tone) 6%, var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--tone) 28%, var(--line)); color: inherit; text-decoration: none; }

.cfg-ico { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r); color: var(--tone); background: color-mix(in srgb, var(--tone) var(--tint-strong), var(--surface)); }
.cfg-l { margin-top: 6px; font: 700 var(--fs-xs)/1.3 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--tone) 70%, var(--text-2)); }
.cfg-tile b { font: 800 var(--fs-h1s)/1.1 var(--font-display); }
.cmd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s2) var(--s4); }
.cmd-cell { display: grid; gap: 2px; justify-items: start; padding: var(--s2) 0; border-top: var(--hairline) dashed var(--line); }
.cmd-cell .copy-text { color: var(--violet); font-weight: 600; }
.cmd-desc { padding: 0; border: 0; background: none; color: var(--text-2); font-size: var(--fs-sm); line-height: 1.45; text-align: left; cursor: pointer; }
@media (hover: hover) { .cmd-desc:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; } }
.cfg-row .grow { display: grid; gap: 2px; justify-items: start; min-width: 0; }
.cfg-name { font-weight: 600; color: var(--text); text-align: left; }
.cfg-row .copy-text.xs { color: var(--violet); }
.agent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s3); }
.agent-card { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid var(--line); color: inherit; text-align: left; }
.agent-card img { image-rendering: pixelated; flex: none; }
.agent-card .grow { display: grid; gap: 2px; min-width: 0; }
.agent-card b { font: 700 var(--fs-md)/1.3 var(--font-display); }
@media (hover: hover) { .agent-card:hover { border-color: color-mix(in srgb, var(--blue) 50%, var(--line)); } }
/* ---------- Documentación home and reader chrome ---------- */
.docs-steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.docs-steps a { display: flex; align-items: center; gap: var(--s3); padding: var(--s3); border-radius: var(--r); background: color-mix(in srgb, var(--pink) 5%, var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--pink) 25%, var(--line)); color: inherit; text-decoration: none; }
.docs-steps .grow { display: grid; gap: 2px; min-width: 0; }
.docs-n { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 50%; background: color-mix(in srgb, var(--pink) var(--tint-strong), var(--surface)); color: var(--pink); font: 800 var(--fs-md)/1 var(--font-display); }
.docs-groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--s3); }

.docs-group b { margin-top: 6px; font: 700 var(--fs-lg)/1.2 var(--font-display); color: var(--tone); }
.docs-count { margin-top: 6px; font: 700 var(--fs-xs)/1.2 var(--font-body); color: var(--text-3); }
.docs-crumbs { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 0; font-size: var(--fs-sm); color: var(--text-3); }

@media (hover: hover) { .docs-crumbs a:hover { text-decoration: underline; text-underline-offset: 3px; } }
.docs-progress { display: flex; gap: 4px; margin: -12px 0 var(--s5); }

@media (max-width: 1023px) { .cfg-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cmd-desc, .cfg-name { min-height: 24px; }

/* Docs home: the two route-in cards share one height */
.docs-pair { align-items: stretch; }
.docs-pair > .card { display: flex; flex-direction: column; }
.docs-pair > .card .card-foot { margin-top: auto; }
.docs-sub { margin: var(--s4) 0 var(--s2); font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.frd-tools { display: flex; justify-content: flex-end; margin-bottom: var(--s2); }

.fragua { --text: var(--scene-text); --text-2: var(--scene-text-2); --text-3: var(--scene-text-3); --surface: var(--scene-surface); --surface-2: var(--scene-surface-2); --line: var(--scene-line); --line-strong: var(--scene-line-strong);
  --blue: var(--scene-blue); --teal: var(--scene-teal); --violet: var(--scene-violet); --pink: var(--scene-pink); --amber: var(--scene-amber); --green: var(--scene-green); --coral: var(--scene-coral); --slate: var(--scene-slate); --gold: var(--scene-gold); --tint: 13%; --tint-strong: 22%; color-scheme: dark; }

.pg-row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 2px; border: 0; background: transparent; color: var(--text); text-align: left; font: inherit; }

.pg-main { display: grid; gap: 1px; flex: 1; min-width: 0; }

.pg-subj { font-size: var(--fs-sm); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Phone pass ---------- */
/* Modal sheets on phones: labels above their content, so the text keeps the full width */
@media (max-width: 759px) { dialog .dsheet .brow { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
/* Cuentas: below 1024 px each service becomes a card, so the five columns never squeeze the login */
@media (max-width: 1023px) {
  .acc-table thead { display: none; }
  .acc-table, .acc-table tbody, .acc-table tr, .acc-table td { display: block; width: 100%; }
  .acc-table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: var(--s3) var(--s4); border-top: var(--hairline) solid var(--line); }
  .acc-table tr:first-child { border-top: 0; }
  table.t.acc-table td { padding: 0; border: 0; min-width: 0 !important; }
  .acc-table td[data-label="Servicio"] { grid-column: 1; }

/**
 * Per-repo cleanup urgency (a design proposal, explained in the card's legend):
 * leftovers = open worktrees that carry nothing pending (already merged), which a cleanup removes;
 * "Depurar ya" when there are 3+ leftovers or pending branches, or any branch untouched for over 7 days;
 * "Revisar pronto" when any branch is older than a day or any leftover exists; "Al día" otherwise.
 */
function cleanupState(r) {
  const pend = r.items.length;
  const wt = r.worktrees || { total: 0, locked: 0 };
  const leftovers = Math.max(0, wt.total - wt.locked - r.items.filter(i => i.worktree).length);
  const oldest = Math.max(0, ...r.items.map(i => i.ageHours));
  let state = ['Limpio', 'green', 0];
  if (pend || leftovers) state = ['Al día', 'green', 1];
  if (oldest > 24 || leftovers > 0) state = ['Revisar pronto', 'amber', 2];
  if (leftovers >= 3 || pend >= 3 || oldest > 24 * 7) state = ['Depurar ya', 'coral', 3];
  return { pend, leftovers, oldest, label: state[0], tone: state[1], rank: state[2] };
}

/* ---------- Resumen: the project's state at a glance, for a manager ---------- */
/** Decision entries written by the build engine (timestamped log lines) rather than questions for the owner. */
const isEngineLog = d => /^(T?\d{1,2}:\d{2}|\d{4}-\d{2}-\d{2}T)/.test(d.title.replace(/^·\s*/, '').trim());
const daysAgo = iso => iso ? Math.max(0, Math.floor((Date.parse(SNAP.capturedAt) - Date.parse(iso)) / 864e5)) : null;
const agoText = n => n == null ? 'sin registro' : n === 0 ? 'hoy' : n === 1 ? 'ayer' : `hace ${n}\u00a0días`;
/**
 * Recent progress in plain words, from structured sources only: work orders verified (build timeline)
 * and changes filed (change queue), grouped by day, newest first. The raw engine log is not used.
 */
function recentProgress(p, limit = 6) {
  const items = [];
  const byDay = new Map();
  for (const w of (p.timeline?.frds || []).flatMap(f => f.workOrders).filter(w => w.state === 'done' && w.endMs)) {
    const day = new Date(w.endMs).toISOString().slice(0, 10);
    if (!byDay.has(day)) byDay.set(day, []);
    byDay.get(day).push(w);
  }
  for (const [day, list] of byDay) {
    const frds = [...new Set(list.map(w => p.frds.find(f => f.group === w.frd)?.code).filter(Boolean))];
    items.push({ date: day, tone: 'green', icon: 'check', verb: plural(list.length, 'work order verificada', 'work orders verificadas'), subject: frds.join(', ') });
  }
  const CH = { building: ['En construcción', 'blue', 'loader'], ready: ['Listo para construir', 'pink', 'branch'], draft: ['Pedido (borrador)', 'slate', 'file'], done: ['Terminado', 'green', 'check'], discarded: ['Descartado', 'slate', 'x'] };
  for (const c of p.changesList.filter(c => c.date)) { const [verb, tone, icon] = CH[c.status] || ['Registrado', 'slate', 'branch']; items.push({ date: c.date, tone, icon, verb, subject: plain(c.title), attr: `data-change="${esc(p.id)}|${esc(c.id)}"` }); }
  return items.sort((x, y) => Date.parse(y.date) - Date.parse(x.date)).slice(0, limit);
}
/** One progress line: a coloured icon and a small status label carry the meaning; the text stays neutral. */
const progressItem = e => { const body = `<span class="pg-ico" data-tone="${e.tone}">${ico(e.icon, 'sm')}</span><span class="pg-main"><span class="pg-verb" data-tone="${e.tone}">${esc(e.verb)}</span><span class="pg-subj">${esc(e.subject || '')}</span></span><span class="xs faint nowrap">${esc(fmtDate(e.date))}</span>`; return `<li>${e.attr ? `<button type="button" class="pg-row" ${e.attr}>${body}${ico('chevR', 'sm')}</button>` : `<div class="pg-row">${body}</div>`}</li>`; };
/** One honest verdict for the project: what state it is in, and why, in a sentence. */
function projectVerdict(p) {
  const n = s => p.orders.filter(w => w.state === s).length;
  const mine = attentionFor(p).filter(a => a.owner !== false).length;
  const days = daysAgo(HEALTH?.lastActivity?.[p.id]);
  const open = p.changesList.filter(c => !['done', 'discarded'].includes(c.status)).length;
  const ph = phaseOf(p.phase);
  let health;
  if (mine) health = ['Espera tu decisión', 'amber', 'flag'];
  else if (p.running) health = ['Construyendo ahora', 'violet', 'loader'];
  else if (days != null && days > 7) health = ['En pausa', 'slate', 'clock'];
  else if (p.counts.orders && p.counts.done === p.counts.orders && p.phase === 'implementation') health = ['Listo para lanzar', 'green', 'rocket'];
  else health = ['Avanzando', 'green', 'activity'];
  const parts = [];
  if (p.counts.orders) {
    parts.push(`${ph.label} al ${p.pct} %: ${p.counts.done} de ${p.counts.orders} work orders verificadas.`);
    const left = p.counts.orders - p.counts.done;
    if (left) parts.push(n('review') === left ? `Las ${left} restantes ya están construidas y esperan la revisión de su FRD.` : `Faltan ${left}: ${[n('review') && `${n('review')} en revisión`, n('in_progress') && `${n('in_progress')} en curso`, n('todo') && `${n('todo')} por empezar`, n('fail') && `${n('fail')} con fallos`].filter(Boolean).join(', ')}.`);
  } else parts.push(`Fase de ${ph.label.toLowerCase()}: el plan de construcción todavía no tiene work orders.`);
  if (open) parts.push(`${plural(open, 'cambio abierto', 'cambios abiertos')}.`);
  parts.push(mine ? `${plural(mine, 'cosa espera', 'cosas esperan')} tu decisión.` : 'Nada espera tu decisión.');
  return { health, text: parts.join(' '), days };
}
function summaryView(p) {
  const v = projectVerdict(p);
  const ov = p.overlay;
  const mine = attentionFor(p).filter(a => a.owner !== false);
  const decisions = p.decisions.filter(d => !isEngineLog(d));
  const hidden = p.decisions.length - decisions.length;
  const next = (p.commands || [])[0];
  const frds = [...p.frds].sort((a, b) => (a.orders.length && a.done === a.orders.length) - (b.orders.length && b.done === b.orders.length));
  const progress = recentProgress(p);
  return `<div class="stack lg">
    ${ov?.reason === 'behind' ? `<section class="notice upgrade" data-tone="amber" aria-label="Actualización pendiente">${ico('alert')}<div class="grow"><b>Este proyecto usa una versión vieja del motor de Pandacorp</b><p class="small">Va con la v${esc(ov.projectVersion)} y la fábrica ya está en la v${esc(ov.factoryVersion)}. Actualízalo para que el próximo build use las reglas y herramientas nuevas${p.running ? ' (espera a que termine el build en curso)' : ''}.</p></div><div class="pa-cmd" style="margin:0">${cmd(ov.upgradeCommand)}<span class="xs faint">Córrelo en la carpeta de ${esc(p.short)}</span></div></section>` : ''}
    ${next ? `<div class="pst-next row wrap" style="gap:8px;align-items:center;justify-content:flex-end"><span class="small"><b>Siguiente paso:</b> <span class="muted">${esc(next.when)}</span></span>${cmd(next.command)}</div>` : ''}
    ${fraguaScene(p, v)}
    <div class="grid-2 sum-cols">
      <div class="stack lg">${card(`Avance por FRD <span class="chip" data-tone="violet">${p.frds.length}</span>`, p.frds.length ? `<p class="small muted card-intro">Primero lo que falta terminar.</p><div class="stack sm">${frds.slice(0, 8).map(f => frdProgressLine(p, f)).join('')}</div>${p.frds.length > 8 ? `<div class="card-foot"><span class="small faint">${p.frds.length} FRDs en total</span><button type="button" class="link" data-tone="green" data-tab-jump="Observabilidad">Ver todos ${ico('arrow', 'sm')}</button></div>` : ''}` : empty('Aún no hay FRDs publicados.'), { icon: 'clipboard', tone: 'violet' })}
        ${card('Decisiones', `${decisions.length ? `<div class="divided">${decisions.map(d => `<button type="button" class="lrow" data-decision="${esc(p.id)}|${esc(d.id)}"><span class="badge-icon sm" data-tone="${d.resolved ? 'green' : 'amber'}">${ico(d.resolved ? 'check' : 'flag', 'sm')}</span><div class="grow"><strong>${inl(d.title.replace(/^·\s*/, ''))}</strong><small>${esc(fmtDate(d.date))} · ${d.resolved ? 'Resuelta' : 'Pendiente'}</small></div>${ico('chevR', 'sm')}</button>`).join('')}</div>` : `<p class="small muted">Sin decisiones tuyas registradas.</p>`}${hidden ? `<p class="xs faint" style="margin-top:8px">${plural(hidden, 'entrada automática del motor oculta', 'entradas automáticas del motor ocultas')} (no son preguntas para ti).</p>` : ''}`, { icon: 'flag', tone: 'amber' })}
      </div>
      <div class="stack lg sum-act">
        ${card(`Tu turno ${mine.length ? `<span class="chip" data-tone="amber">${mine.length}</span>` : ''}`, mine.length ? ownerTurn(mine, { showProject: false }) : `<p class="small muted row" style="gap:8px">${ico('check', 'sm')}Nada espera tu acción en este proyecto.</p>`, { icon: 'target', tone: 'amber' })}
        ${card('Últimos avances', progress.length ? `<ul class="progress-list">${progress.map(progressItem).join('')}</ul>` : `<p class="small muted">Sin avances registrados todavía.</p>`, { icon: 'activity', tone: 'teal' })}
      </div>
    </div>
    ${(p.activity?.entries || []).length ? `<details class="card"><summary class="row between" style="cursor:pointer;list-style:none"><h2 class="row"><span class="badge-icon sm" data-tone="slate">${ico('terminal', 'sm')}</span>Bitácora técnica del motor <span class="chip" data-tone="slate">${p.activity.entries.length}</span></h2><span class="row small muted"><span class="hide-sm">Notas en crudo del build</span>${ico('chevD', 'sm')}</span></summary><div class="feed" style="margin-top:12px">${p.activity.entries.map(text => feedEntry({ p, text: typeof text === 'string' ? text : (text.text || '') }, false)).join('')}</div></details>` : ''}
  </div>`;
}
function frdProgressLine(p, f) {
  return `<button type="button" class="lrow" style="min-height:48px" data-frd-jump="${esc(f.group)}"><div class="grow"><strong style="font-size:14px"><span class="mono faint" style="font-size:12px;margin-right:6px">${f.code}</span>${esc(f.title)}</strong><div style="margin-top:6px">${stackbar(f.orders)}</div></div><span class="small faint nowrap frd-count">${f.done}/${f.orders.length}</span></button>`;
}
function stackbar(orders) {
  const order = ['done', 'review', 'in_progress', 'fail', 'todo'];
  const total = orders.length || 1;
  return `<div class="stackbar" role="img" aria-label="${order.map(s => `${orders.filter(w => w.state === s).length} ${stateOf(s).label.toLowerCase()}`).join(', ')}">${order.map(s => { const n = orders.filter(w => w.state === s).length; return n ? `<span data-tone="${stateOf(s).tone}" style="flex:${n / total}"></span>` : ''; }).join('')}</div>`;
}

/* ---------- Spec ---------- */
function blockTone(label) {
  if (/problema/i.test(label)) return ['coral', 'alert'];
  if (/hipótesis|valor|diferenciador/i.test(label)) return ['green', 'sparkles'];
  if (/métrica|éxito/i.test(label)) return ['teal', 'gauge'];
  if (/decisi/i.test(label)) return ['amber', 'flag'];
  if (/fuera/i.test(label)) return ['slate', 'x'];
  if (/^alcance/i.test(label)) return ['blue', 'check'];
  if (/usuario/i.test(label)) return ['violet', 'users'];
  if (/hallazgo|referente|research|competen|mercado/i.test(label)) return ['teal', 'search'];
  return ['blue', 'book'];
}
function docBtn(p, d, label, ctx) {
  if (!d) return '';
  const t = DOC_TYPES[docType(d)];
  return `<button type="button" class="btn sm toned" data-tone="${t.tone}" data-open-doc="${esc(d.id)}" data-ctx="${ctx?.screen || 'portfolio'}">${ico(t.icon, 'sm')}${esc(label)}</button>`;
}


/* ================= Digests: Propuesta, Spec, Arquitectura =================
   Same structure and data as the current app (IdeaPitch, SpecDigest, ArchitectureDigest):
   a hero, full-width tinted bands and label | content rows, restyled in the Órbita system. */
const MODALS = [];
/** A button that opens a registered modal; `opts` carries the dialog's tone and kicker so the modal keeps its tab's colours. */
function modalBtn(label, title, html, cls = 'link small', opts = {}) {
  MODALS.push({ title, html, opts });
  return `<button type="button" class="${cls}" data-modal="${MODALS.length - 1}">${label}</button>`;
}
/** Full-width section of a report page; its header is the same as a card's (tinted icon, display title, optional action). */
const band = (tone, icon, title, body, id = '') => {
  const [raw, action = ''] = title.split('<span class="grow"></span>');
  const head = raw.replace(/ · (\d+)$/, ' <span class="chip">$1</span>');
  return `<section class="band" data-tone="${tone}" ${id ? `id="${id}"` : ''}><div class="card-head band-head"><h2><span class="badge-icon sm">${ico(icon, 'sm')}</span>${head}</h2>${action}</div>${body}</section>`;
};
const brow = (label, content, cls = '') => `<div class="brow ${cls}"><span class="brow-label">${label}</span><div class="brow-body">${content}</div></div>`;
const digestHero = (eyebrow, title, lead, chips) => `<header class="dhero"><span class="eyebrow">${eyebrow}</span>${title ? `<h2>${title}</h2>` : ''}${lead ? `<div class="dhero-lead">${lead}</div>` : ''}${chips ? `<div class="row wrap" style="gap:6px">${chips}</div>` : ''}</header>`;
const BADGE_TONE = { warn: 'amber', info: 'blue', pain: 'coral', neutral: '', build: 'green' };
const SCORE_TONE = { high: 'green', mid: 'amber', low: 'coral' };
const SCORE_WIDTH = { high: 92, mid: 55, low: 25 };

/* ---------- Propuesta ---------- */
function pitchView(i, p) {
  const pt = i.pitch;
  const typeChips = `${chip(`${ico('cube', 'sm')}${esc(i.category || 'Sin tipo')}`, '', 'plain')}${p?.targetPlatforms ? chip(`${ico('columns', 'sm')}${esc(p.targetPlatforms[0].toUpperCase() + p.targetPlatforms.slice(1))}`, '', 'plain') : ''}`;
  if (!pt) return `<div class="stack lg">${digestHero('Memo-pitch de idea', esc(i.title), '', typeChips)}<article class="paper" data-tone="blue"><div class="md" data-tone="blue">${i.html || '<p>Sin contenido.</p>'}</div></article></div>`;
  const badges = pt.badges.filter(b => b.tone !== 'build').map(b => chip(esc(b.label), BADGE_TONE[b.tone] || '', BADGE_TONE[b.tone] ? '' : 'plain')).join('');
  const glanceRow = g => {
    if (g.kind === 'problema') return brow(esc(g.label), `<div class="md compact">${g.proseHtml}</div>${g.quoteHtml ? `<blockquote class="pquote">${g.quoteHtml}</blockquote>` : ''}`);
    if (g.kind === 'vision' && g.features?.length >= 2) return brow(esc(g.label), `<div class="feats">${g.features.map(f => `<div class="feat"><b>${inl(f.title)}</b><span>${inl(f.desc)}</span></div>`).join('')}</div>${g.checks?.length ? `<div class="mock"><div class="mock-bar"><span></span><span></span><span></span>${g.previewUrl ? `<em>${esc(g.previewUrl)}</em>` : ''}</div>${g.checks.map(c => `<div class="mock-item" data-tone="${c.ok ? 'green' : 'coral'}"><span>${c.ok ? '✓' : '!'}</span>${inl(c.text)}</div>`).join('')}</div>` : ''}`);
    return brow(esc(g.label), `<div class="md compact">${g.html}</div>`);
  };
  const deepRow = d => {
    if (d.kind === 'premortem') return brow(esc(d.heading), `<div class="pbox" data-tone="coral"><div class="md compact">${d.html}</div></div>`);
    if (d.kind === 'ask') return brow(esc(d.heading), `<div class="pbox" data-tone="blue"><div class="md compact">${d.html}</div></div>`);
    if (d.kind === 'risks') return brow(esc(d.heading), `<div class="md compact">${d.html}</div><div class="risks">${d.risks.map(r => `<div class="risk"><div data-tone="coral">${r.riskHtml}</div><div data-tone="green"><p><b>Mitigación</b></p>${r.mitigationHtml}</div></div>`).join('')}</div>`);
    return brow(esc(d.heading), `<div class="md compact ${d.kind === 'legal' ? 'legal' : ''}">${d.html}</div>`);
  };
  const evidence = pt.deep.find(d => d.kind === 'evidence');
  const ex = (() => { const e = pt.scorecard.find(a => /esfuerzo/i.test(a.axis)); const t = (e?.value || '').toLowerCase(); return /micro/.test(t) ? 0.22 : /peque|small|1-2|semana/.test(t) ? 0.5 : /grande|large|mes/.test(t) ? 0.82 : 0.5; })();
  const vy = (() => { const axes = pt.scorecard.filter(a => /founder-fit|demanda|retorno/i.test(a.axis)); const v = { high: 1, mid: 0.55, low: 0.25 }; return axes.length ? axes.reduce((s, a) => s + (v[a.level] ?? 0.55), 0) / axes.length : 0.55; })();
  const cx = 44 + ex * 316, cy = 14 + (1 - vy) * 166;
  return `<div class="digest">
    ${digestHero('Memo-pitch de idea', '', '', typeChips + badges)}
    ${band('teal', 'flame', 'De un vistazo · el sueño', pt.glance.map(glanceRow).join(''))}
    ${band('blue', 'layers', 'Profundizar · el criterio', pt.deep.filter(d => d.kind !== 'evidence').map(deepRow).join(''))}
    ${pt.scorecard.length ? band('violet', 'gauge', 'El tablero de decisión', `<div class="board-panels"><section class="gcard"><h3>Scorecard</h3>${pt.scorecard.map(a => `<div class="score"><span class="mono">${esc(a.axis)}</span><span class="score-bar"><i data-tone="${SCORE_TONE[a.level]}" style="width:${SCORE_WIDTH[a.level]}%"></i></span><span class="xs muted">${esc(a.value)}</span></div>`).join('')}</section>
      <section class="gcard"><h3>Esfuerzo vs. valor</h3><svg class="effort" viewBox="0 0 380 220" role="img" aria-label="Esfuerzo frente a valor: la idea está en esfuerzo ${Math.round(ex * 100)} % y valor ${Math.round(vy * 100)} %"><rect x="44" y="14" width="150" height="80" rx="6" class="sweet"/><text x="54" y="32" class="sweet-t">★ zona ideal</text><line x1="44" y1="180" x2="360" y2="180" class="axis"/><line x1="44" y1="14" x2="44" y2="180" class="axis"/><circle cx="${cx}" cy="${cy}" r="9" class="dot"/><text x="${cx + 14}" y="${cy + 5}" class="dot-t">esta idea</text><text x="70" y="198" class="tick">MICRO</text><text x="180" y="198" class="tick">PEQUEÑA</text><text x="300" y="198" class="tick">GRANDE</text><text x="200" y="214" class="cap">← más fácil · esfuerzo · más complejo →</text><text x="20" y="110" class="cap" transform="rotate(-90 20 110)">valor →</text></svg></section></div>
      ${evidence ? `<details class="evidence"><summary class="link small">Evidencia y fuentes (lo que sostiene este memo)</summary><div class="md compact" style="margin-top:10px">${evidence.html}</div></details>` : ''}`) : ''}
  </div>`;
}

/* ---------- Spec ---------- */
function specBlock(b) {
  const items = b.items || [];
  switch (b.kind) {
    case 'bullets': return `<ul class="sbul">${items.map(it => `<li><b>${inl(it.title)}</b>${it.desc ? ` — ${inl(it.desc)}` : ''}</li>`).join('')}</ul>`;
    case 'highlight': return `<div class="pbox" data-tone="blue"><div class="md compact">${b.html}</div></div>`;
    case 'roles': return `<div class="feats">${items.map(it => `<div class="feat"><b>${inl(it.title)}</b><span>${inl(it.desc)}</span></div>`).join('')}</div>`;
    case 'metrics': return `<div class="feats">${items.map(it => `<div class="feat metric"><b>${inl(it.title)}</b><span>${inl(it.desc)}</span></div>`).join('')}</div>`;

/**
 * Roam engine for the active room, after the app's RoamingCast: each member walks to a fresh spot
 * every 0.9–2.5 s, sometimes toward a teammate; walking bobs, pausing idles. Off under reduced motion.
 */
let ROAM = 0;
function startRoam() {
  cancelAnimationFrame(ROAM);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const room = $('.room.is-current');
  if (!room) return;
  const cast = $$('.cm', room).map(el => ({ el, x: +el.dataset.homeX, y: +el.dataset.homeY, tx: +el.dataset.homeX, ty: +el.dataset.homeY, walk: false, t0: performance.now(), dur: 600 + Math.random() * 1400 }));
  const step = now => {
    if (!room.isConnected) return;
    for (const s of cast) {
      if (s.walk) {
        const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy);
        if (d < 0.6) { s.walk = false; s.t0 = now; s.dur = 900 + Math.random() * 1500; s.el.classList.remove('walking'); }
        else { s.x += (dx / d) * 0.35; s.y += (dy / d) * 0.35; }
      } else if (now - s.t0 > s.dur) {
        const mate = cast.length > 1 && Math.random() < 0.45 ? cast.filter(o => o !== s)[Math.floor(Math.random() * (cast.length - 1))] : null;
        s.tx = mate ? Math.max(14, Math.min(86, mate.x + (s.x < mate.x ? -14 : 14))) : 14 + Math.random() * 72;
        s.ty = mate ? mate.y : 34 + Math.random() * 40;
        s.walk = true; s.el.classList.add('walking');
      }
      s.el.style.left = s.x + '%'; s.el.style.top = s.y + '%'; s.el.style.zIndex = String(Math.round(s.y));
    }
    ROAM = requestAnimationFrame(step);
  };
  ROAM = requestAnimationFrame(step);
}

/** Extract the HTML of the first matching h2 section from rendered markdown. */
function sectionHtml(html, names) {

  return hit ? hit.replace(/^<h2[^>]*>.*?<\/h2>/, '') : '';

const DIFFICULTY = { trivial: 'Trivial', low: 'Baja', normal: 'Media', medium: 'Media', high: 'Alta' };
