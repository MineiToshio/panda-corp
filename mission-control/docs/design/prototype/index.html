/* Órbita · ronda 5 — tokens and primitives.
   Neutral chrome, colorful meaning: hues are reserved for phase, state and document purpose,
   always paired with a label or icon. Every component reads its hue from --tone. */

:root {
  color-scheme: light;
  --font-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s8: 32px; --s10: 40px; --s12: 48px;
  --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-xl: 22px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --dur: 160ms;
  --sidebar: 252px; --rail-c: 64px;
  /* La Fragua is a dark scene in both themes: it always uses the dark palette. */
  --scene-text: #eef0f6; --scene-text-2: #b6bccb; --scene-text-3: #8d94a7; --scene-surface: #151920; --scene-surface-2: #1b2029; --scene-line: #252b37; --scene-line-strong: #343c4c;
  --scene-blue: #8cb4ff; --scene-teal: #5fd6c6; --scene-violet: #b9a2ff; --scene-pink: #f59bc9; --scene-amber: #f2c46d; --scene-green: #72da9e; --scene-coral: #ff9580; --scene-slate: #a6aec0; --scene-gold: #f5cc5c;
  --rail: 76px;
  --content: 1180px;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-base: 15px; --fs-lg: 16px; --fs-xl: 17px;
  --fs-h3: 19px; --fs-h2: 21px; --fs-h1s: 25px; --fs-h1m: 28px; --fs-h1: 32px;
  --r-xs: 6px; --r-md: 10px; --r-2xl: 28px; --r-pill: 999px;
  --hairline: 1px; --rule: 3px;
  --map-bg: #0d1117;
  --map-room: #161b22;
  --map-edge: #2a3140;
  --map-label-bg: #0d1117e0;
  --map-label-fg: #eef0f6;
  --map-handoff-bg: #eef0f6;
  --map-handoff-fg: #161922;
  --bg: #f3f4f7;
  --bg-2: #eceef3;
  --surface: #ffffff;
  --surface-2: #f6f7fa;
  --surface-3: #eceff4;
  --line: #e2e5ec;
  --line-strong: #cfd4de;
  --text: #161922;
  --text-2: #464d5f;
  --text-3: #636b7e;
  --primary-bg: #161922;
  --primary-fg: #ffffff;
  --focus: #2f5fd0;
  --shadow: 0 1px 2px #1619220d, 0 10px 28px #1619220f;
  --backdrop: #16192266;

  --blue: #2350b5;
  --teal: #0a675d;
  --violet: #5939bd;
  --pink: #9c275e;
  --amber: #7a4d04;
  --green: #17663a;
  --coral: #a03722;
  --slate: #4b5467;
  --gold: #765300;

  --tint: 9%;
  --tint-strong: 16%;
  --shadow-sm: 0 1px 2px #1619221f;
  --shadow-node: 0 6px 18px #1619221a;
  --shadow-drop: 0 6px 10px #16192233;
  --shadow-panel: 20px 0 60px #16192240;
  --shadow-dialog: 0 30px 80px #16192240;
  --shadow-toast: 0 16px 40px #16192240;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0e13;
  --bg-2: #101319;
  --surface: #151920;
  --surface-2: #1b2029;
  --surface-3: #232935;
  --line: #252b37;
  --line-strong: #343c4c;
  --text: #eef0f6;
  --text-2: #b6bccb;
  --text-3: #8d94a7;
  --primary-bg: #eef0f6;
  --primary-fg: #0c0e13;
  --focus: #8fb3ff;
  --shadow: 0 1px 0 #ffffff08 inset, 0 12px 32px #00000040;
  --backdrop: #05070bcc;
  --blue: #8cb4ff;
  --teal: #5fd6c6;
  --violet: #b9a2ff;
  --pink: #f59bc9;
  --amber: #f2c46d;
  --green: #72da9e;
  --coral: #ff9580;
  --slate: #a6aec0;
  --gold: #f5cc5c;
  --tint: 13%;
  --tint-strong: 22%;
  --shadow-sm: 0 1px 2px #00000033;
  --shadow-node: 0 6px 18px #0000002a;
  --shadow-drop: 0 6px 10px #00000066;
  --shadow-panel: 20px 0 60px #00000070;
  --shadow-dialog: 0 30px 80px #00000070;
  --shadow-toast: 0 16px 40px #00000066;
}

[data-tone="blue"] { --tone: var(--blue); }
[data-tone="teal"] { --tone: var(--teal); }
[data-tone="violet"] { --tone: var(--violet); }
[data-tone="pink"] { --tone: var(--pink); }
[data-tone="amber"] { --tone: var(--amber); }
[data-tone="green"] { --tone: var(--green); }
[data-tone="coral"] { --tone: var(--coral); }
[data-tone="slate"] { --tone: var(--slate); }
[data-tone="gold"] { --tone: var(--gold); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 88px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 var(--fs-base)/1.55 var(--font-body);
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--font-display); color: var(--text); margin: 0; letter-spacing: -.01em; line-height: 1.25; }
h1 { font-size: var(--fs-h1); font-weight: 750; letter-spacing: -.025em; }
h2 { font-size: var(--fs-h3); font-weight: 700; }
h3 { font-size: var(--fs-lg); font-weight: 650; }
h4 { font-size: var(--fs-md); font-weight: 650; }
p { margin: 0; }
a { color: inherit; }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
code, kbd, pre, .mono { font-family: var(--font-mono); font-size: max(.88em, var(--fs-xs)); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--r-xs); }
::selection { background: color-mix(in srgb, var(--blue) 35%, transparent); }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: var(--hairline); height: var(--hairline); overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* ---------- Icons ---------- */
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.i.sm { width: 15px; height: 15px; }
.i.lg { width: 22px; height: 22px; }

/* ---------- Text helpers ---------- */
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: var(--fs-sm); }
.xs { font-size: var(--fs-xs); }
.eyebrow { font-size: var(--fs-xs); font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.tone-text { color: var(--tone); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-weight: 750; letter-spacing: -.02em; }
.clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.nowrap { white-space: nowrap; }

/* ---------- Layout helpers ---------- */
.row { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row.top { align-items: flex-start; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--s4); min-width: 0; }
.stack.lg { gap: var(--s6); }
.stack.sm { gap: var(--s2); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s4); }

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: var(--hairline) solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s5) var(--s6);
  min-width: 0;
}
.card.flush { padding: 0; overflow: hidden; }
.card.tinted { background: linear-gradient(180deg, color-mix(in srgb, var(--tone) var(--tint), var(--surface)) 0, var(--surface) 160px); border-color: color-mix(in srgb, var(--tone) 22%, var(--line)); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); margin-bottom: var(--s4); min-width: 0; }
.card-head h2, .card-head h3 { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.card-foot { margin-top: var(--s4); padding-top: var(--s4); border-top: var(--hairline) solid var(--line); display: flex; gap: var(--s3); align-items: center; justify-content: space-between; flex-wrap: wrap; }
.badge-icon {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-md); flex: none;
  color: var(--tone, var(--text-2));
  background: color-mix(in srgb, var(--tone, var(--slate)) var(--tint-strong), transparent);
}
.badge-icon.sm { width: 26px; height: 26px; border-radius: var(--r-sm); }
.badge-icon.lg { width: 44px; height: 44px; border-radius: var(--r); }

/* ---------- Chips ---------- */
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: var(--r-pill);
  font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; line-height: 1;
  color: var(--tone, var(--text-2));
  background: color-mix(in srgb, var(--tone, var(--slate)) var(--tint-strong), transparent);
}
.chip.outline { background: transparent; border: var(--hairline) solid color-mix(in srgb, var(--tone, var(--slate)) 45%, transparent); }
.chip.plain { color: var(--text-2); background: var(--surface-3); }
.chip .dot, .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tone, var(--slate)); flex: none; }
.chip.lg { height: 30px; padding: 0 var(--s3); font-size: var(--fs-sm); }
.illus { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-xs); font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--text-2); border: var(--hairline) dashed var(--line-strong); border-radius: var(--r-pill); padding: 2px var(--s2); white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 40px; padding: 0 14px;
  border-radius: var(--r); border: var(--hairline) solid var(--line-strong); background: var(--surface-2); color: var(--text);
  font-size: var(--fs-md); font-weight: 600; text-decoration: none; white-space: nowrap;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease);
}
@media (hover: hover) { .btn:hover { background: var(--surface-3); } }
.btn:active { transform: translateY(var(--hairline)); }
.btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: transparent; }
@media (hover: hover) { .btn.primary:hover { filter: brightness(.92); } }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
@media (hover: hover) { .btn.ghost:hover { background: var(--surface-2); color: var(--text); } }
.btn.toned { color: var(--tone); background: color-mix(in srgb, var(--tone) var(--tint), transparent); border-color: color-mix(in srgb, var(--tone) 35%, transparent); }
@media (hover: hover) { .btn.toned:hover { background: color-mix(in srgb, var(--tone) var(--tint-strong), transparent); } }
.btn.danger { color: var(--coral); background: transparent; border-color: color-mix(in srgb, var(--coral) 40%, transparent); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: var(--fs-sm); border-radius: var(--r-sm); }
.iconbtn {
  display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: var(--r-md); border: var(--hairline) solid transparent;
  background: transparent; color: var(--text-2); flex: none;
}
@media (hover: hover) { .iconbtn:hover { background: var(--surface-2); color: var(--text); } }
.iconbtn.bordered { border-color: var(--line-strong); background: var(--surface-2); }
.link { display: inline-flex; align-items: center; gap: 6px; color: var(--tone, var(--blue)); font-weight: 600; text-decoration: none; background: none; border: 0; padding: 0; font-size: var(--fs-md); }
@media (hover: hover) { .link:hover { text-decoration: underline; text-underline-offset: 3px; } }

/* ---------- Form fields ---------- */
.field {
  display: flex; align-items: center; gap: var(--s2); min-height: 40px; padding: 0 var(--s3); border-radius: var(--r);
  border: var(--hairline) solid var(--line-strong); background: var(--surface); color: var(--text-3); min-width: 0;
}
.field:focus-within { border-color: var(--focus); box-shadow: 0 0 0 var(--rule) color-mix(in srgb, var(--focus) 22%, transparent); }
.field input, .field select, .field textarea { border: 0; outline: 0; background: transparent; color: var(--text); width: 100%; min-width: 0; min-height: 38px; }
.field select { appearance: none; padding-right: var(--s2); cursor: pointer; }
.field textarea { min-height: 88px; padding: 10px 0; resize: vertical; }
.field input::placeholder, .field textarea::placeholder { color: var(--text-3); }
label.lbl { display: block; font-size: var(--fs-sm); font-weight: 600; color: var(--text-2); margin-bottom: 6px; }

/* ---------- Segmented control ---------- */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r); background: var(--surface-2); border: var(--hairline) solid var(--line); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 var(--s3); border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font-size: var(--fs-sm); font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm), 0 0 0 var(--hairline) var(--line-strong); }
.seg button[aria-pressed="true"] .i { color: var(--tone, var(--text)); }

/* ---------- Progress ---------- */
.bar { position: relative; height: 6px; border-radius: var(--r-pill); background: var(--surface-3); overflow: hidden; }
.bar > span { position: absolute; inset: 0 auto 0 0; border-radius: inherit; background: var(--tone, var(--green)); }
.stackbar { display: flex; height: 8px; border-radius: var(--r-pill); overflow: hidden; background: var(--surface-3); gap: 2px; }
.stackbar > span { background: var(--tone); min-width: 3px; }
.ring {
  --p: 0; --size: 52px; --w: 6px;
  width: var(--size); height: var(--size); border-radius: 50%; flex: none; display: grid; place-items: center;
  background: radial-gradient(closest-side, var(--surface) calc(100% - var(--w)), transparent calc(100% - var(--w) + var(--hairline))), conic-gradient(var(--tone, var(--green)) calc(var(--p) * 1%), var(--surface-3) 0);
  font: 750 var(--fs-sm)/1 var(--font-display); font-variant-numeric: tabular-nums;
}
.ring.lg { --size: 76px; --w: 8px; font-size: var(--fs-h3); }

/* ---------- Command row ---------- */
.cmd { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: var(--s1) var(--s1) var(--s1) var(--s3); border-radius: var(--r); background: var(--bg-2); border: var(--hairline) solid var(--line); min-width: 0; }
.cmd .i { color: var(--violet); }
.cmd code { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--text); font-size: var(--fs-sm); line-height: 1.4; padding: 6px 0; }
.cmd .iconbtn { width: 36px; height: 36px; }

/* ---------- List rows ---------- */
.lrow {
  display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 56px; padding: 10px var(--s3); text-align: left;
  border: 0; border-radius: var(--r); background: transparent; color: inherit; text-decoration: none;
}
@media (hover: hover) { .lrow:hover { background: var(--surface-2); } }
.lrow .grow strong { display: block; font-weight: 600; font-size: var(--fs-base); line-height: 1.35; }
.lrow .grow small { display: block; color: var(--text-3); font-size: var(--fs-xs); margin-top: 2px; }
.lrow > .i:last-child { color: var(--text-3); }
.divided > * + * { border-top: var(--hairline) solid var(--line); }
.divided > .lrow { border-radius: 0; }

/* ---------- Empty / notice ---------- */
.empty { display: grid; place-items: center; gap: var(--s2); text-align: center; padding: var(--s8) var(--s4); color: var(--text-3); border: var(--hairline) dashed var(--line-strong); border-radius: var(--r-lg); font-size: var(--fs-md); }
.notice { display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3) var(--s4); border-radius: var(--r); background: color-mix(in srgb, var(--tone, var(--slate)) var(--tint), var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--tone, var(--slate)) 30%, transparent); color: var(--text); font-size: var(--fs-md); }
.notice > .i { color: var(--tone); margin-top: 2px; }

/* ---------- Key/value ---------- */
.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--s2) var(--s5); font-size: var(--fs-md); }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; border: var(--hairline) solid var(--line); border-radius: var(--r); }
table.t { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
table.t th { text-align: left; font-size: var(--fs-xs); font-weight: 650; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px; background: var(--surface-2); border-bottom: var(--hairline) solid var(--line); }
table.t td { padding: var(--s3) 14px; border-bottom: var(--hairline) solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }

/* Órbita · ronda 5 — shell and screens. */

/* ---------- Demo strip (review-only chrome) ---------- */
.demo { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; padding: var(--s2) var(--s4); font-size: var(--fs-xs); color: var(--text-3); background: var(--bg-2); border-bottom: var(--hairline) dashed var(--line-strong); }
.demo strong { color: var(--text-2); }
.demo .field { min-height: 32px; }
.demo .field select { min-height: 30px; font-size: var(--fs-xs); }
.demo .btn { min-height: 32px; font-size: var(--fs-xs); }
/* Demo-only preview controls (DR-061): dashed block, DEMO tag and how the real app behaves; hidden with ?demo=off. */
.demo-inline { display: grid; gap: 6px; justify-items: start; padding: 8px 10px; border: var(--hairline) dashed color-mix(in srgb, var(--map-label-fg) 45%, transparent); border-radius: var(--r); }
.demo-tag { font: 700 var(--fs-xs)/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--map-label-fg) 80%, transparent); }
.demo-note { font-size: var(--fs-xs); color: color-mix(in srgb, var(--map-label-fg) 75%, transparent); }
@media (max-width: 759px) { .demo-inline { width: 100%; } }
.skip { position: absolute; left: var(--s3); top: -80px; z-index: 100; background: var(--surface); padding: 10px 14px; border-radius: var(--r-md); border: var(--hairline) solid var(--line-strong); }
.skip:focus { top: var(--s3); }

/* ---------- App frame ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100dvh; }
.sidebar {
  position: sticky; top: 0; height: 100dvh; overflow-y: auto; display: flex; flex-direction: column; gap: var(--s4);
  padding: var(--s4) var(--s3); background: var(--bg-2); border-right: var(--hairline) solid var(--line); scrollbar-width: thin;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px var(--s2); text-decoration: none; border-radius: var(--r); }
.brand img { width: 34px; height: 34px; border-radius: var(--r-md); }
.brand b { display: block; font: 750 var(--fs-base)/1.1 var(--font-display); letter-spacing: -.01em; }
.brand small { display: block; font-size: var(--fs-xs); letter-spacing: .14em; color: var(--text-3); font-weight: 650; margin-top: 3px; }
.navgroup { display: grid; gap: 2px; }
.navlabel { padding: 10px 10px 6px; font-size: var(--fs-xs); font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); display: flex; justify-content: space-between; align-items: center; }
.navitem {
  position: relative; display: flex; align-items: center; gap: 11px; min-height: 40px; padding: 0 10px; border-radius: var(--r-md);
  color: var(--text-2); text-decoration: none; font-size: var(--fs-base); font-weight: 550;
}
.navitem .i { color: var(--text-3); transition: color var(--dur) var(--ease); }
@media (hover: hover) { .navitem:hover { background: var(--surface-2); color: var(--text); } }
@media (hover: hover) { .navitem:hover .i { color: var(--tone); } }
.navitem[aria-current="page"] { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 var(--hairline) var(--line); }
.navitem[aria-current="page"] .i { color: var(--tone); }
.navitem .count { margin-left: auto; font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }

.projnav .navitem { min-height: 44px; }
.pav {
  display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: var(--r-sm); flex: none;
  font: 750 var(--fs-xs)/1 var(--font-display); color: var(--tone); background: color-mix(in srgb, var(--tone) var(--tint-strong), transparent);
  box-shadow: inset 0 0 0 var(--hairline) color-mix(in srgb, var(--tone) 35%, transparent);
}
.pav.lg { width: 48px; height: 48px; border-radius: var(--r); font-size: var(--fs-xl); }
.pav.md { width: 36px; height: 36px; border-radius: var(--r-md); font-size: var(--fs-sm); }
.projnav .navitem .meta { display: grid; min-width: 0; line-height: 1.2; }
.projnav .navitem .meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.projnav .navitem .meta small { font-size: var(--fs-xs); color: var(--text-2); }
.guildcard { margin-top: auto; display: block; text-decoration: none; padding: var(--s3); border-radius: var(--r-lg); background: linear-gradient(140deg, color-mix(in srgb, var(--gold) 14%, var(--surface)), var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--gold) 26%, var(--line)); }
.guildcard .crest { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r); background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold); font: 800 var(--fs-md)/1 var(--font-display); }
.guildcard b { font: 700 var(--fs-md)/1.2 var(--font-display); display: block; }
.guildcard small { font-size: var(--fs-xs); color: var(--text-2); }
.guildcard .bar { margin-top: 10px; height: 5px; }
.guildcard .bar > span { background: var(--gold); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: none; }
.page { width: 100%; max-width: calc(var(--content) + 2 * var(--s10)); margin: 0 auto; padding: var(--s8) var(--s10) var(--s12); flex: 1; outline: none; }
.foot { max-width: calc(var(--content) + 2 * var(--s10)); width: 100%; margin: 0 auto; padding: var(--s5) var(--s10) var(--s8); display: flex; justify-content: space-between; gap: var(--s4); flex-wrap: wrap; color: var(--text-3); font-size: var(--fs-xs); border-top: var(--hairline) solid var(--line); }
.bottomnav { display: none; }
.scrim { display: none; }

/* ---------- Page header ---------- */
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s5); margin-bottom: var(--s6); flex-wrap: wrap; }
.pagehead .titles { display: grid; gap: 6px; min-width: 0; }
.pagehead p { color: var(--text-2); font-size: var(--fs-base); max-width: 70ch; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); color: var(--text-3); flex-wrap: wrap; }
.crumbs a { color: var(--text-2); text-decoration: none; }
@media (hover: hover) { .crumbs a:hover { color: var(--text); text-decoration: underline; } }
.stamp { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-2); }
.stamp .dot { --tone: var(--teal); }

/* ---------- Tabs ---------- */
.tabs-wrap { position: relative; margin-bottom: var(--s6); }
.tabs { display: flex; gap: 2px; border-bottom: var(--hairline) solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button, .tabs a {
  position: relative; display: inline-flex; align-items: center; gap: 7px; min-height: 46px; padding: 0 10px; border: 0; background: transparent;
  color: var(--text-2); font-size: var(--fs-md); font-weight: 600; white-space: nowrap; text-decoration: none; border-radius: var(--r-md) var(--r-md) 0 0;
}
.tabs button .i { color: var(--text-3); }
@media (hover: hover) { .tabs button:hover { color: var(--text); background: var(--surface-2); } }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button[aria-selected="true"] .i { color: var(--tone); }
.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2.5px; border-radius: var(--r-xs) var(--r-xs) 0 0; background: var(--tone); }
.tabs .sep { width: var(--hairline); margin: var(--s3) 6px; background: var(--line-strong); flex: none; }
.tabs .badge { font-size: var(--fs-xs); font-weight: 700; color: var(--text-3); background: var(--surface-3); border-radius: var(--r-pill); padding: var(--hairline) 7px; }
.tabs-wrap::before, .tabs-wrap::after { content: ""; position: absolute; top: 0; bottom: var(--hairline); width: 28px; pointer-events: none; opacity: 0; transition: opacity var(--dur); z-index: 1; }
.tabs-wrap::before { left: 0; background: linear-gradient(90deg, var(--bg), transparent); }
.tabs-wrap::after { right: 0; background: linear-gradient(270deg, var(--bg), transparent); }
.tabs-wrap[data-more-left="true"]::before, .tabs-wrap[data-more-right="true"]::after { opacity: 1; }

/* ---------- Phase stepper ---------- */
.stepper { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; list-style: none; margin: 0; padding: 0; }
.stepper li { display: grid; gap: 7px; min-width: 0; }
.stepper .seg-line { height: 5px; border-radius: var(--r-pill); background: var(--surface-3); }
.stepper li[data-state="past"] .seg-line { background: color-mix(in srgb, var(--tone) 55%, var(--surface-3)); }
.stepper li[data-state="current"] .seg-line { background: var(--tone); box-shadow: 0 0 0 var(--rule) color-mix(in srgb, var(--tone) 22%, transparent); }
.stepper .lbl { font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stepper li[data-state="current"] .lbl { color: var(--tone); font-weight: 700; }
.stepper li[data-state="past"] .lbl { color: var(--text-2); }
.stepper.compact { gap: 3px; }
.stepper.compact .seg-line { height: 4px; }

/* ---------- Inicio ---------- */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(300px, 1fr); gap: var(--s6); align-items: start; }
.turn-list { display: grid; gap: 10px; }
.turn {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s4); align-items: center; padding: 14px var(--s4); border-radius: var(--r-lg);
  background: color-mix(in srgb, var(--tone) var(--tint), var(--surface)); border: var(--hairline) solid color-mix(in srgb, var(--tone) 26%, var(--line));
  text-decoration: none; color: inherit;
}
.turn strong { display: block; font-size: var(--fs-base); font-weight: 650; line-height: 1.35; }
.turn small { display: block; color: var(--text-2); font-size: var(--fs-sm); margin-top: 3px; }
.turn .kind { font-size: var(--fs-xs); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--tone); }
.proj-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: var(--s4); }
.proj-card {
  display: grid; gap: 14px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid var(--line); text-decoration: none; color: inherit;
  transition: border-color var(--dur) var(--ease), transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
@media (hover: hover) { .proj-card:hover { border-color: color-mix(in srgb, var(--tone) 45%, var(--line)); transform: translateY(-2px); box-shadow: var(--shadow); } }
.proj-card h3 { font-size: var(--fs-lg); }
.proj-card .facts { display: flex; gap: 14px; font-size: var(--fs-xs); color: var(--text-3); flex-wrap: wrap; }
.proj-card .facts b { color: var(--text); font-weight: 650; font-variant-numeric: tabular-nums; }
.pulse { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s3); }
.pulse > div { padding: var(--s3); border-radius: var(--r); background: var(--surface-2); }
.pulse .num { font-size: var(--fs-h1s); display: block; }
.pulse small { color: var(--text-3); font-size: var(--fs-xs); }
.funnel { display: grid; gap: var(--s2); }
.funnel .frow { display: grid; grid-template-columns: 104px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: var(--fs-sm); color: var(--text-2); }
.funnel .frow .bar { height: 8px; }
.funnel .frow b { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
.feed { display: grid; gap: 0; }
.feed .entry { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--s3); padding: var(--s3) 0; border-top: var(--hairline) solid var(--line); font-size: var(--fs-md); color: var(--text-2); }
.feed .entry:first-child { border-top: 0; padding-top: 0; }
.feed .entry b { color: var(--text); font-weight: 600; }
.feed .entry code { background: var(--surface-3); padding: var(--hairline) 5px; border-radius: var(--r-xs); color: var(--text); }
.feed .entry .who { font-size: var(--fs-xs); color: var(--text-3); margin-top: 3px; display: block; }

/* ---------- Tablero ---------- */
.toolbar { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; margin-bottom: var(--s5); }
.toolbar .field.search { flex: 0 1 480px; }
.chipset { display: flex; gap: 6px; flex-wrap: wrap; }
.chipbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 var(--s3); border-radius: var(--r-pill); border: var(--hairline) solid var(--line-strong); background: transparent; color: var(--text-2); font-size: var(--fs-sm); font-weight: 600; }
@media (hover: hover) { .chipbtn:hover { background: var(--surface-2); color: var(--text); } }
.chipbtn[aria-pressed="true"] { background: var(--surface-3); border-color: var(--line-strong); color: var(--text); }
.chipbtn .n { font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
.kanban { display: flex; gap: var(--s3); align-items: stretch; overflow-x: auto; padding-bottom: var(--s3); scrollbar-width: thin; }
.kcol { flex: 1 1 0; min-width: 180px; display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--tone) 5%, var(--bg-2)); border: var(--hairline) solid var(--line); }
.kcol-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s1) 6px 6px; font: 700 var(--fs-md)/1.2 var(--font-display); }
.kcol-head .step { font-size: var(--fs-xs); color: var(--text-3); font-weight: 650; }
.kcol-head .chip { margin-left: auto; }
.kcol.is-empty { flex: 0 0 132px; min-width: 132px; background: transparent; border-style: dashed; }
.kcol.is-empty .kcol-head { color: var(--text-2); font-weight: 600; }
.kcol.is-empty .kcol-head .step { display: none; }
.kcol.is-empty .kempty { padding: 12px 4px; }
.kcard {
  position: relative; display: grid; gap: 10px; padding: 14px; border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
@media (hover: hover) { .kcard:hover { border-color: color-mix(in srgb, var(--tone) 40%, var(--line)); box-shadow: var(--shadow); } }
.kcard { min-width: 0; }
.kcard a.title { display: block; font: 650 var(--fs-base)/1.35 var(--font-display); text-decoration: none; color: var(--text); padding-right: 34px; overflow-wrap: anywhere; }
.kcard a.title::after { content: ""; position: absolute; inset: 0; border-radius: inherit; }
.kcard .star { position: absolute; top: var(--s2); right: var(--s2); z-index: 1; width: 34px; height: 34px; }
.kcard .star[aria-pressed="true"] { color: var(--gold); }
.kcard .star[aria-pressed="true"] .i { fill: currentColor; }
.kcard .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.kcard .score { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
.kcard .score .bar { width: 38px; height: 4px; }
.kcard .projline { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-xs); color: var(--text-3); padding-top: 10px; border-top: var(--hairline) dashed var(--line); }
.kcard .projline .bar { flex: 1; height: 4px; }
.kempty { color: var(--text-2); font-size: var(--fs-sm); text-align: center; padding: var(--s5) var(--s2); }

/* ---------- Idea detail / project header ---------- */
.hero {
  display: grid; gap: var(--s5); padding: var(--s6); border-radius: var(--r-xl); margin-bottom: var(--s6);
  background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--tone) 16%, var(--surface)) 0%, var(--surface) 55%);
  border: var(--hairline) solid color-mix(in srgb, var(--tone) 24%, var(--line));
}
.hero-top { display: flex; gap: var(--s4); align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.hero-title { display: flex; gap: var(--s4); align-items: center; min-width: 0; }
.hero-title h1 { font-size: var(--fs-h1m); }
.hero-sub { color: var(--text-2); max-width: 78ch; font-size: var(--fs-base); }
.hero-stats { display: flex; gap: var(--s6); flex-wrap: wrap; align-items: center; }
.hero-stats .st { display: grid; gap: 2px; }
.hero-stats .st b { font: 750 var(--fs-h2)/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.hero-stats .st small { font-size: var(--fs-xs); color: var(--text-2); }
.hero .stepper { max-width: 640px; }
.switcher { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: var(--s1) var(--s3) var(--s1) var(--s1); border-radius: var(--r); border: var(--hairline) solid var(--line-strong); background: var(--surface); color: var(--text); text-align: left; }
@media (hover: hover) { .switcher:hover { background: var(--surface-2); } }
.switcher b { display: block; font: 700 var(--fs-md)/1.2 var(--font-display); }
.switcher small { display: block; font-size: var(--fs-xs); color: var(--text-2); }

/* ---------- Spec ---------- */
.spec-layout { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: var(--s8); align-items: start; }
.toc { position: sticky; top: var(--s6); display: grid; gap: 2px; font-size: var(--fs-sm); }
.toc .eyebrow { padding: 0 10px var(--s2); }
.toc a { display: flex; align-items: center; gap: var(--s2); padding: 7px 10px; border-radius: var(--r-sm); color: var(--text-2); text-decoration: none; }
@media (hover: hover) { .toc a:hover { background: var(--surface-2); color: var(--text); } }
.toc a .dot { background: var(--tone); }
.spec-lead { padding: var(--s6); }
.spec-lead p { font-size: var(--fs-xl); line-height: 1.6; color: var(--text); max-width: 72ch; }
.area-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; margin: var(--s4) 0 var(--s3); }
.area-head h2 { display: flex; align-items: center; gap: 10px; font-size: var(--fs-h2); }
.blocks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4); }
.block { padding: var(--s5); border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid var(--line); min-width: 0; }
.block.wide { grid-column: 1 / -1; }
.block.wide .md ul { columns: 2; column-gap: var(--s8); }
.block.wide .md li { break-inside: avoid; }
.block h3 { display: flex; align-items: center; gap: 10px; margin-bottom: var(--s3); color: var(--tone); }
.frd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--s4); }
.frd-card { display: grid; gap: var(--s3); align-content: start; padding: var(--s5); border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid var(--line); }
.frd-card .fid { font: 700 var(--fs-xs)/1 var(--font-mono); color: var(--violet); background: color-mix(in srgb, var(--violet) var(--tint-strong), transparent); padding: 5px var(--s2); border-radius: var(--r-xs); }
.frd-card h3 { font-size: var(--fs-lg); }
.frd-card p { font-size: var(--fs-md); color: var(--text-2); }

/* ---------- Work orders ---------- */
.state-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: var(--s5); }
.state-tile { display: grid; gap: 6px; text-align: left; padding: var(--s3) 14px; border-radius: var(--r); border: var(--hairline) solid var(--line); background: var(--surface); color: inherit; }
@media (hover: hover) { .state-tile:hover { border-color: color-mix(in srgb, var(--tone) 45%, var(--line)); } }
.state-tile[aria-pressed="true"] { background: color-mix(in srgb, var(--tone) var(--tint), var(--surface)); border-color: color-mix(in srgb, var(--tone) 55%, transparent); box-shadow: inset 0 0 0 var(--hairline) color-mix(in srgb, var(--tone) 40%, transparent); }
.state-tile .lbl { display: flex; align-items: center; gap: var(--s2); font-size: var(--fs-sm); color: var(--text-2); font-weight: 600; }
.state-tile b { font: 750 var(--fs-h1s)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.frd-rows { display: grid; gap: 10px; }
.frd-row { border: var(--hairline) solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; }
.frd-row > summary { list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(120px, 260px) auto auto; gap: var(--s4); align-items: center; padding: 14px var(--s4); cursor: pointer; }
.frd-row > summary::-webkit-details-marker { display: none; }
@media (hover: hover) { .frd-row > summary:hover { background: var(--surface-2); } }
.frd-row > summary .chev { color: var(--text-3); transition: transform var(--dur) var(--ease); }
.frd-row[open] > summary .chev { transform: rotate(90deg); }
.frd-row .fname { font-weight: 650; font-size: var(--fs-base); }
.frd-row .fname small { display: block; font: 600 var(--fs-xs)/1.3 var(--font-mono); color: var(--violet); margin-bottom: 2px; }
.frd-row .fcount { font-size: var(--fs-sm); color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.frd-row .wo-list { border-top: var(--hairline) solid var(--line); padding: 6px; }
.worow { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto 44px; gap: var(--s3); align-items: center; width: 100%; min-height: 48px; padding: var(--s2) 10px; border: 0; border-radius: var(--r-md); background: transparent; color: inherit; text-align: left; }
@media (hover: hover) { .worow:hover { background: var(--surface-2); } }
.worow .wid { font: 600 var(--fs-xs)/1 var(--font-mono); color: var(--text-3); }
.worow .wt { font-size: var(--fs-md); }
.worow .wdeps { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-xs); color: var(--text-3); white-space: nowrap; }
.worow > .chip { justify-self: end; }
.wo-kanban { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: var(--s3); align-items: start; }
.wo-kanban .kcol { min-width: 0; }
.wocard { display: grid; gap: 6px; width: 100%; padding: var(--s3); text-align: left; border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line); color: inherit; }
.wocard .wid { color: var(--tone); }
@media (hover: hover) { .wocard:hover { border-color: color-mix(in srgb, var(--tone) 45%, var(--line)); } }
.wocard .wid { font: 600 var(--fs-xs)/1 var(--font-mono); color: var(--tone); }
.wocard strong { font-size: var(--fs-md); font-weight: 600; line-height: 1.35; }
.wocard small { font-size: var(--fs-xs); color: var(--text-2); }
.morebtn { width: 100%; min-height: 40px; border-radius: var(--r); border: var(--hairline) dashed var(--line-strong); background: transparent; color: var(--text-2); font-size: var(--fs-sm); font-weight: 600; }
@media (hover: hover) { .morebtn:hover { background: var(--surface-2); color: var(--text); } }
.wo-detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: var(--s6); align-items: start; }

/* ---------- Architecture & model ---------- */
.arch-nav { display: flex; gap: var(--s2); flex-wrap: wrap; margin-bottom: var(--s5); }
.services { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--s3); }
.service { padding: 14px var(--s4); border-radius: var(--r); background: var(--surface-2); border: var(--hairline) solid var(--line); }
.service h3 { font-size: var(--fs-base); margin-bottom: 6px; }
.service p { font-size: var(--fs-md); color: var(--text-2); }
.envs { display: flex; gap: 6px; flex-wrap: wrap; }
.envs code { font-size: var(--fs-xs); padding: 5px var(--s2); border-radius: var(--r-xs); background: var(--surface-2); border: var(--hairline) solid var(--line); }
.diagram { position: relative; border-radius: var(--r-lg); border: var(--hairline) solid var(--line); background:
  radial-gradient(circle at var(--hairline) var(--hairline), color-mix(in srgb, var(--text-3) 22%, transparent) var(--hairline), transparent 0) 0 0 / 22px 22px, var(--bg-2); overflow: hidden; }
.diagram-tools { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; gap: 2px; align-items: center; padding: 3px; border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line-strong); box-shadow: var(--shadow); }
.diagram-tools .iconbtn { width: 34px; height: 34px; }
.diagram-tools span { min-width: 46px; text-align: center; font: 600 var(--fs-xs)/1 var(--font-mono); color: var(--text-2); }
.diagram-scroll { height: 560px; overflow: auto; cursor: grab; scrollbar-width: thin; }
.diagram.is-expanded { position: fixed; inset: var(--s4); z-index: 60; }
.diagram.is-expanded .diagram-scroll, .diagram:fullscreen .diagram-scroll { height: 100%; }
.diagram:fullscreen { background-color: var(--bg); }
.canvas { position: relative; transform-origin: 0 0; }
.links { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
.links path { fill: none; stroke: color-mix(in srgb, var(--text-3) 55%, transparent); stroke-width: 1.4; }
.links path.on { stroke: var(--teal); stroke-width: 2.4; }
.entity { position: absolute; width: 268px; border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line-strong); overflow: hidden; box-shadow: var(--shadow-node); }
.entity.on { border-color: var(--teal); box-shadow: 0 0 0 var(--rule) color-mix(in srgb, var(--teal) 30%, transparent); }
.entity.dim { opacity: .45; }
.entity header button { display: flex; width: 100%; align-items: center; gap: var(--s2); min-height: 40px; padding: 0 var(--s3); border: 0; background: color-mix(in srgb, var(--teal) var(--tint-strong), var(--surface)); color: var(--text); font: 700 var(--fs-md)/1 var(--font-display); text-align: left; }
.entity header button .n { margin-left: auto; font: 600 var(--fs-xs)/1 var(--font-mono); color: var(--text-3); }
.field-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px var(--s3); font: var(--fs-xs)/1.3 var(--font-mono); border-top: var(--hairline) solid var(--line); user-select: text; }
.field-row .k { font-size: var(--fs-xs); font-weight: 700; padding: var(--hairline) var(--s1); border-radius: var(--r-xs); margin-left: 6px; color: var(--amber); background: color-mix(in srgb, var(--amber) var(--tint-strong), transparent); }
.field-row .k.fk { color: var(--blue); background: color-mix(in srgb, var(--blue) var(--tint-strong), transparent); }
.field-row .ty { color: var(--text-3); white-space: nowrap; }
.schema-list { display: grid; gap: var(--s2); }
.schema-list details { border: var(--hairline) solid var(--line); border-radius: var(--r); background: var(--surface); }
.schema-list summary { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; cursor: pointer; font-weight: 650; }
.schema-list pre { margin: 0; padding: 14px; border-top: var(--hairline) solid var(--line); background: var(--bg-2); overflow-x: auto; font-size: var(--fs-xs); line-height: 1.6; }
.rel-row { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px var(--s3); border-top: var(--hairline) solid var(--line); font-size: var(--fs-md); }
.rel-row .card-n { font: 600 var(--fs-xs)/1 var(--font-mono); color: var(--text-3); padding: var(--s1) 6px; border-radius: var(--r-xs); background: var(--surface-2); }
.plan-row { border: var(--hairline) solid var(--line); border-radius: var(--r); background: var(--surface); }
.plan-row > summary { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; cursor: pointer; list-style: none; font-weight: 600; }
.plan-row > summary::-webkit-details-marker { display: none; }
.plan-row > div { padding: var(--s1) 14px 14px; display: grid; gap: var(--s3); }

/* ---------- Documents / Manual reader ---------- */
/* The document index sits on the RIGHT: a second left column would read as a second app sidebar. */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: var(--s6); align-items: start; }
.doc-index { position: sticky; top: var(--s4); max-height: calc(100dvh - 32px); overflow-y: auto; display: grid; gap: var(--s1); align-content: start; padding: var(--s3); border: var(--hairline) solid var(--line); border-radius: var(--r-lg); background: var(--surface); scrollbar-width: thin; }
.doc-index .field { margin-bottom: var(--s2); position: sticky; top: 0; z-index: 1; background: var(--surface); }
.dgroup > summary { list-style: none; display: flex; align-items: center; gap: var(--s2); min-height: 36px; padding: 0 var(--s2); border-radius: var(--r-sm); cursor: pointer; font-size: var(--fs-xs); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--tone); }
.dgroup > summary::-webkit-details-marker { display: none; }
@media (hover: hover) { .dgroup > summary:hover { background: var(--surface-2); } }
.dgroup > summary .n { margin-left: auto; color: var(--text-3); font-weight: 600; letter-spacing: 0; }
.dgroup > summary .chev { transition: transform var(--dur); color: var(--text-3); }
.dgroup[open] > summary .chev { transform: rotate(90deg); }
.ditem { display: flex; align-items: center; gap: 9px; width: 100%; min-height: 36px; padding: 6px 10px 6px 14px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--text-2); font-size: var(--fs-md); text-align: left; line-height: 1.3; }
.ditem .i { color: var(--tone); width: 15px; height: 15px; }
@media (hover: hover) { .ditem:hover { background: var(--surface-2); color: var(--text); } }
.ditem[aria-current="page"] { background: color-mix(in srgb, var(--tone) var(--tint-strong), var(--surface)); color: var(--text); font-weight: 600; }
.ditem span { overflow-wrap: anywhere; }
.paper { background: var(--surface); border: var(--hairline) solid var(--line); border-radius: var(--r-xl); padding: var(--s8) var(--s10); min-width: 0; }
.paper-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: var(--s4); margin-bottom: var(--s6); border-bottom: var(--hairline) solid var(--line); }
.paper-head .path { font: var(--fs-xs)/1.3 var(--font-mono); color: var(--text-3); overflow-wrap: anywhere; flex: 1; min-width: 160px; }
.index-toggle { display: none; }

/* ---------- Markdown ---------- */
.md { font-size: var(--fs-lg); line-height: 1.7; color: var(--text); overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2 { font-family: var(--font-display); line-height: 1.25; color: var(--tone, var(--text)); }
.md h1 { font-size: var(--fs-h1s); margin: 0 0 .7em; padding-bottom: .4em; border-bottom: var(--hairline) solid color-mix(in srgb, var(--tone, var(--line)) 40%, var(--line)); }
.md h2 { font-size: var(--fs-h2); margin: 1.8em 0 .6em; }
.md h3 { font-size: var(--fs-xl); margin: 1.5em 0 .5em; color: color-mix(in srgb, var(--tone, var(--text)) 60%, var(--text)); }
.md h4, .md h5, .md h6 { font: 700 var(--fs-xs)/1.4 var(--font-body); letter-spacing: .08em; text-transform: uppercase; margin: 1.4em 0 .5em; color: color-mix(in srgb, var(--tone, var(--slate)) 70%, var(--text-2)); }
.md p, .md ul, .md ol, .md blockquote, .md pre, .md table, .md details { margin: 0 0 .9em; }
.md ul, .md ol { padding-left: 1.4em; }
.md li { margin: .25em 0; }
.md li::marker { color: var(--tone, var(--text-3)); }
.md a { color: var(--blue); text-underline-offset: 3px; }
.md strong { font-weight: 650; color: var(--text); }
.md em { color: var(--text-2); }
.md code { padding: .12em .4em; border-radius: var(--r-xs); background: color-mix(in srgb, var(--tone, var(--slate)) 8%, var(--surface-3)); font-size: max(.86em, var(--fs-xs)); }
.md pre { padding: 14px var(--s4); border-radius: var(--r); background: var(--bg-2); border: var(--hairline) solid var(--line); overflow-x: auto; }
.md pre code { padding: 0; background: none; font-size: var(--fs-sm); }
.md blockquote { padding: 10px var(--s4); border: var(--hairline) solid color-mix(in srgb, var(--tone, var(--blue)) 30%, var(--line)); background: color-mix(in srgb, var(--tone, var(--blue)) 7%, transparent); border-radius: var(--r); color: var(--text-2); }
.md blockquote > :last-child { margin-bottom: 0; }
.md table { display: block; overflow-x: auto; border-collapse: collapse; font-size: var(--fs-md); max-width: 100%; }
.md th, .md td { padding: 9px var(--s3); border: var(--hairline) solid var(--line); text-align: left; vertical-align: top; }
.md th { background: color-mix(in srgb, var(--tone, var(--slate)) var(--tint), var(--surface-2)); font-weight: 650; color: var(--text); }
.md tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
.md hr { border: 0; border-top: var(--hairline) dashed color-mix(in srgb, var(--tone, var(--line)) 40%, var(--line)); margin: 1.8em 0; }
.md details.document-meta { border: var(--hairline) solid var(--line); border-radius: var(--r); padding: var(--s1) var(--s3); font-size: var(--fs-sm); color: var(--text-3); }
.md details.document-meta summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; }
.md details.document-meta pre { margin: 6px 0 var(--s2); }
.md.compact { font-size: var(--fs-md); line-height: 1.6; }
.md.compact ul { padding-left: 1.2em; }

/* Live Manual capture: map the app's own token names onto Órbita so its composed pages read natively. */
.manual-live {
  --color-text: var(--text); --color-text2: var(--text-2); --color-text3: var(--text-3);
  --color-base: var(--bg); --color-surface: var(--surface); --color-surface2: var(--surface-2); --color-panel: var(--surface);
  --color-card: var(--surface-2); --color-card2: var(--surface-3); --color-border: var(--line); --color-border-strong: var(--line-strong);
  --color-accent: var(--violet); --color-accent-bg: color-mix(in srgb, var(--violet) var(--tint-strong), transparent); --color-accent-text: var(--violet); --color-on-accent: var(--primary-fg);
  --color-secondary: var(--blue); --color-info: var(--blue); --color-info-bg: color-mix(in srgb, var(--blue) var(--tint), transparent);
  --color-ok: var(--green); --color-ok-bg: color-mix(in srgb, var(--green) var(--tint), transparent);
  --color-warn: var(--amber); --color-warn-bg: color-mix(in srgb, var(--amber) var(--tint), transparent);
  --color-danger: var(--coral); --color-danger-bg: color-mix(in srgb, var(--coral) var(--tint), transparent);
  --color-cat-1: var(--blue); --color-cat-2: var(--teal); --color-cat-3: var(--violet); --color-cat-6: var(--pink); --color-cat-7: var(--amber); --color-cat-8: var(--green);
  --font-body: var(--font-body); --font-sans: var(--font-body); --font-display: var(--font-display); --font-pixel: var(--font-display);
  --hairline: 1px; --radius: 10px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --shadow-1: none; --avatar-size-sm: 28px;
  font-size: var(--fs-base); line-height: 1.65; color: var(--text); overflow-wrap: anywhere;
}
.manual-live h1, .manual-live h2 { font-family: var(--font-display); }
/* The captured pages draw accent stripes inline (a bar before each title, left-ruled notes); the design has none. */
.manual-live span[style*="width:6px;height:18px"] { display: none; }
.manual-live [style*="border-left:2px solid"], .manual-live [style*="border-left:3px solid"] { border-left: 0 !important; padding-left: 0 !important; }
.manual-live h1 { font-size: var(--fs-h1s); margin-bottom: 10px; }
.manual-live h2 { font-size: var(--fs-h2); margin: var(--s5) 0 10px; }
.manual-live h3 { font-size: var(--fs-lg); margin: 14px 0 6px; }
.manual-live p { margin: 0 0 10px; }
.manual-live code { font-family: var(--font-mono); font-size: max(.86em, var(--fs-xs)); background: var(--surface-3); padding: .1em .35em; border-radius: var(--r-xs); }
.manual-live table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
.manual-live th, .manual-live td { border: var(--hairline) solid var(--line); padding: var(--s2) 10px; text-align: left; vertical-align: top; }
.manual-live [data-ext] { color: var(--blue); text-decoration: underline; text-underline-offset: 3px; cursor: default; }
.manual-live > div { max-width: 100%; }
.manual-live * { max-width: 100%; }

/* ---------- Party ---------- */
/* ---------- Observability ---------- */
.mosaic { display: grid; gap: 14px; }
.mos-row { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--s4); align-items: center; }
.mos-row .name { font-size: var(--fs-sm); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mos-row .name b { font: 600 var(--fs-xs)/1 var(--font-mono); color: var(--violet); margin-right: 6px; }
.tiles { display: flex; flex-wrap: wrap; gap: 5px; }
.tile { width: 26px; height: 26px; border-radius: var(--r-xs); border: 0; padding: 0; background: color-mix(in srgb, var(--tone) 70%, var(--surface-3)); }
@media (hover: hover) { .tile:hover, .tile:focus-visible { transform: scale(1.15); } }
.tile[data-tone="slate"] { background: var(--surface-3); box-shadow: inset 0 0 0 var(--hairline) var(--line-strong); }

/* ---------- Commands ---------- */
.mode-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--s2); }
.mode { display: grid; gap: var(--s1); text-align: left; padding: var(--s3) 14px; border-radius: var(--r); border: var(--hairline) solid var(--line-strong); background: var(--surface); color: inherit; }
.mode b { font-size: var(--fs-md); }
.mode small { font-size: var(--fs-xs); color: var(--text-3); line-height: 1.4; }
.mode[aria-pressed="true"] { border-color: var(--violet); background: color-mix(in srgb, var(--violet) var(--tint), var(--surface)); box-shadow: inset 0 0 0 var(--hairline) var(--violet); }

/* ---------- Logros ---------- */
.guild-hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s6); align-items: center; padding: var(--s6); border-radius: var(--r-xl); margin-bottom: var(--s6);
  background: radial-gradient(100% 160% at 0% 0%, color-mix(in srgb, var(--gold) 20%, var(--surface)), var(--surface) 60%); border: var(--hairline) solid color-mix(in srgb, var(--gold) 30%, var(--line)); }
.crest-xl { display: grid; place-items: center; width: 96px; height: 96px; border-radius: var(--r-2xl); background: conic-gradient(from 210deg, color-mix(in srgb, var(--gold) 70%, transparent), color-mix(in srgb, var(--amber) 35%, transparent), color-mix(in srgb, var(--gold) 70%, transparent)); color: var(--primary-fg); box-shadow: 0 10px 30px color-mix(in srgb, var(--gold) 30%, transparent); }
.crest-xl span { display: grid; place-items: center; width: 80px; height: 80px; border-radius: var(--r-xl); background: var(--surface); color: var(--gold); font: 800 var(--fs-h1)/1 var(--font-display); }
.trophies { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--s3); }
.trophy { display: grid; gap: var(--s2); align-content: start; padding: var(--s4); border-radius: var(--r-lg); background: var(--surface); border: var(--hairline) solid color-mix(in srgb, var(--tone) 35%, var(--line)); text-align: left; color: inherit; }
.trophy .ticon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: var(--r); color: var(--tone); background: color-mix(in srgb, var(--tone) var(--tint-strong), transparent); }
.trophy.locked { border-style: dashed; border-color: var(--line-strong); }
.trophy.locked .ticon { color: var(--text-3); background: var(--surface-2); }
.trophy b { font: 700 var(--fs-md)/1.3 var(--font-display); }
.trophy small { font-size: var(--fs-xs); color: var(--text-3); line-height: 1.4; }
.ladder { display: grid; gap: var(--s2); }
.rung { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s4); align-items: center; padding: var(--s3) var(--s4); border-radius: var(--r); background: var(--surface); border: var(--hairline) solid var(--line); }
.rung.current { border-color: var(--gold); background: color-mix(in srgb, var(--gold) var(--tint), var(--surface)); }
.rung.locked { border-style: dashed; }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chain .node { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--r-pill); font-size: var(--fs-xs); background: var(--surface-2); color: var(--text-3); border: var(--hairline) solid var(--line); }
.chain .node.done { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); background: color-mix(in srgb, var(--green) var(--tint), transparent); }
.chain .node.now { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 50%, transparent); }

/* ---------- Dialog & toast ---------- */
dialog { width: min(680px, calc(100vw - 32px)); max-height: min(84dvh, 860px); padding: 0; border: var(--hairline) solid var(--line-strong); border-radius: var(--r-xl); background: var(--surface); color: var(--text); box-shadow: var(--shadow-dialog); }
dialog::backdrop { background: var(--backdrop); backdrop-filter: blur(3px); }
dialog .dhead { position: sticky; top: 0; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s5); background: color-mix(in srgb, var(--tone, var(--slate)) var(--tint), var(--surface)); border-bottom: var(--hairline) solid color-mix(in srgb, var(--tone, var(--line)) 30%, var(--line)); }
dialog .dtitle { display: grid; gap: var(--s1); min-width: 0; padding-top: var(--s1); }
dialog .dkicker { margin: 0; font: 700 var(--fs-xs)/1.2 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--tone, var(--text-3)); }
dialog #dlg-title { margin: 0; font-family: var(--font-display); overflow-wrap: anywhere; }
dialog .dbody .eyebrow { color: color-mix(in srgb, var(--tone, var(--slate)) 70%, var(--text-2)); font-family: var(--font-mono); }
dialog .dsheet .brow { grid-template-columns: 128px minmax(0, 1fr); gap: var(--s4); }
dialog .dsheet .brow:first-child { border-top: 0; padding-top: 0; }
dialog .dsheet .brow-body { font-size: var(--fs-md); }
dialog .dbody { padding: var(--s5); display: grid; gap: var(--s4); }
dialog[open] { animation: pop 180ms var(--ease); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.toast { position: fixed; left: 50%; bottom: var(--s6); transform: translateX(-50%); z-index: 90; display: flex; align-items: center; gap: 10px; padding: var(--s3) var(--s4); border-radius: var(--r); background: var(--primary-bg); color: var(--primary-fg); font-size: var(--fs-md); font-weight: 600; box-shadow: var(--shadow-toast); }

/* ---------- Responsive ---------- */
@media (max-width: 1279px) {
  .spec-layout { grid-template-columns: minmax(0, 1fr); }
  .toc { display: none; }
  .wo-detail-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 1179px) {
  .app { grid-template-columns: var(--rail) minmax(0, 1fr); }
  .sidebar { padding: var(--s3) var(--s2); align-items: stretch; }
  .brand { justify-content: center; padding: 6px 0; }
  .brand > div, .navlabel span, .navitem .lbl, .navitem .count, .projnav .navitem .meta, .guildcard .gtext { display: none; }
  .navlabel { justify-content: center; padding: var(--s2) 0 var(--s1); }
  .navlabel::after { content: ""; width: 24px; height: var(--hairline); background: var(--line-strong); }
  .navitem { justify-content: center; padding: 0; min-height: 46px; flex-direction: column; gap: 3px; }
  .navitem .mini { display: block; font-size: var(--fs-xs); font-weight: 600; letter-spacing: -.01em; }
  .guildcard { padding: var(--s2); display: grid; place-items: center; }
  .guildcard .bar { width: 40px; }
  .page, .foot { padding-left: var(--s6); padding-right: var(--s6); }
  .home-grid { grid-template-columns: minmax(0, 1fr); }
  .reader { grid-template-columns: minmax(0, 1fr) 240px; gap: var(--s4); }
  .paper { padding: var(--s6); }
  .wo-kanban { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 1180px) { .navitem .mini { display: none; } }
@media (max-width: 899px) {
  .reader { grid-template-columns: minmax(0, 1fr); }
  .reader .doc-index, .idocs .idocs-rail { order: -1; }
  .index-toggle { display: inline-flex; width: 100%; justify-content: space-between; }
  .doc-index { position: static; max-height: none; display: none; padding: var(--s3); border: var(--hairline) solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
  .doc-index[data-open="true"] { display: grid; }
  .doc-index .field { background: var(--surface); }
  .blocks { grid-template-columns: minmax(0, 1fr); }
  .block.wide .md ul { columns: 1; }
  .frd-row > summary { grid-template-columns: auto minmax(0, 1fr) auto; }
  .frd-row > summary .stackbar { grid-column: 2 / -1; grid-row: 2; }
  .frd-row > summary .fpct { display: none; }
  .mos-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .guild-hero { grid-template-columns: auto minmax(0, 1fr); }
  .guild-hero > :last-child { grid-column: 1 / -1; }
}
@media (max-width: 759px) {
  body { font-size: var(--fs-base); }
  h1 { font-size: var(--fs-h1s); }
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; z-index: 70; top: 0; left: 0; bottom: 0; width: min(300px, 86vw); height: 100dvh; transform: translateX(-105%);

/* ---------- Board: one horizontal pipeline at every width ---------- */
/* Columns stay side by side (Jira and Trello on phones swipe between columns); the scroller snaps to
   each column and a phase selector jumps straight to one. Cards never move by drag: a column is the
