const icons={arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',bolt:'<path d="m13 2-8 12h7l-1 8 8-12h-7z"/>',check:'<path d="m5 12 4 4L19 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',flag:'<path d="M5 21V3m0 0h14l-3 5 3 5H5"/>',copy:'<rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V3H3v12h5"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',star:'<path d="m12 3 3 6 6 1-4.5 4.5 1 6.5-5.5-3-5.5 3 1-6.5L3 10l6-1z"/>',book:'<path d="M12 5C8 2 4 3 3 4v16c3-2 6-2 9 0 3-2 6-2 9 0V4c-3-2-6-2-9 1v15"/>',cube:'<path d="m12 3 9 5v9l-9 5-9-5V8l9-5zm0 9 9-4m-9 4L3 8m9 4v10"/>',spark:'<path d="m12 3 2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6z"/>',settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'};
const ico=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.cube}</svg>`;
const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
const btn=(t,act,primary=false)=>`<button type="button" class="btn ${primary?'primary':''}" data-action="${act}">${t}</button>`;
const cmd=t=>`<div class="command">${ico('bolt')}<code>${t}</code><button type="button" class="iconbtn" data-copy="${t}" aria-label="Copiar ${t}">${ico('copy')}</button></div>`;
const routes=[['inicio','Inicio'],['tablero','Tablero'],['portfolio','Portfolio'],['propuestas','Propuestas'],['logros','Logros'],['documentacion','Documentación']];
const titles={...Object.fromEntries(routes),configuracion:'Configuración',idea:'PandaSaga'};
let selectedIdeaName='PandaSaga',selectedIdeaPurpose='Recuerda historias y descubre sus conexiones.';
let page='inicio',tab='Resumen',obs='Línea de tiempo',model='Diagrama',openDialogTrigger;
const head=(title,subtitle,action='')=>`<div class="pagehead"><div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`;
const section=(title,content,action='')=>`<section class="panel"><div class="row between sectiontitle"><h2>${title}</h2>${action}</div>${content}</section>`;
const event=(title,sub,time)=>`<div class="event"><div class="row between"><strong>${title}</strong><small class="muted">${time}</small></div><p>${sub}</p></div>`;
const project=(initial,name,sub,status,progress)=>`<a class="projectrow" style="display:block" href="#portfolio"><div class="projectline"><div class="projectavatar">${initial}</div><div><strong>${name}</strong><p class="small">${sub}</p>${progress!==null?`<div class="track"><span style="width:${progress}%"></span></div>`:''}</div>${pill(status,status==='Lanzado'?'green':'')}</div></a>`;
function home(){return head('Inicio','Lo que necesita tu atención. Lo que sigue avanzando.',pill('Lectura local','green'))+`<div class="homegrid"><div class="stack">${section('Tu turno',[
['flag','2 decisiones pendientes','Revisa los puntos que requieren tu aprobación.','Revisar','decisiones','amber'],
['spark','Revisar lanzamiento','PersonalPage v2 · contrasta resultados e hipótesis.','Ver proyecto','portfolio',''],
['book','Cosechar memoria','Notas del taller pendientes de refinar.','Ver propuestas','propuestas',''],
['cube','5 ideas sin priorizar','Decide cuál merece dar el siguiente paso.','Ver tablero','tablero','']].map(([i,t,s,b,a,c])=>`<div class="turnrow"><div class="iconbox ${c}">${ico(i)}</div><div><h3>${t}</h3><p>${s}</p></div>${btn(b,a,a==='decisiones')}</div>`).join(''),pill('4 pendientes','amber'))}${section('Construcción y cartera',project('MC','Mission Control','Implementación · 109 de 110 work orders','En pausa',99)+project('P','PersonalPage v2','Release · v1','Lanzado',100)+project('PS','PandaSaga','Arquitectura · especificación y modelo','En diseño',null),'<a class="link small" href="#portfolio">Portfolio '+ico('arrow')+'</a>')}</div><div class="stack">${section('Pulso de la fábrica',`<div class="pulse"><div><div class="number">5</div><small>Ideas</small></div><div><div class="number">3</div><small>Arquitectura</small></div><div><div class="number">1</div><small>Lanzado</small></div></div><div class="divider" style="padding-top:var(--s4)"><p class="small">Del descubrimiento al lanzamiento. Cada fase conserva su estado real.</p></div>`)}${section('Desde tu última visita',`<div id="events">${event('StopGate','architecture','18 min')}${event('StopGate','architecture','21 min')}${event('StopGate','pandasaga','5 h')}</div><details style="margin-top:var(--s4)"><summary class="link small">Ver el resto de la actividad</summary>${event('StopGate','architecture','6 h')}${event('StopGate','pandasaga','6 h')}<p class="preview-note">Muestra abreviada de la lista; la aplicación conservará todos los eventos que muestra hoy.</p></details><div class="row between divider" style="margin-top:var(--s4);padding-top:var(--s3)"><span class="small muted" id="unseen">142 nuevos</span>${btn('Marcar visto','seen')}</div>`)}<details class="notice"><summary>${ico('shield')}Plugin por actualizar</summary><p class="small">Instalado v9.128.0 · disponible v9.129.0. Codex: estado desconocido. Actualiza y reinicia la sesión.</p>${cmd('claude plugin update pandacorp@panda-corp')}</details></div></div>`}
const ideas=[['PandaLearn','El tutor IA que se adapta a quién eres','web','mixto','60','Investigación'],['PandaScript','De tu colección a un guion de TikTok','ai','mixto','70','Investigación'],['SpecPilot','Genera y valida especificaciones para builders de IA','Claude Code','monetario','78','Investigación'],['PandaSaga','Recuerda historias y descubre sus conexiones','ai','personal','72','Arquitectura'],['Funko Tracker','Catálogo y tracker con checklists compartibles','web','mixto','77','Arquitectura'],['PandaCast','Publica en TikTok, aparece en todas partes','web','personal','—','Arquitectura'],['Mission Control','Tu fábrica de software, de un vistazo','web','personal','—','Construcción'],['PersonalPage v2','La presencia profesional de Toshio','web','oportunidad','—','Release']];
function ideaCard(i){return `<article class="idea" data-idea="${(i[0]+' '+i[1]).toLowerCase()}" data-category="${i[2]}"><button type="button" class="star" aria-label="Marcar ${i[0]} como favorita en esta demo" aria-pressed="false" data-action="favorite">${ico('star')}</button><a href="#idea" data-idea-name="${i[0]}" data-idea-purpose="${i[1]}">${i[0]}</a><p class="desc">${i[1]}</p><div class="meta">${pill(i[2])}${pill(i[3],'lilac')}<span class="spacer"></span><span class="muted">${i[4]==='—'?'Sin score':i[4]+' / 100'}</span></div></article>`}
function board(){return head('Tablero','Tus ideas, desde la primera chispa hasta el lanzamiento.',btn('+ Capturar ideas','capture',true))+`<div class="toolbar"><label class="field">${ico('search')}<input id="idea-search" aria-label="Buscar ideas" placeholder="Buscar ideas…"></label><label class="field"><select id="idea-category" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option><option>web</option><option>ai</option><option>Claude Code</option></select></label><span class="spacer"></span>${btn('Ver descartadas (12)','discarded')}</div><div class="board">${['Investigación','Producto','Diseño','Arquitectura','Construcción','Release'].map((name,n)=>`<section class="column"><h2 class="row between colhead"><span><span class="muted">${n+1} · </span>${name}</span>${pill(ideas.filter(x=>x[5]===name).length)}</h2>${ideas.filter(x=>x[5]===name).map(ideaCard).join('')||'<div class="empty small">Sin ideas en esta fase</div>'}</section>`).join('')}</div><p class="preview-note">Las fases las actualizan los skills. Favoritos, búsqueda y detalles se simulan en esta propuesta.</p>`}
const tabs=['Resumen','Spec','Work orders','Arquitectura','Cambios','Party','Observabilidad','Documentos','Comandos'];
const tabbar=(items,active,kind='tab')=>`<div class="tabbar" aria-label="${kind==='tab'?'Secciones del proyecto':'Secciones de la vista'}">${items.map(t=>`<button type="button" aria-pressed="${t===active}" data-${kind}="${t}">${t}</button>`).join('')}</div>`;
function portfolio(){return head('Portfolio','Proyectos, decisiones y avance en un mismo espacio.')+`<div class="projectselect field"><label for="project">Proyecto</label><select id="project"><option>Mission Control</option><option>PersonalPage v2</option></select></div><div class="workspace"><aside class="rail"><span class="eyebrow">Proyectos</span><a class="selected" href="#portfolio">Mission Control<p class="small">Implementación · en pausa</p></a><a href="#portfolio" data-action="otherproject">PersonalPage v2<p class="small">Release · lanzado</p></a></aside><div><div class="subhead"><div class="projectavatar">MC</div><h2>Mission Control</h2>${pill('Implementación','lilac')}<div class="progress"><small class="muted">109 / 110 work orders · 99%</small><div class="track"><span style="width:99%"></span></div></div></div>${tabbar(tabs,tab)}${workspaceBody(tab)}</div></div>`}
function architecture(){return `<div class="stack">${section('Stack',`<div class="row wrap">${pill('Next.js')}${pill('React')}${pill('TypeScript')}${pill('Tailwind')}</div><p class="small" style="margin-top:var(--s3)">Tecnologías y decisiones de arquitectura en bloques fáciles de recorrer.</p>`)}${section('Integraciones y operación',`<div class="twocol"><div><h3>Archivos del proyecto</h3><p class="small">Lectura local de documentos y estado.</p></div><div><h3>Actualización en vivo</h3><p class="small">Eventos y señales de frescura, sin ejecutar agentes.</p></div></div>`)}${section('Modelo de datos',`<p class="small">Modelo ilustrativo para evaluar el diseño. Mission Control declara que no usa una base de datos.</p>${tabbar(['Diagrama','Esquema'],model,'model')}${model==='Diagrama'?`<div class="graph"><div class="row between sectiontitle"><span class="small muted">Modelo diseñado · ejemplo</span>${btn('Ampliar','expand-model')}</div><div class="entities"><div class="entity"><h3>Project</h3><div>id <span class="muted">string · PK</span></div><div>name <span class="muted">string</span></div><div>phase <span class="muted">enum</span></div></div><div class="relationship">1 ─── 0..*</div><div class="entity"><h3>WorkOrder</h3><div>id <span class="muted">string · PK</span></div><div>projectId <span class="muted">string · FK</span></div><div>state <span class="muted">enum</span></div></div></div></div>`:`<details class="accordion"><summary>Project · 3 atributos</summary><code>id string @id<br>name string<br>phase enum</code></details><details class="accordion"><summary>WorkOrder · 3 atributos</summary><code>id string @id<br>projectId string @relation(Project)<br>state enum</code></details>`}`)}${section('Decisiones y plan',`<details class="accordion"><summary>Variables de entorno</summary><p>Tabla de variables documentadas, con los valores sensibles ocultos.</p></details><details class="accordion"><summary>Decisiones de arquitectura</summary><p>ADRs y su razonamiento, con enlaces al documento completo.</p></details><details class="accordion"><summary>Plan de implementación</summary><p>El mapa de dependencias conserva selección, trazado y expansión.</p></details>`)}</div>`}
function visualWorkOrders(){const columns=[['Planificado','', [['WO-04-005','Pulir estados vacíos','FRD-04 · Workspace']]],['En curso','lilac',[['WO-13-002','Unificar componentes','FRD-13 · Sistema visual']]],['En revisión','amber',[['WO-02-007','Detalle de una idea','FRD-02 · Tablero']]],['Verificado','green',[['WO-01-003','Lectura de ideas','FRD-01 · Datos'],['WO-04-004','Navegación del proyecto','FRD-04 · Workspace']]]];return `<div class="toolbar"><label class="field"><select aria-label="Filtrar por FRD"><option>Todos los FRDs</option><option>FRD-04 · Workspace</option></select></label><span class="small muted">Ejemplo de los cuatro estados · abre una orden para ver su detalle</span></div><div class="board" style="grid-template-columns:repeat(4,minmax(230px,1fr))">${columns.map(([title,tone,items])=>`<section class="column"><h2 class="colhead row between">${title}${pill(items.length,tone)}</h2>${items.map(([id,title,frd])=>`<button type="button" class="idea" style="width:100%;text-align:left" data-action="wo"><span class="mono muted">${id}</span><h3 style="margin:var(--s3) 0">${title}</h3><p class="small">${frd}</p></button>`).join('')}</section>`).join('')}</div>`}
function visualChanges(){return `<div class="stack">${section('Listos',`<button type="button" class="listrow" data-action="change"><span class="iconbox">${ico('check')}</span><div><strong>Mejorar lectura del resumen</strong><p>change · normal · muestra visual</p></div>${pill('Listo','lilac')}${ico('arrow')}</button><button type="button" class="listrow" data-action="change"><span class="iconbox">${ico('book')}</span><div><strong>Aclarar las etiquetas del proyecto</strong><p>change · normal · muestra visual</p></div>${ico('arrow')}</button>`)}${section('Borradores',`<button type="button" class="listrow" data-action="change"><div><strong>Explorar una nueva composición para Logros</strong><p>Pendiente de elegir una dirección visual</p></div>${pill('Borrador')}${ico('arrow')}</button>`)}<details class="accordion"><summary>Hechos y descartados</summary><div class="listrow"><span class="ok">${ico('check')}</span><div><strong>Conservar el proyecto al navegar</strong><p>Hecho · ejemplo de historial</p></div></div></details></div>`}
function visualStats(){return `<div class="stack"><div class="stats">${[['WO / semana','12','+3 frente a la anterior'],['Proyectos activos','4','en distintas fases'],['Conversión','5%','idea → lanzamiento'],['Tiempo a release','—','sin dato disponible']].map(([name,note,sub])=>`<div class="stat"><span class="small muted">${name}</span><div class="number">${note}</div><small>${sub}</small></div>`).join('')}</div><div class="twocol">${section('Avance en el tiempo',`<p class="small sectiontitle">Work orders verificados · ejemplo de cuatro semanas</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4);align-items:end;height:150px" role="img" aria-label="Ejemplo: 5, 8, 9 y 12 work orders por semana">${[[5,'S1'],[8,'S2'],[9,'S3'],[12,'S4']].map(([n,label])=>`<div style="text-align:center"><span class="small">${n}</span><div style="height:${n*8}px;background:var(--accent);border-radius:var(--r1);margin:var(--s2) 0"></div><span class="small muted">${label}</span></div>`).join('')}</div>`)}${section('Embudo de ideas',`<div class="stack">${[['Descubiertas',22,100],['En proyecto',5,65],['Lanzadas',1,30]].map(([name,n,w])=>`<div><div class="row between"><strong>${name}</strong><span>${n}</span></div><div class="track" style="margin-top:var(--s2)"><span style="width:${w}%"></span></div></div>`).join('')}</div>`)}</div>${section('Qué mover ahora',`<div class="listrow"><span class="iconbox amber">${ico('flag')}</span><div><strong>Revisar el lanzamiento de PersonalPage</strong><p>Contrasta la hipótesis de valor con resultados reales.</p></div></div>${cmd('/pandacorp:review-launch')}`)}<p class="preview-note">Datos de muestra para entender la composición. No son métricas actuales.</p></div>`}

function workspaceBody(t){if(t==='Work orders')return visualWorkOrders();if(t==='Cambios')return visualChanges();switch(t){case'Resumen':return `<div class="stack">${section('Estado del proyecto',`<div class="row between wrap"><div class="row">${ico('clock')}<strong>Construcción en pausa</strong></div>${pill('Lectura del último estado')}</div><p style="margin-top:var(--s3)">La interfaz de tu fábrica: ideas, proyectos, agentes y documentación, en un solo lugar.</p>`)}<div class="twocol">${section('Último punto verificable',`<div class="row">${ico('shield')}<strong>Última versión verificada</strong></div><p class="small" style="margin-top:var(--s2)">Commit registrado · comprueba su fecha antes de probar.</p>${cmd('git worktree add ../review-mc &lt;sha-verificado&gt;')}`)}${section('Decisiones',`<p>Sin puntos pendientes en este proyecto.</p><p class="small" style="margin-top:var(--s3)">Pendientes de merge: ninguno en esta muestra.</p>`)}</div>${section('Resumen',`<div class="prose"><h3>Una cabina para toda la fábrica</h3><p>Ver el estado de cada idea y proyecto, entender qué viene después y seguir el trabajo del equipo de agentes.</p><details class="accordion"><summary>Leer el contexto completo</summary><p>El contenido completo del resumen, sus puntos clave, evidencias y notas conserva su lugar en esta sección.</p></details></div>`)}${section('Actividad',event('Actualización de navegación','Proyecto y sección conservados en la URL.','Hoy'))}</div>`;case'Spec':return section('Especificación',`<div class="prose"><span class="eyebrow">Producto · documentación</span><h3>Problema y propuesta de valor</h3><p>Una vista clara para operar la fábrica y consultar lo que se está construyendo.</p><h3>Alcance y requisitos</h3><p>El resumen conserva PRD, research y todos los FRDs publicados, con sus enlaces a los documentos originales.</p></div><details class="accordion"><summary>Objetivos y métricas</summary><p>La hipótesis de valor y sus señales de éxito.</p></details><details class="accordion"><summary>Funcionalidades · FRDs</summary><p>Lista completa, contada desde los documentos reales.</p></details>`);case'Arquitectura':return architecture();case'Work orders':return `${'<div class="toolbar"><label class="field"><select aria-label="Filtrar por FRD"><option>Todos los FRDs</option><option>FRD-04 · Workspace</option></select></label><label class="field"><select aria-label="Filtrar por estado"><option>Todos los estados</option><option>Verificado</option></select></label></div>'}<div class="twocol">${section('Planificado',`<div class="empty">Una orden pendiente</div>`)}${section('Verificado',`<button class="listrow" data-action="wo"><span class="ok">${ico('check')}</span><div><strong>WO-04-004 · Workspace</strong><p>FRD-04 · contrato y evidencia</p></div>${ico('arrow')}</button><button class="listrow" data-action="wo"><span class="ok">${ico('check')}</span><div><strong>WO-02-007 · Detalle de idea</strong><p>FRD-02 · contrato y evidencia</p></div>${ico('arrow')}</button>`)}</div><p class="preview-note">Composición ilustrativa: el tablero final conserva los cuatro estados, todos los FRDs y sus documentos.</p>`;case'Cambios':return section('Cola de cambios',`<p class="small">Los estados del build permanecen visibles y los históricos se consultan bajo demanda.</p><details class="accordion" open><summary>Listos</summary><p>No hay cambios listos en esta muestra.</p></details><details class="accordion"><summary>Borradores</summary><p>Cambios que aún necesitan definición.</p></details><details class="accordion"><summary>Hechos y descartados</summary><p>Historial completo, detalle, comando y acción de descarte existente.</p></details>`);case'Party':return `<div class="stack">${section('La Fragua',`<div class="row between sectiontitle"><span class="small muted">Equipo en reposo · muestra</span>${pill('En pausa')}</div><div class="scene" tabindex="0" role="region" aria-label="Escena de La Fragua"><div class="sceneinner"><div class="line"></div>${[['architect','Arquitectura'],['frontend-dev','Frontend'],['backend-dev','Backend'],['reviewer','Revisión']].map(([a,n])=>`<div class="zone"><img class="agent" src="assets/${a}.png" alt=""><div><strong>${n}</strong><small class="muted">En reposo</small></div></div>`).join('')}</div></div><p class="preview-note">La escena conserva sus zonas, sprites, gates, cola y campamento. No se añaden controles de ejecución.</p>`)}${section('Bitácora',event('Sin construcción activa','Los últimos eventos se mantienen como histórico.','—'))}</div>`;case'Observabilidad':return `${tabbar(['Línea de tiempo','DAG'],obs,'obs')}${section(obs,obs==='DAG'?`<div class="graph"><div class="entities"><div class="entity"><h3>WO-01 · Datos</h3><div class="ok">✓ Verificado</div></div><span class="relationship">────→</span><div class="entity"><h3>WO-04 · Workspace</h3><div class="ok">✓ Verificado</div></div></div></div>`:`<div class="stack">${event('Lectura de datos','Inicio → verificación · duración desde el registro','FRD-01')}${event('Workspace','Inicio → revisión → verificación','FRD-04')}</div>`)}<p class="preview-note">Vista esquemática. La línea de tiempo final usa las duraciones reales y el DAG conserva sus controles actuales.</p>`;case'Documentos':return reader(false);case'Comandos':return section('Comandos',`<h3>Modo de construcción</h3><p class="small" style="margin:var(--s2) 0 var(--s4)">El modo modifica el comando a copiar; se recuerda por proyecto.</p><label class="field">Modo <select id="build-mode"><option value="">Equilibrado</option><option value="--mode pro">Pro</option><option value="--mode powerful">Potente</option><option value="--mode deep">Profundo</option></select></label><div id="mode-command">${cmd('/pandacorp:implement')}</div><h3 style="margin-top:var(--s6)">A la mano</h3>${cmd('/pandacorp:change')}${cmd('/pandacorp:decide')}<p class="preview-note">Comandos de muestra. La aplicación conserva el catálogo y flags canónicos, incluidas las variantes por FRD y change.</p>`);default:return''}}
function proposals(){return head('Propuestas','Lo que la fábrica propone mejorar. Tú decides el siguiente paso.')+tabbar(['Memoria','Backlog'],tab==='Backlog'?'Backlog':'Memoria','section')+(tab==='Backlog'?section('Backlog de la fábrica',`<div class="row between sectiontitle">${pill('65 abiertos')}<span class="small muted">Prioridad → identificador</span></div>${['Consolidar señales de estado','Revisar el flujo de documentación','Reducir duplicación en contratos'].map((x,i)=>`<button class="listrow" data-action="backlog"><span class="mono muted">BL · ${i+1}</span><div><strong>${x}</strong><p>Ejemplo visual · abierto</p></div>${ico('arrow')}</button>`).join('')}<details class="accordion"><summary>Ver hechos y descartados</summary><p>El historial sigue accesible.</p></details>${cmd('/pandacorp:implement-backlog')}`):`<div class="stats">${[['Notas sin refinar','1001','pendientes de cosecha'],['Candidatas','250','esperan corroboración'],['Promociones','11','listas para revisar'],['Última cosecha','15 oct','2026 · fecha absoluta']].map(([a,b,c])=>`<div class="stat"><span class="small muted">${a}</span><div class="number">${b}</div><small>${c}</small></div>`).join('')}</div><div class="homegrid">${section('Lecciones candidatas',`<div class="stack">${['Un único prototipo canónico evita referencias cruzadas','Un modelo de datos debe indicar su fuente','Un cambio debe conservar su contexto'].map((x,i)=>`<button class="listrow" data-action="lesson"><span class="iconbox">${ico('book')}</span><div><strong>${x}</strong><p>Ejemplo · esperando corroboración</p></div>${ico('arrow')}</button>`).join('')}</div>${cmd('/pandacorp:memory review')}`)}<div class="stack">${section('Siguiente paso',`<p>Refinar notas del taller antes de promover conocimiento.</p>${cmd('/pandacorp:memory harvest')}`)}${section('Promociones y poda',`<p>Los streams conservan detalle, ocultar, ver más y comandos de revisión.</p><button class="link" data-action="lesson">Ver una propuesta ${ico('arrow')}</button>`)}</div></div>`)}
function achievements(){if(tab==='Estadísticas')return head('Logros','El progreso que has construido, con evidencia detrás.')+tabbar(['Resumen','Misiones','Trofeos','Estadísticas','Rangos'],tab,'section')+visualStats();const active=['Resumen','Misiones','Trofeos','Estadísticas','Rangos'].includes(tab)?tab:'Resumen';return head('Logros','El progreso que has construido, con evidencia detrás.')+tabbar(['Resumen','Misiones','Trofeos','Estadísticas','Rangos'],active,'section')+(active==='Resumen'?`<div class="stack"><section class="panel hero"><div class="medal">20</div><div class="spacer"><span class="eyebrow">Gremio Pandacorp · nivel 20</span><h2>Portador de Luz II</h2><p>31 hazañas · 19 de 82 trofeos</p><div class="track"><span style="width:40%"></span></div><small class="muted">1930 / 2040 XP · 110 para el siguiente nivel</small></div></section><div class="twocol">${section('Próximas hazañas',`<div class="stack"><div><div class="row between"><strong>El fordismo digital</strong><span class="small muted">52%</span></div><p class="small">Work orders completados</p><div class="track" style="margin-top:var(--s3)"><span style="width:52%"></span></div></div><div><div class="row between"><strong>Cirujano de ideas</strong><span class="small muted">46%</span></div><p class="small">Ideas descartadas</p><div class="track" style="margin-top:var(--s3)"><span style="width:46%"></span></div></div></div>`)}${section('Vitrina del gremio',`<div class="row trophy"><span class="iconbox amber">${ico('flag')}</span><div><strong>El primer ladrillo</strong><p class="small">PersonalPage v2 · 7 oct 2026</p></div></div><div class="row trophy"><span class="iconbox">${ico('cube')}</span><div><strong>El blueprintero</strong><p class="small">Tu arquitectura tomó forma</p></div></div>`)}</div></div>`:active==='Rangos'?section('Rangos',`<div class="stack">${['Buscador del Alba','Portador de Luz II · tu rango','Guardián del Éter'].map((x,i)=>`<div class="listrow"><span class="iconbox ${i===1?'':'amber'}">${ico('shield')}</span><div><strong>${x}</strong><p>${i===1?'Alcanzado · nivel actual':'Escala ilustrativa · consulta requisitos'}</p></div></div>`).join('')}</div>`):section(active,`<div class="stack">${active==='Estadísticas'?'<div class="row pulse"><div><div class="number">1</div><small>Lanzado</small></div><div><div class="number">31</div><small>Hazañas</small></div></div><p>Informe, categorías, fuentes y sellos de frescura mantienen su contenido.</p>':`<div class="toolbar">${btn('Todos','category')}${btn('Descubrimiento','category')}${btn('Calidad','category')}</div><div class="trophy"><span class="iconbox amber">${ico('flag')}</span><div><strong>${active==='Misiones'?'La aventura continúa':'El primer ladrillo'}</strong><p>Progreso, requisitos, rareza y fecha permanecen visibles.</p></div></div><details class="accordion"><summary>Secretos y próximos desbloqueos</summary><p>Las revelaciones son accesibles con toque y teclado.</p></details>`}</div>`))}
function reader(manual){return `<button class="btn outline mobile-index" data-action="index" aria-controls="doc-index" aria-expanded="false">${ico('book')}Abrir índice</button><div class="readlayout"><nav id="doc-index" aria-label="Índice de documentos"><span class="eyebrow">${manual?'Empezar aquí':'Proyecto'}</span>${[manual?'Qué es Pandacorp':'Resumen del proyecto',manual?'Cómo empezar':'PRD',manual?'Cómo pedir un cambio':'Research'].map((t,i)=>`<button type="button" data-doc="${t}" aria-pressed="${i===0}">${t}</button>`).join('')}<span class="eyebrow">${manual?'Guías y conceptos':'Features'}</span>${['El pipeline','El equipo','Arquitectura','Estado y archivos','Servicios y secretos','URLs persistentes'].map(t=>`<button type="button" data-doc="${t}" aria-pressed="false">${t}</button>`).join('')}<span class="eyebrow">Referencia</span><button data-doc="Comandos" aria-pressed="false">Comandos</button><button data-doc="Agentes" aria-pressed="false">Agentes</button><button data-doc="Reglas y estándares" aria-pressed="false">Reglas y estándares</button></nav><article class="prose" id="article"><span class="eyebrow">${manual?'Conceptos · Pandacorp':'Documentos · Proyecto'}</span><h2>${manual?'Qué es Pandacorp':'Resumen del proyecto'}</h2><p>Operas una fábrica de software hecha 100% con IA. Tú traes ideas o problemas; un equipo de agentes los investiga, documenta, diseña, arquitecta y construye como aplicaciones reales.</p><h3>De una idea a un producto</h3><p>Cada etapa deja documentos que puedes revisar y una siguiente acción clara. Mission Control te permite consultar el estado y copiar el comando que necesitas.</p><div class="panel" style="margin:var(--s6) 0"><span class="eyebrow">El recorrido</span><p style="margin:var(--s3) 0 0">Explorar → Producto → Diseño → Arquitectura → Construcción → Release</p></div><h3>Tú eliges el rumbo</h3><p>La interfaz muestra los hechos del proyecto, conserva sus documentos y te ayuda a encontrar lo importante.</p>${cmd('/pandacorp:change')}<p class="preview-note">Contenido abreviado para la propuesta; el Manual final conserva todas sus guías, conceptos, workflows y referencias.</p></article></div>`}
function configuration(){const active=['Habilidades','Agentes','Reglas de decisión','Estándares'].includes(tab)?tab:'Habilidades';return head('Configuración','Las capacidades y reglas de tu fábrica, a la vista.')+tabbar(['Habilidades','Agentes','Reglas de decisión','Estándares'],active,'section')+(active==='Agentes'?section('Equipo de agentes',`<div class="twocol">${[['architect','Arquitecto'],['designer','Diseñador'],['frontend-dev','Frontend'],['backend-dev','Backend'],['reviewer','Reviewer'],['test-writer','Tests']].map(([a,t])=>`<button type="button" class="listrow" data-action="agent"><img class="agent" src="assets/${a}.png" alt=""><div><strong>${t}</strong><p>Rol, modelo, nivel y habilidades relacionadas</p></div>${ico('arrow')}</button>`).join('')}</div>`):section(active,`<div class="stack">${(active==='Habilidades'?['/pandacorp:explore','/pandacorp:spec','/pandacorp:design','/pandacorp:architecture','/pandacorp:change']:active==='Reglas de decisión'?['Decisiones humanas','Documentación y trazabilidad','Una fuente de verdad']:['Accesibilidad','Calidad y pruebas','Convenciones de código']).map(t=>`<button type="button" class="listrow" data-action="reference"><span class="iconbox">${ico(active==='Habilidades'?'bolt':'shield')}</span><div><strong>${t}</strong><p>Resumen breve; abre el detalle para leer la definición completa.</p></div>${ico('arrow')}</button>`).join('')}</div>`))}
function idea(){return head(selectedIdeaName,selectedIdeaPurpose,'<a class="link" href="#tablero">← Volver al tablero</a>')+tabbar(['Propuesta','Spec','Arquitectura','Documentos','Campaña'],['Propuesta','Spec','Arquitectura','Documentos','Campaña'].includes(tab)?tab:'Propuesta','section')+(tab==='Arquitectura'?architecture():tab==='Documentos'?reader(false):tab==='Campaña'?section('Campaña',`<div class="stack">${['Investigación','Producto','Diseño','Arquitectura','Construcción','Release'].map((t,i)=>`<div class="listrow"><span class="iconbox">${i<3?ico('check'):i+1}</span><div><strong>${t}</strong><p>${i===3?'Fase actual':'Recorrido del proyecto'}</p></div></div>`).join('')}${cmd('/pandacorp:architecture')}`):section(tab==='Spec'?'Spec':'Propuesta',`<div class="prose"><span class="eyebrow">Idea · retorno personal</span><h3>Volver a una historia sin perder el hilo</h3><p>Un compañero para recordar personajes, acontecimientos y conexiones de las historias que sigues, con el contexto que necesitas para continuar.</p><h3>La propuesta completa, cuando la necesitas</h3><p>Problema, solución, evidencia, riesgos, distribución y viabilidad mantienen su contenido íntegro en esta vista.</p></div><div class="row wrap">${pill('Arquitectura','lilac')}${pill('ai')}${pill('personal')}${btn('Descartar idea','discard-preview')}</div>`))}
function render(){const navPage=page==='idea'?'tablero':page;$('#mainnav').innerHTML=routes.map(([id,t])=>`<a href="#${id}" ${navPage===id?'aria-current="page"':''}>${t}${id==='propuestas'?' <span class="pill">261</span>':''}</a>`).join('');$('#content').innerHTML=({inicio:home,tablero:board,portfolio,propuestas:proposals,logros:achievements,documentacion:()=>head('Documentación','El conocimiento de la fábrica, con espacio para leer.')+reader(true),configuracion:configuration,idea}[page]||home)();document.title=(titles[page]||'Inicio')+' · Propuesta Mission Control';if(parent!==window)parent.postMessage({source:'mc-prototype',screen:page},location.protocol==='file:'?'*':location.origin)}
function route(){page=location.hash.slice(1)||'inicio';if(!titles[page])page='inicio';tab='Resumen';$('#mainnav').dataset.open='false';$('#menu').setAttribute('aria-expanded','false');$('#menu').setAttribute('aria-label','Abrir navegación');render()}
window.addEventListener('hashchange',route);
$('#menu').onclick=()=>{let open=$('#mainnav').dataset.open!=='true';$('#mainnav').dataset.open=String(open);$('#menu').setAttribute('aria-expanded',String(open));$('#menu').setAttribute('aria-label',open?'Cerrar navegación':'Abrir navegación')};
$('#theme').onclick=()=>{const light=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=light?'light':'dark';$('#theme').textContent=light?'Tema oscuro':'Tema claro'};
$('#font').onchange=e=>{document.documentElement.style.setProperty('--heading',e.target.value==='inter'?'Inter':e.target.value==='space'?'Space':'Manrope')};
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').hidden=true,2800)}
function dialog(title,body){openDialogTrigger=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#detail').showModal();$('#close-dialog').focus()}
$('#close-dialog').onclick=()=>$('#detail').close();$('#detail').addEventListener('close',()=>{if(openDialogTrigger?.isConnected)openDialogTrigger.focus()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mainnav').dataset.open==='true'){$('#mainnav').dataset.open='false';$('#menu').setAttribute('aria-expanded','false');$('#menu').setAttribute('aria-label','Abrir navegación');$('#menu').focus()}});
document.addEventListener('input',e=>{if(!['idea-search','idea-category'].includes(e.target.id))return;const q=($('#idea-search')?.value||'').toLowerCase(),cat=$('#idea-category')?.value;document.querySelectorAll('[data-idea]').forEach(x=>x.hidden=!x.dataset.idea.includes(q)||(cat&&x.dataset.category!==cat))});
document.addEventListener('change',e=>{if(e.target.id==='build-mode')$('#mode-command').innerHTML=cmd('/pandacorp:implement '+e.target.value);if(e.target.id==='project')toast('Selector ilustrativo: se conserva el workspace completo para cada proyecto.')});
document.addEventListener('click',async e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.ideaName){selectedIdeaName=el.dataset.ideaName;selectedIdeaPurpose=el.dataset.ideaPurpose}if(el.dataset.tab){tab=el.dataset.tab;render()}if(el.dataset.section){tab=el.dataset.section;render()}if(el.dataset.obs){obs=el.dataset.obs;render()}if(el.dataset.model){model=el.dataset.model;render()}if(el.dataset.doc){const title=el.dataset.doc;document.querySelectorAll('[data-doc]').forEach(x=>x.setAttribute('aria-pressed',String(x===el)));$('#article').innerHTML=`<span class="eyebrow">Documentación</span><h2>${title}</h2><p>Vista de lectura de la propuesta. El documento completo conserva títulos, enlaces, código y tablas en el producto.</p><h3>Contenido y referencias</h3><p>El índice pasa a ser desplegable en móvil para que el documento ocupe todo el ancho disponible.</p>${cmd('/pandacorp:change')}`;$('#doc-index').dataset.open='false';const b=$('[data-action=index]');b?.setAttribute('aria-expanded','false');if(b&&getComputedStyle(b).display!=='none')b.focus()}
if(el.dataset.copy){try{await navigator.clipboard.writeText(el.dataset.copy);toast('Comando de muestra copiado. No se ha ejecutado.')}catch{toast('Copia el texto del comando; el navegador bloqueó el portapapeles.')}}
const act=el.dataset.action;if(!act)return;
if(['portfolio','propuestas','tablero'].includes(act))location.hash=act;
else if(act==='seen'){$('#unseen').textContent='Al día en esta demo';el.textContent='Visto';el.disabled=true}
else if(act==='favorite'){const on=el.getAttribute('aria-pressed')!=='true';el.setAttribute('aria-pressed',String(on));el.style.color=on?'var(--amber)':'var(--muted)';toast(on?'Favorita en esta demo':'Favorito retirado en esta demo')}
else if(act==='index'){const open=$('#doc-index').dataset.open!=='true';$('#doc-index').dataset.open=String(open);el.setAttribute('aria-expanded',String(open))}
else if(act==='capture')dialog('Capturar ideas',`<p>Copia el comando que corresponde. Mission Control no lo ejecuta.</p>${cmd('/pandacorp:explore')}${cmd('/pandacorp:new-idea')}${cmd('/pandacorp:discover')}${cmd('/pandacorp:recommend')}`);
else if(act==='expand-model')dialog('Modelo de datos · ejemplo',`<p>En el producto se conservan el fullscreen de navegador, el fallback, el zoom y la navegación actuales. Esta demo solo muestra el tratamiento visual.</p><div class="graph"><div class="entities"><div class="entity"><h3>Project</h3><div>id · PK</div><div>name</div></div><span class="relationship">1 ── 0..*</span><div class="entity"><h3>WorkOrder</h3><div>id · PK</div><div>projectId · FK</div></div></div></div>`);
else if(act==='discard-preview')dialog('Descartar idea',`<p>El producto conservará motivo, confirmación y restauración. Esta propuesta no modifica la idea.</p>${btn('Cerrar sin cambios','close')}`);
else if(act==='close')$('#detail').close();
else if(act==='decisiones')dialog('Decisiones pendientes',`<p>Se conservan los puntos de decisión y su comando. La aprobación ocurre en el flujo actual, fuera de esta demo.</p>${cmd('/pandacorp:decide')}`);
else if(act==='discarded')dialog('Ideas descartadas',`<p>Se conservan la lista completa, el motivo y la opción de volver a agregar.</p><div class="listrow"><div><strong>Ejemplo de idea archivada</strong><p>Motivo de descarte y contenido original</p></div>${btn('Ver detalle','reference')}</div>`);
else if(act==='wo')dialog('Work order · ejemplo',`<div class="row between sectiontitle"><span class="mono muted">WO-04-004</span>${pill('✓ Verificado','green')}</div><h3>Navegación del proyecto</h3><p style="margin:var(--s3) 0 var(--s5)">Al refrescar, el usuario vuelve al mismo proyecto y sección.</p><details class="accordion" open><summary>Contrato</summary><p>Conservar proyecto, pestaña y documento al navegar, refrescar y usar Atrás.</p></details><details class="accordion"><summary>Implementación</summary><p>Un solo estado de navegación compartido por Portfolio y el workspace directo.</p></details><details class="accordion"><summary>Evidencia y notas</summary><p>Ejemplo de lectura de la revisión, comprobaciones y nota de estado.</p></details>`);
else if(act==='change')dialog('Detalle del cambio',`<div class="row sectiontitle">${pill('Listo','lilac')}${pill('Normal')}</div><h3>Mejorar lectura del resumen</h3><p style="margin:var(--s3) 0">El resumen prioriza decisiones y el último punto verificable; el contexto completo queda debajo.</p>${cmd('/pandacorp:implement change:summary-layout')}<p class="preview-note">Ejemplo visual: este cambio no se registra ni se ejecuta.</p>`);
else if(act==='lesson'||act==='backlog'||act==='reference'||act==='agent')dialog(act==='agent'?'Detalle del agente':'Detalle completo',`<p>El documento se lee aquí con mayor ancho, tipografía clara y acciones en un lugar consistente.</p><h3 style="margin-top:var(--s5)">Mismo contenido y mismas acciones</h3><p style="margin-top:var(--s3)">La propuesta conserva todos los campos originales. Los ejemplos están abreviados para evaluar el diseño.</p>${cmd(act==='backlog'?'/pandacorp:implement-backlog':'/pandacorp:learn')}`);
else toast('Control ilustrativo: conserva su comportamiento actual al implementarse.');
});

window.addEventListener('message',event=>{
 if(parent===window||event.source!==parent||event.data?.source!=='mc-preview')return;
 const {kind,value}=event.data;
 if(kind==='theme'&&['light','dark'].includes(value)){document.documentElement.dataset.theme=value;$('#theme').textContent=value==='dark'?'Tema claro':'Tema oscuro'}
 if(kind==='screen'&&Object.hasOwn(titles,value))location.hash=value;
});

if(new URLSearchParams(location.search).get('demo')==='off')document.querySelectorAll('[data-demo-only]').forEach(el=>el.hidden=true);
route();
</script>
</body></html>
