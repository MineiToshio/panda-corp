<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explorar maqueta · Mission Control</title>
<link rel="icon" href="assets/pandacorp.png"><link rel="stylesheet" href="assets/inter.css">
<style>
:root{color-scheme:dark;--bg:#0b0c11;--surface:#191a22;--raised:#242631;--text:#eff0f6;--muted:#a4a7bb;--line:#363847;--accent:#b7a9ff;--radius:10px;--space:16px;--width:1440px;--frame-height:calc(100dvh - 174px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,sans-serif}header{padding:16px 24px;border-bottom:1px solid var(--line);background:var(--surface)}.heading,.controls,.sizes{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.heading{justify-content:space-between;margin-bottom:12px}.heading p{margin:2px 0 0;color:var(--muted);font-size:12px}h1{font-size:16px;font-weight:600;letter-spacing:-.3px;margin:0}.tag{color:var(--accent);font-size:12px}.controls{justify-content:space-between}.sizes{gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius)}button,select,a{font:inherit;color:inherit;min-height:44px;border-radius:8px}button{border:0;padding:8px 12px;background:transparent;cursor:pointer}button[aria-pressed=true]{color:var(--accent);background:var(--raised)}select{background:var(--bg);border:1px solid var(--line);padding:8px;max-width:190px}label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.open{display:inline-flex;align-items:center;text-decoration:underline;text-underline-offset:3px;font-size:12px}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.stage{padding:20px 16px 12px}.viewport{width:min(100%,var(--width));margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px #0004}iframe{display:block;width:100%;height:max(500px,var(--frame-height));border:0;background:var(--bg)}.status{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}.skip{position:absolute;top:-100px}.skip:focus{top:0;background:var(--surface);padding:12px;z-index:2}@media(max-width:850px){:root{--frame-height:calc(100dvh - 220px)}header{padding:12px 16px}.controls{gap:8px}.tools{gap:8px}label{font-size:12px}.heading{align-items:flex-start}}@media(max-width:520px){:root{--frame-height:650px}.stage{padding:12px 6px}.tools label span{display:none}.open{min-height:44px}.sizes button{padding:8px 10px}}
</style>
</head>
<body>
<a class="skip" href="#viewport">Saltar a la maqueta</a>
<header>
<div class="heading"><div><h1>Mission Control · Órbita</h1><p>Ronda 5 · rediseño completo · navegación lateral, centro de mando, work orders por FRD y datos reales de toda la fábrica.</p></div><span class="tag">RONDA 5 · ÓRBITA</span></div>
<div class="controls"><div class="sizes" aria-label="Tamaño de vista"><button type="button" data-size="1440" aria-pressed="true">Escritorio</button><button type="button" data-size="768" aria-pressed="false">Tablet</button><button type="button" data-size="390" aria-pressed="false">Móvil</button></div><div class="tools"><label><span>Ir a</span><select id="screen" aria-label="Ir a una pantalla"><option value="inicio" selected>Inicio</option><option value="tablero">Tablero</option><option value="portfolio">Portfolio / proyecto</option><option value="propuestas">Propuestas</option><option value="logros">Logros</option><option value="documentacion">Documentación</option><option value="configuracion">Configuración</option><option value="idea">Detalle de idea</option></select></label><label><span>Tema</span><select id="appearance" aria-label="Tema de la maqueta"><option value="dark">Oscuro</option><option value="light">Claro</option></select></label><a class="open" href="index.html?round=5.28" target="_blank" rel="noopener">Abrir sin marco ↗</a></div></div>
</header>
<main class="stage"><div class="viewport" id="viewport"><iframe id="prototype" title="Maqueta navegable de Mission Control" src="index.html?demo=off&amp;round=5.28#inicio"></iframe></div><p class="status" id="width" aria-live="polite">Cargando vista…</p></main>
<script>
const frame=document.getElementById('prototype');
const allowedScreens=['inicio','tablero','portfolio','propuestas','logros','documentacion','configuracion','idea'];
const targetOrigin=location.protocol==='file:'?'*':location.origin;
function send(kind,value){frame.contentWindow.postMessage({source:'mc-preview',kind,value},targetOrigin)}
function updateWidth(){document.getElementById('width').textContent=Math.round(frame.getBoundingClientRect().width)+' px · navega dentro de la maqueta para explorar las secciones.'}
document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{document.documentElement.style.setProperty('--width',button.dataset.size+'px');document.querySelectorAll('[data-size]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));updateWidth()}));
document.getElementById('screen').addEventListener('change',e=>send('screen',e.target.value));
document.getElementById('appearance').addEventListener('change',e=>send('theme',e.target.value));
frame.addEventListener('load',()=>{send('theme',document.getElementById('appearance').value);updateWidth()});
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.data?.source!=='mc-prototype'||!allowedScreens.includes(event.data.screen))return;document.getElementById('screen').value=event.data.screen});
new ResizeObserver(updateWidth).observe(frame);
</script>
</body></html>
