<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Preflight fixture clean</title>
<style>
@font-face{font-family:'Fixture Sans';src:url(fonts/fixture.woff2) format('woff2');font-display:swap}
:root{--font-sans:'Fixture Sans',sans-serif;--bg:#ffffff;--fg:#111111;--accent:#0a6b66;--fs-body:16px;--sp:8px}
[data-theme="dark"]{--bg:#111111;--fg:#f5f5f5;--accent:#33b5aa}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans);font-size:var(--fs-body)}
[data-screen][hidden]{display:none}
.demo-strip{padding:var(--sp)}
.demo-badge{font-size:10px}
[data-demo="off"] [data-demo-only]{display:none}
.scroller{overflow-x:auto;width:100%}
.scroller .strip{width:900px;height:20px}
/* poster:css:begin. Export poster, scaled by --u. */
.pz{color:#ff00aa;width:300px}.pz-l{font-size:5px;color:rgba(0,0,0,.5)}
/* poster:css:end */
@media (hover:hover){.btn:hover{color:var(--accent)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.dot{width:var(--sp);height:var(--sp);animation:pulse 1s infinite}
.btn{padding:var(--sp)}

</style></head><body>
<div class="demo-strip" data-demo-only><span class="demo-badge">Solo demo</span></div>
<section data-screen="home"><h1>Home</h1><p>Readable body text on the home screen.</p><div class="scroller"><div class="strip">carousel</div></div><div class="pz"><span class="pz-l">poster glyphs</span></div><button class="btn">Go</button><span class="dot"></span></section>
<section data-screen="about" hidden><h1>About</h1><p>Readable body text on the about screen.</p></section>
<script>
function route(){var id=(location.hash||'#home').slice(1);document.querySelectorAll('[data-screen]').forEach(function(s){s.hidden=s.dataset.screen!==id})}
addEventListener('hashchange',route);route();
if(new URLSearchParams(location.search).get('demo')==='off')document.documentElement.dataset.demo='off';
</script>
</body></html>
