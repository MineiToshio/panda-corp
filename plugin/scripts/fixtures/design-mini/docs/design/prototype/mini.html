<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini prototype</title>
<style>
/* tokens */
:root{--bg:#ffffff;--fg:#161c22;--accent:#0a7d5a;--line:#7d8894}
[data-theme="dark"]{--bg:#12161b;--fg:#e8edf2;--accent:#3cc99a;--line:#55606b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 sans-serif}
h1{margin:0 0 12px;font-size:28px}
#home-title{letter-spacing:.5px}
/* PROTOTYPE-ONLY: demo scaffolding */
.demo-strip{background:#fc0;color:#000;padding:8px 16px}
[data-demo="off"] [data-demo-only]{display:none}
[data-demo="off"] .demo-badge{display:none}
/* end PROTOTYPE-ONLY */
.hdr{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.hdr a{color:var(--fg)}
.btn{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit;cursor:pointer}
.btn .ic{width:12px;height:12px;fill:currentColor}
@media (hover:hover){.btn:hover{background:var(--accent);color:#fff}}
.pop-wrap{position:relative;margin-left:auto}
.pop{position:absolute;top:calc(100% + 4px);right:0;min-width:160px;padding:12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.screen{padding:16px}
.spacer{height:1300px;border-left:4px solid var(--line)}
.card{padding:16px;border:1px solid var(--line);border-radius:8px;background:url(assets/dot.svg) no-repeat right 8px top 8px}
.photo{display:block;width:120px;height:80px}
.card-t{margin:0 0 8px}
.ic{width:12px;height:12px;fill:currentColor}
.probe::after{content:"fine"}
@media (hover:none) and (pointer:coarse){.probe::after{content:"touch"}}
.list{margin:0;padding:0 0 0 20px}
.list li{padding:4px 0}
@media (max-width:767px){.hdr{padding:8px 12px}.screen{padding:12px}}
html.host-auto .pop{position:static}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><symbol id="i-star" viewBox="0 0 10 10"><path d="M5 0L10 10H0Z"/></symbol></svg>
<div class="demo-strip" data-demo-only>Demo controls: switch session, reset data</div>
<header class="hdr">
  <a href="#home">Home</a>
  <a href="#list">List</a>
  <div class="pop-wrap">
    <button type="button" class="btn" id="menuBtn" aria-controls="menuPop" aria-expanded="false"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg>Menu</button>
    <div class="pop" id="menuPop" role="menu" hidden><a role="menuitem" href="#list">Popover: go to the list</a></div>
  </div>
</header>
<main>
  <section class="screen" data-screen="home">
    <h1 id="home-title">Home</h1>
    <p class="demo-note" data-demo-only>Demo note: only in the prototype</p>
    <span class="demo-badge">Solo demo</span>
    <label for="q">Search</label> <input id="q" name="q">
    <p class="probe">Pointer: </p>
    <div class="spacer"></div>
    <div class="card"><p class="card-t"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg> Featured</p><img class="photo" src="assets/photo.svg" alt="A green photo" loading="lazy" width="120" height="80"></div>
  </section>
  <section class="screen" data-screen="list" hidden>
    <h1>List</h1>
    <ul class="list"><li>One</li><li>Two</li><li>Three</li></ul>
  </section>
  <section class="screen" data-screen="gallery" data-demo-only hidden><h1>Review gallery</h1></section>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var root = document.documentElement;
  if (p.get('demo') === 'off') root.dataset.demo = 'off';
  root.dataset.theme = p.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  function route() {
    var id = (location.hash || '#home').slice(1);
    document.querySelectorAll('main > [data-screen]').forEach(function (s) { s.hidden = s.dataset.screen !== id; });
  }
  addEventListener('hashchange', route);
  route();
  var btn = document.getElementById('menuBtn');
  var pop = document.getElementById('menuPop');
  function setOpen(open) { pop.hidden = !open; btn.setAttribute('aria-expanded', String(open)); }
  btn.addEventListener('click', function () { setOpen(pop.hidden); });
  // a popover that closes on scroll and resize: captured viewport-only, without scrolling
  addEventListener('scroll', function () { setOpen(false); }, { passive: true });
  addEventListener('resize', function () { setOpen(false); });
  // the auto-height host mode: a tall viewport means a host that sizes the frame to the page
  function hostAuto() { if (p.get('host') !== 'page' && innerHeight >= 1400) root.classList.add('host-auto'); }
  addEventListener('resize', hostAuto);
  hostAuto();
})();
</script>
</body>
</html>
